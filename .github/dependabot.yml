# Dependabot version updates. See
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directory: "/"
    schedule:
      interval: "daily"
      # Wait a week before adopting newly released action versions.
    cooldown:
      default-days: 7
      exclude:
        - "ROCm/rocm-security-gh*"
    groups:
      rocm-security-gh:
        patterns: ["ROCm/rocm-security-gh*"]
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/llvm/docs"
    schedule:
      interval: "monthly"
    groups:
      llvm-docs-requirements:
        patterns:
          - "*"
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/amd/hipcc/docs/sphinx" # Location of package manifests
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    labels:
      - "documentation"

  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/amd/docs/sphinx" # Location of package manifests
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    labels:
      - "documentation"
      - "dependencies"