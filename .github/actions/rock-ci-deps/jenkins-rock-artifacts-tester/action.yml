name: Jenkins rock-artifacts-tester
description: >
  Trigger the Jenkins artifacts tester against a GitHub Actions run and block
  until the Jenkins build finishes. Fails unless the build result is SUCCESS.
  Runs on the job runner (python3 + requests); no extra Docker image is needed.
  
inputs:
  jenkins_host:
    description: Jenkins base URL.
    required: true
  jenkins_user:
    description: Jenkins user for basic auth.
    required: true
  jenkins_token:
    description: Jenkins API token for basic auth.
    required: true
  jenkins_job:
    description: Jenkins job name to build.
    required: false
    default: rock-artifacts-tester
  artifacts_run_id:
    description: GitHub Actions run id holding the artifacts under test.
    required: true
  gpu_target:
    description: GPU family the tester should run on.
    required: false
    default: gfx90a
  poll_interval_seconds:
    description: Seconds between Jenkins status polls.
    required: false
    default: "60"
  timeout_minutes:
    description: Give up if the Jenkins build has not finished within this window.
    required: false
    default: "300"

outputs:
  build_url:
    description: URL of the Jenkins build, empty if it never left the queue.
    value: ${{ steps.collect.outputs.build_url }}
  result:
    description: Jenkins build result, empty if the build never reported one.
    value: ${{ steps.collect.outputs.result }}

runs:
  using: composite
  steps:
    - name: Trigger and wait for the Jenkins build
      shell: bash
      env:
        JENKINS_HOST: ${{ inputs.jenkins_host }}
        JENKINS_USER: ${{ inputs.jenkins_user }}
        JENKINS_TOKEN: ${{ inputs.jenkins_token }}
        JENKINS_JOB: ${{ inputs.jenkins_job }}
        ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
        GPU_TARGET: ${{ inputs.gpu_target }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        JENKINS_OUTPUT_FILE: ${{ runner.temp }}/jenkins-result.env         
      run: |
        set -euo pipefail
        python3 -m pip install --user -q requests
        python3 "${GITHUB_ACTION_PATH}/trigger_and_wait.py"

    - name: Collect Jenkins build outputs
      id: collect
      if: always()
      shell: bash
      env:
        RESULT_FILE: ${{ runner.temp }}/jenkins-result.env
      run: |
        set -euo pipefail
        if [[ ! -f "$RESULT_FILE" ]]; then
          echo "Jenkins never wrote a result file."
          exit 0
        fi        
