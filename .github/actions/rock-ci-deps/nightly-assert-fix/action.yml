name: Nightly LLVM assertion fixes
description: >
  Temporary llvm-project patches applied before fetch_sources when
  LLVM assertions are enabled. Remove each step once its upstream fix merges.

runs:
  using: composite
  steps:
    # Apply the wave32 EXEC CFI carry only while copyToScratchSGPR still has
    # the assert. amd-staging rewrote that function to buildCFIForSRegToSRegSpill;
    # leaving the patch in place then makes git am fail before any later patch.
    - name: Carry wave32 EXEC CFI patch - temp for assertion on (TheRock #6102)
      if: ${{ env.LLVM_ASSERTIONS == '1' }}
      shell: bash
      run: |
        set -x
        git config --global --add safe.directory "$PWD"
        mkdir -p patches/amd-mainline/llvm-project
        git fetch --no-tags --depth 1 https://github.com/ROCm/TheRock.git \
          d9189b378f8fdc2525acaf6975deee29538ba48d
        patch=patches/amd-mainline/llvm-project/0001-AMDGPU-no-EXEC-pair-CFI-for-single-subregister-EXEC.patch
        git show FETCH_HEAD:"$patch" > "$patch"
        sed -i '/^index /d' "$patch"
        if git -C compiler/amd-llvm apply --check "$PWD/$patch"; then
          echo "CFI carry patch applies; fetch_sources will apply it."
        else
          echo "CFI carry patch does not apply; amd-llvm already rewrote copyToScratchSGPR. Skipping."
          rm -f "$patch"
        fi

    # Temp fix for the assertion on - this needs to be removed once the merge happens
    - name: Carry ObjectYAML VERS part size fix - temp for assertion on (llvm/llvm-project 221137)
      if: ${{ env.LLVM_ASSERTIONS == '1' }}
      shell: bash
      run: |
        set -x
        git config --global --add safe.directory "$PWD"
        mkdir -p patches/amd-mainline/llvm-project
        git fetch --no-tags --depth 2 https://github.com/llvm/llvm-project.git \
          refs/pull/221137/head
        git format-patch -1 --stdout FETCH_HEAD \
          | sed '/^index /d' \
          > patches/amd-mainline/llvm-project/0002-ObjectYAML-VERS-part-size.patch

    - name: Carry isUniformLoad power-of-2 alignment fix - temp for assertion on (gfx125X math-libs)
      if: ${{ env.LLVM_ASSERTIONS == '1' }}
      shell: bash
      run: |
        set -x
        mkdir -p patches/amd-mainline/llvm-project
        cat > patches/amd-mainline/llvm-project/0003-AMDGPU-isUniformLoad-power-of-2-alignment.patch <<'EOF'
        From 0000000000000000000000000000000000000000 Mon Sep 17 00:00:00 2001
        From: Andrey Kasaurov <andrey.kasaurov@amd.com>
        Date: Wed, 4 Nov 2026 23:45:07 -0500
        Subject: [PATCH] [AMDGPU] Use a power-of-2 alignment in isUniformLoad
        
        isUniformLoad required Load->getAlign() >= Align(min(MemSize, 4)). For a
        load with a 3-byte memory size this constructs Align(3), which asserts
        "Alignment is not a power of 2" in builds with assertions. It was hit by
        rocThrust's pair_scan_by_key on gfx1250. Without assertions Align(3)
        becomes Align(2). Round the size down to a power of 2, which keeps that
        behaviour and no longer asserts.
        
        The (truncate (load)) DAG combine reaches this through
        isTypeDesirableForOp on targets with scalar subword loads (gfx12).
        ---
         llvm/lib/Target/AMDGPU/SIISelLowering.cpp     |  5 +-
         .../AMDGPU/uniform-load-3byte-align.ll        | 97 +++++++++++++++++++
         2 files changed, 100 insertions(+), 2 deletions(-)
         create mode 100644 llvm/test/CodeGen/AMDGPU/uniform-load-3byte-align.ll
        
        diff --git a/llvm/lib/Target/AMDGPU/SIISelLowering.cpp b/llvm/lib/Target/AMDGPU/SIISelLowering.cpp
        --- a/llvm/lib/Target/AMDGPU/SIISelLowering.cpp
        +++ b/llvm/lib/Target/AMDGPU/SIISelLowering.cpp
        @@ -2583,10 +2583,11 @@ bool SITargetLowering::isUniformLoad(const LoadSDNode *Load) const {
           if (Load->isDivergent() && !AMDGPU::isUniformMMO(MMO))
             return false;
        
        +  // The memory size need not be a power of 2 (e.g. a 3-byte load).
           return MMO->getSize().hasValue() &&
                  Load->getAlign() >=
        -             Align(std::min(MMO->getSize().getValue().getKnownMinValue(),
        -                            uint64_t(4))) &&
        +             Align(llvm::bit_floor(std::min(
        +                 MMO->getSize().getValue().getKnownMinValue(), uint64_t(4)))) &&
                  (MMO->isInvariant() ||
                   (Load->getAddressSpace() == AMDGPUAS::CONSTANT_ADDRESS ||
                    Load->getAddressSpace() == AMDGPUAS::CONSTANT_ADDRESS_32BIT) ||
        diff --git a/llvm/test/CodeGen/AMDGPU/uniform-load-3byte-align.ll b/llvm/test/CodeGen/AMDGPU/uniform-load-3byte-align.ll
        new file mode 100644
        --- /dev/null
        +++ b/llvm/test/CodeGen/AMDGPU/uniform-load-3byte-align.ll
        @@ -0,0 +1,97 @@
        +; NOTE: Assertions have been autogenerated by utils/update_llc_test_checks.py UTC_ARGS: --version 6
        +; RUN: llc -mtriple=amdgpu12.50-amd-amdhsa < %s | FileCheck -check-prefix=GFX1250 %s
        +; RUN: llc -mtriple=amdgpu12.00-amd-amdhsa < %s | FileCheck -check-prefix=GFX1200 %s
        +
        +; A uniform load with a 3-byte memory size reaches isUniformLoad through the
        +; (truncate (load)) DAG combine on targets with scalar subword loads. The
        +; required alignment must stay a power of 2.
        +
        +define amdgpu_kernel void @uniform_i24_load_multi_use(ptr addrspace(4) %in, ptr addrspace(1) %out) {
        +; GFX1250-LABEL: uniform_i24_load_multi_use:
        +; GFX1250:       ; %bb.0:
        +; GFX1250-NEXT:    s_setreg_imm32_b32 hwreg(HW_REG_WAVE_MODE, 25, 1), 1 ; msbs: dst=0 src0=0 src1=0 src2=0
        +; GFX1250-NEXT:    s_mov_b64 s[64:65], 0
        +; GFX1250-NEXT:    v_nop
        +; GFX1250-NEXT:    global_prefetch_b8 v0, s[64:65] scope:SCOPE_SE
        +; GFX1250-NEXT:    s_load_b128 s[0:3], s[4:5], 0x0 nv
        +; GFX1250-NEXT:    v_mov_b32_e32 v0, 0
        +; GFX1250-NEXT:    s_wait_kmcnt 0x0
        +; GFX1250-NEXT:    global_load_u16 v1, v0, s[0:1] nv
        +; GFX1250-NEXT:    s_wait_xcnt 0x0
        +; GFX1250-NEXT:    s_load_u8 s0, s[0:1], 0x2 nv
        +; GFX1250-NEXT:    s_wait_kmcnt 0x0
        +; GFX1250-NEXT:    s_lshl_b32 s0, s0, 16
        +; GFX1250-NEXT:    s_wait_loadcnt 0x0
        +; GFX1250-NEXT:    v_or_b32_e32 v2, s0, v1
        +; GFX1250-NEXT:    s_clause 0x1
        +; GFX1250-NEXT:    global_store_b16 v0, v1, s[2:3]
        +; GFX1250-NEXT:    global_store_b32 v0, v2, s[2:3] offset:4
        +; GFX1250-NEXT:    s_endpgm
        +;
        +; GFX1200-LABEL: uniform_i24_load_multi_use:
        +; GFX1200:       ; %bb.0:
        +; GFX1200-NEXT:    s_load_b128 s[0:3], s[4:5], 0x0
        +; GFX1200-NEXT:    v_mov_b32_e32 v0, 0
        +; GFX1200-NEXT:    s_wait_kmcnt 0x0
        +; GFX1200-NEXT:    global_load_u16 v1, v0, s[0:1]
        +; GFX1200-NEXT:    s_load_u8 s0, s[0:1], 0x2
        +; GFX1200-NEXT:    s_wait_kmcnt 0x0
        +; GFX1200-NEXT:    s_lshl_b32 s0, s0, 16
        +; GFX1200-NEXT:    s_wait_loadcnt 0x0
        +; GFX1200-NEXT:    v_or_b32_e32 v2, s0, v1
        +; GFX1200-NEXT:    s_clause 0x1
        +; GFX1200-NEXT:    global_store_b16 v0, v1, s[2:3]
        +; GFX1200-NEXT:    global_store_b32 v0, v2, s[2:3] offset:4
        +; GFX1200-NEXT:    s_endpgm
        +  %v = load i24, ptr addrspace(4) %in, align 1
        +  %t = trunc i24 %v to i16
        +  store i16 %t, ptr addrspace(1) %out, align 2
        +  %z = zext i24 %v to i32
        +  %o2 = getelementptr i32, ptr addrspace(1) %out, i64 1
        +  store i32 %z, ptr addrspace(1) %o2, align 4
        +  ret void
        +}
        +
        +define amdgpu_kernel void @uniform_i24_load_fields(ptr addrspace(4) %in, ptr addrspace(1) %out) {
        +; GFX1250-LABEL: uniform_i24_load_fields:
        +; GFX1250:       ; %bb.0:
        +; GFX1250-NEXT:    s_setreg_imm32_b32 hwreg(HW_REG_WAVE_MODE, 25, 1), 1 ; msbs: dst=0 src0=0 src1=0 src2=0
        +; GFX1250-NEXT:    s_mov_b64 s[64:65], 0
        +; GFX1250-NEXT:    v_nop
        +; GFX1250-NEXT:    global_prefetch_b8 v0, s[64:65] scope:SCOPE_SE
        +; GFX1250-NEXT:    s_load_b128 s[0:3], s[4:5], 0x0 nv
        +; GFX1250-NEXT:    s_wait_kmcnt 0x0
        +; GFX1250-NEXT:    s_clause 0x1
        +; GFX1250-NEXT:    s_load_u16 s4, s[0:1], 0x0 nv
        +; GFX1250-NEXT:    s_load_u8 s5, s[0:1], 0x2 nv
        +; GFX1250-NEXT:    s_wait_kmcnt 0x0
        +; GFX1250-NEXT:    v_dual_mov_b32 v0, 0 :: v_dual_mov_b32 v1, s4
        +; GFX1250-NEXT:    v_mov_b32_e32 v2, s5
        +; GFX1250-NEXT:    s_clause 0x1
        +; GFX1250-NEXT:    global_store_b16 v0, v1, s[2:3]
        +; GFX1250-NEXT:    global_store_b8 v0, v2, s[2:3] offset:2
        +; GFX1250-NEXT:    s_endpgm
        +;
        +; GFX1200-LABEL: uniform_i24_load_fields:
        +; GFX1200:       ; %bb.0:
        +; GFX1200-NEXT:    s_load_b128 s[0:3], s[4:5], 0x0
        +; GFX1200-NEXT:    s_wait_kmcnt 0x0
        +; GFX1200-NEXT:    s_clause 0x1
        +; GFX1200-NEXT:    s_load_u16 s4, s[0:1], 0x0
        +; GFX1200-NEXT:    s_load_u8 s0, s[0:1], 0x2
        +; GFX1200-NEXT:    s_wait_kmcnt 0x0
        +; GFX1200-NEXT:    v_dual_mov_b32 v0, 0 :: v_dual_mov_b32 v1, s4
        +; GFX1200-NEXT:    v_mov_b32_e32 v2, s0
        +; GFX1200-NEXT:    s_clause 0x1
        +; GFX1200-NEXT:    global_store_b16 v0, v1, s[2:3]
        +; GFX1200-NEXT:    global_store_b8 v0, v2, s[2:3] offset:2
        +; GFX1200-NEXT:    s_endpgm
        +  %v = load i24, ptr addrspace(4) %in, align 2
        +  %lo = trunc i24 %v to i16
        +  %sh = lshr i24 %v, 16
        +  %hi = trunc i24 %sh to i8
        +  store i16 %lo, ptr addrspace(1) %out, align 2
        +  %o2 = getelementptr i8, ptr addrspace(1) %out, i64 2
        +  store i8 %hi, ptr addrspace(1) %o2, align 1
        +  ret void
        +}
        EOF
