name: LLVM submodule & PR-parameter setup
description: >
  On pull_request updates amd-llvm submodule pointer to PR head and aligns
  spirv-llvm-translator and hipify with amd-staging tip.
  On nightly schedule (and nightly workflow_dispatch without PR params) points
  compiler/amd-llvm, spirv-llvm-translator, and hipify at their amd-staging tips.  
  On workflow_dispatch downloads PR params artifact, sources env, merges an upstream PR, commit, or branch onto the amd-staging tip, updates submodule pointers.

inputs:
  params_artifact_name:
    description: Artifact name for multiple-pr-build-params
    required: false
    default: multiple-pr-build-params

runs:
  using: composite
  steps:
    - name: Update Submodule Pointer to the PR
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        git config --global --add safe.directory "$PWD"
        # Fetch the latest commit SHA from the PR branch
        PR_SHA=${{ github.event.pull_request.head.sha }}
        # Update the submodule pointer using cacheinfo
        git update-index --cacheinfo 160000,$PR_SHA,compiler/amd-llvm
        git config --global user.email "z1-cciauto@amd.com"
        git config --global user.name "Z1 cciauto"
        
        trim_sha() {
          printf '%s' "$1" | tr -d '[:space:]'
        }

        read_amd_staging_tip() {
          local repo_url="$1"
          trim_sha "$(git ls-remote "${repo_url}" refs/heads/amd-staging | awk '{print $1}')"
        }

        PR_SHA="$(trim_sha "${{ github.event.pull_request.head.sha }}")"
        echo "ROCm LLVM PR head SHA: $PR_SHA"
        git update-index --cacheinfo 160000,"$PR_SHA",compiler/amd-llvm

        SPIRV_SHA="$(read_amd_staging_tip https://github.com/ROCm/SPIRV-LLVM-Translator.git)"
        echo "SPIRV amd-staging tip SHA: $SPIRV_SHA"
        git update-index --cacheinfo 160000,"$SPIRV_SHA",compiler/spirv-llvm-translator

        HIPIFY_SHA="$(read_amd_staging_tip https://github.com/ROCm/HIPIFY.git)"
        echo "HIPIFY amd-staging tip SHA: $HIPIFY_SHA"
        git update-index --cacheinfo 160000,"$HIPIFY_SHA",compiler/hipify

        if [[ -z "$SPIRV_SHA" || -z "$HIPIFY_SHA" ]]; then
          echo "::error::Failed to resolve SPIRV/HIPIFY amd-staging tip SHAs." >&2
          exit 1
        fi
        
        git commit -m "Update compiler submodule references for llvm-project PR"
        git submodule update --init --depth 1 --jobs 4 \
          compiler/amd-llvm \
          compiler/spirv-llvm-translator \
          compiler/hipify
        # Verify the pointer update
        git submodule status
        git submodule

    - name: Update Submodule Pointer at compiler/amd-llvm for manual debug
      if: ${{ github.event_name != 'pull_request' && github.workflow == 'ROCK CI Windows Debug Support' }}
      shell: bash
      run: |
        git config --global --add safe.directory $PWD
        git config --global user.email "z1-cciauto@amd.com"
        git config --global user.name "Z1 cciauto"
        trim_sha() {
          printf '%s' "$1" | tr -d '[:space:]'
        }

        read_amd_staging_tip() {
          local repo_url="$1"
          trim_sha "$(git ls-remote "${repo_url}" refs/heads/amd-staging | awk '{print $1}')"
        }

        BRANCH_SHA="$(trim_sha "$GITHUB_SHA")"
        echo "ROCm LLVM branch SHA: $BRANCH_SHA"
        if [[ -z "$BRANCH_SHA" ]]; then
          echo "::error::GITHUB_SHA is empty." >&2
          exit 1
        fi
        git update-index --cacheinfo 160000,"$BRANCH_SHA",compiler/amd-llvm

        SPIRV_SHA="$(read_amd_staging_tip https://github.com/ROCm/SPIRV-LLVM-Translator.git)"
        echo "SPIRV amd-staging tip SHA: $SPIRV_SHA"
        git update-index --cacheinfo 160000,"$SPIRV_SHA",compiler/spirv-llvm-translator

        HIPIFY_SHA="$(read_amd_staging_tip https://github.com/ROCm/HIPIFY.git)"
        echo "HIPIFY amd-staging tip SHA: $HIPIFY_SHA"
        git update-index --cacheinfo 160000,"$HIPIFY_SHA",compiler/hipify

        if [[ -z "$SPIRV_SHA" || -z "$HIPIFY_SHA" ]]; then
          echo "::error::Failed to resolve SPIRV/HIPIFY amd-staging tip SHAs." >&2
          exit 1
        fi

        git commit -m "Update compiler submodule references for Windows debug branch"
        git submodule update --init --depth 1 --jobs 4 \
          compiler/amd-llvm \
          compiler/spirv-llvm-translator \
          compiler/hipify
        git submodule status
        git submodule

    - name: Download LLVM, SPIRV and HIPIFY PR's stored in file
      if: github.event_name == 'workflow_dispatch'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.params_artifact_name }}
        path: .

    - name: Check for parameterised PR trigger
      id: check_parameterised_trigger
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      run: |
        ENV_FILE="./${{ github.run_id }}_PR_params.env"
        if [ -f "$ENV_FILE" ]; then
          echo "parameterised_trigger=true" >> "$GITHUB_OUTPUT"
        else
          echo "parameterised_trigger=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Source the multiple PR's of params
      if: github.event_name == 'workflow_dispatch' && steps.check_parameterised_trigger.outputs.parameterised_trigger == 'true'
      shell: bash
      run: |
        set -a
        source "./${{ github.run_id }}_PR_params.env"
        set +a
        echo "LLVM_UPSTREAM_REF=${LLVM_UPSTREAM_REF:-${LLVM_PR_URL:-}}" >> "$GITHUB_ENV"
        echo "LLVM_ROCm_PR_URL=${LLVM_ROCm_PR_URL:-}" >> "$GITHUB_ENV"
        echo "SPIRV_REF=${SPIRV_REF:-${SPIRV_PR_URL:-}}" >> "$GITHUB_ENV"
        echo "SPIRV_PR_URL=${SPIRV_PR_URL:-}" >> "$GITHUB_ENV"
        echo "HIPIFY_PR_URL=${HIPIFY_PR_URL:-}" >> "$GITHUB_ENV"

    - name: Update submodule pointers from provided parameter PR values
      if: github.event_name == 'workflow_dispatch' && steps.check_parameterised_trigger.outputs.parameterised_trigger == 'true'
      shell: bash
      run: |
        git config --global --add safe.directory "$PWD"
        git config --global user.email "z1-cciauto@amd.com"
        git config --global user.name "Z1 cciauto"

        trim_sha() {
          printf '%s' "$1" | tr -d '[:space:]'
        }

        read_amd_staging_tip() {
          local repo_url="$1"
          trim_sha "$(git ls-remote "${repo_url}" refs/heads/amd-staging | awk '{print $1}')"
        }

        get_pr_sha() {
          local pr_url="$1"
          local base_repo_url pr_num sha
          base_repo_url="$(echo "$pr_url" | sed 's|/pull/.*||')"
          pr_num="$(echo "$pr_url" | sed 's|.*/pull/||')"
          sha="$(git ls-remote "${base_repo_url}.git" "refs/pull/${pr_num}/head" | awk '{print $1}')"
          trim_sha "$sha"
        }

        merge_upstream_refs() {
          local refs="$1"
          local item repo num sha branch base_sha owner
          local upstream_git="https://github.com/llvm/llvm-project.git"
          # Merge each upstream PR, commit, or branch onto the current ROCm
          # amd-staging tip. Depth 1000 keeps the shared ancestor available.
          base_sha="$(read_amd_staging_tip https://github.com/ROCm/llvm-project.git)"
          if [[ -z "$base_sha" || ${#base_sha} -ne 40 ]]; then
            echo "::error::Failed to resolve ROCm/llvm-project amd-staging tip." >&2
            exit 1
          fi
          echo "Checking out ROCm/llvm-project amd-staging tip ${base_sha} before merge" >&2
          git update-index --cacheinfo 160000,"$base_sha",compiler/amd-llvm
          git submodule update --init --depth 1000 --jobs 1 compiler/amd-llvm
          merge_fetch_head() {
            local label="$1"
            git -C compiler/amd-llvm merge --no-edit FETCH_HEAD || {
              echo "::error::Failed to merge ${label} onto ROCm/llvm-project amd-staging." >&2
              exit 1
            }
          }
          # Fetch into a fixed local ref. A refspec is source:dest, so a
          # branch name that contains ':' would be split if passed directly.
          fetch_branch() {
            local remote_git="$1"
            local branch="$2"
            local label="$3"
            git -C compiler/amd-llvm fetch --depth=1000 "$remote_git" \
              "+refs/heads/${branch}:refs/remotes/upstream-verify/head" || {
              echo "::error::Failed to fetch ${label}." >&2
              exit 1
            }
            merge_fetch_head "$label"
          }
          IFS=',' read -ra REFS <<< "$refs"
          for item in "${REFS[@]}"; do
            item="$(echo "$item" | xargs)"
            [[ -z "$item" ]] && continue
            if [[ "$item" == *"/pull/"* ]]; then
              repo="$(echo "$item" | sed 's|/pull/.*||')"
              num="$(echo "$item" | sed 's|.*/pull/||' | sed 's|[^0-9].*||')"
              echo "Merging upstream PR #${num} from ${item} onto ROCm/llvm-project amd-staging" >&2
              git -C compiler/amd-llvm fetch --depth=1000 "${repo}.git" "refs/pull/${num}/head" || {
                echo "::error::Failed to fetch upstream PR #${num}." >&2
                exit 1
              }
              merge_fetch_head "upstream PR #${num}"
            elif [[ "$item" == *"/commit/"* ]]; then
              sha="$(echo "$item" | sed 's|.*/commit/||' | sed 's|[/#?].*||')"
              echo "Merging upstream commit ${sha} onto ROCm/llvm-project amd-staging" >&2
              git -C compiler/amd-llvm fetch --depth=1000 "$upstream_git" "$sha" || {
                echo "::error::Failed to fetch upstream commit ${sha}." >&2
                exit 1
              }
              merge_fetch_head "upstream commit ${sha}"
            elif [[ "$item" == *"/tree/"* ]]; then
              repo="$(echo "$item" | sed 's|/tree/.*||')"
              branch="$(echo "$item" | sed 's|.*/tree/||' | sed 's|[?#].*||')"
              echo "Merging branch ${branch} from ${repo} onto ROCm/llvm-project amd-staging" >&2
              fetch_branch "${repo}.git" "$branch" "branch ${branch} from ${repo}"
            elif [[ "$item" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "Merging upstream commit ${item} onto ROCm/llvm-project amd-staging" >&2
              git -C compiler/amd-llvm fetch --depth=1000 "$upstream_git" "$item" || {
                echo "::error::Failed to fetch upstream commit ${item}." >&2
                exit 1
              }
              merge_fetch_head "upstream commit ${item}"
            elif [[ "$item" != *"://"* && "$item" == *":"* ]]; then
              # GitHub fork shorthand: owner:branch
              owner="${item%%:*}"
              branch="${item#*:}"
              repo="https://github.com/${owner}/llvm-project"
              echo "Merging ${owner}/llvm-project branch ${branch} onto ROCm/llvm-project amd-staging" >&2
              fetch_branch "${repo}.git" "$branch" "${owner}/llvm-project branch ${branch}"
            else
              echo "Merging upstream branch ${item} onto ROCm/llvm-project amd-staging" >&2
              fetch_branch "$upstream_git" "$item" "upstream branch ${item}"
            fi
          done
          MERGED_LLVM_SHA="$(trim_sha "$(git -C compiler/amd-llvm rev-parse HEAD)")"
        }

        expand_commit_sha() {
          local repo_git="$1"
          local short="$2"
          local slug json full
          slug="$(printf '%s' "$repo_git" | sed -e 's|https://github.com/||' -e 's|\.git$||')"
          json="$(curl -fsS "https://api.github.com/repos/${slug}/commits/${short}")" || true
          full="$(printf '%s' "$json" | grep -o '"sha"[[:space:]]*:[[:space:]]*"[0-9a-fA-F]\{40\}"' | head -1 | grep -o '[0-9a-fA-F]\{40\}')"
          trim_sha "$full"
        }

        # Pin compiler/spirv-llvm-translator to a PR, commit, or branch.
        # Same ref forms as LLVM_UPSTREAM_REF. The submodule records that
        # commit; it is not merged onto the SPIRV amd-staging tip.
        resolve_spirv_ref() {
          local item="$1"
          local default_git="https://github.com/ROCm/SPIRV-LLVM-Translator.git"
          local repo branch owner sha
          if [[ "$item" == *"/pull/"* ]]; then
            sha="$(get_pr_sha "$item")"
          elif [[ "$item" == *"/commit/"* ]]; then
            repo="$(echo "$item" | sed 's|/commit/.*||')"
            sha="$(echo "$item" | sed 's|.*/commit/||' | sed 's|[/#?].*||')"
            if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              sha="$(expand_commit_sha "${repo}.git" "$sha")"
            fi
          elif [[ "$item" == *"/tree/"* ]]; then
            repo="$(echo "$item" | sed 's|/tree/.*||')"
            branch="$(echo "$item" | sed 's|.*/tree/||' | sed 's|[?#].*||')"
            sha="$(trim_sha "$(git ls-remote "${repo}.git" "refs/heads/${branch}" | awk '{print $1}')")"
          elif [[ "$item" =~ ^[0-9a-fA-F]{40}$ ]]; then
            sha="$item"
          elif [[ "$item" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            sha="$(expand_commit_sha "$default_git" "$item")"
          elif [[ "$item" != *"://"* && "$item" == *":"* ]]; then
            owner="${item%%:*}"
            branch="${item#*:}"
            sha="$(trim_sha "$(git ls-remote "https://github.com/${owner}/SPIRV-LLVM-Translator.git" "refs/heads/${branch}" | awk '{print $1}')")"
          else
            sha="$(trim_sha "$(git ls-remote "$default_git" "refs/heads/${item}" | awk '{print $1}')")"
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Failed to resolve SPIRV ref ${item}." >&2
            exit 1
          fi
          printf '%s' "$sha"
        }

        LLVM_SHA=""

        if [[ -n "${LLVM_ROCm_PR_URL:-}" ]]; then
          LLVM_SHA="$(get_pr_sha "$LLVM_ROCm_PR_URL")"
          echo "ROCm LLVM head SHA: $LLVM_SHA"
        elif [[ -n "${LLVM_UPSTREAM_REF:-}" ]]; then
          merge_upstream_refs "$LLVM_UPSTREAM_REF"
          LLVM_SHA="$MERGED_LLVM_SHA"
          echo "Final upstream LLVM SHA: $LLVM_SHA" >&2
        fi

        if [[ -n "$LLVM_SHA" ]]; then
          git update-index --cacheinfo 160000,"$LLVM_SHA","compiler/amd-llvm"
        fi

        spirv_ref="${SPIRV_REF:-${SPIRV_PR_URL:-}}"
        if [[ -n "$spirv_ref" ]]; then
          SPIRV_SHA="$(resolve_spirv_ref "$spirv_ref")"
          echo "SPIRV ref ${spirv_ref} -> ${SPIRV_SHA}"
          git update-index --cacheinfo 160000,"$SPIRV_SHA","compiler/spirv-llvm-translator"
        else
          SPIRV_SHA="$(read_amd_staging_tip https://github.com/ROCm/SPIRV-LLVM-Translator.git)"
          echo "SPIRV ref not passed, defaulting to the amd-staging tip : $SPIRV_SHA"
          git update-index --cacheinfo 160000,"$SPIRV_SHA","compiler/spirv-llvm-translator"
        fi

        if [[ -n "${HIPIFY_PR_URL:-}" ]]; then
          HIPIFY_SHA="$(get_pr_sha "$HIPIFY_PR_URL")"
          echo "HIPIFY head SHA: $HIPIFY_SHA"
          git update-index --cacheinfo 160000,"$HIPIFY_SHA","compiler/hipify"
        else
          HIPIFY_SHA="$(read_amd_staging_tip https://github.com/ROCm/HIPIFY.git)"
          echo "HIPIFY PR NOT Passed, defaulting to the amd-staging tip : $HIPIFY_SHA"
          git update-index --cacheinfo 160000,"$HIPIFY_SHA","compiler/hipify"
        fi

        if [[ -z "$SPIRV_SHA" || -z "$HIPIFY_SHA" ]]; then
          echo "::error::Failed to resolve SPIRV/HIPIFY amd-staging tip SHAs." >&2
          exit 1
        fi

        git commit -m "Update submodule references from PR URLs"
        git submodule update --init --depth 1 --jobs 4 \
          compiler/amd-llvm \
          compiler/spirv-llvm-translator \
          compiler/hipify
        git submodule status
        git submodule

    - name: Point compiler submodules at amd-staging tip for nightly
      if: contains(github.workflow, 'Nightly') && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && steps.check_parameterised_trigger.outputs.parameterised_trigger != 'true'))
      shell: bash
      run: |
        git config --global --add safe.directory "$PWD"
        git config --global user.email "z1-cciauto@amd.com"
        git config --global user.name "Z1 cciauto"
        read_amd_staging_tip() {
          git ls-remote "$1" refs/heads/amd-staging | awk '{print $1}' | tr -d '[:space:]'
        }
        LLVM_SHA="$(read_amd_staging_tip https://github.com/ROCm/llvm-project.git)"
        SPIRV_SHA="$(read_amd_staging_tip https://github.com/ROCm/SPIRV-LLVM-Translator.git)"
        HIPIFY_SHA="$(read_amd_staging_tip https://github.com/ROCm/HIPIFY.git)"
        echo "Nightly llvm-project amd-staging tip: $LLVM_SHA"
        echo "Nightly SPIRV amd-staging tip: $SPIRV_SHA"
        echo "Nightly HIPIFY amd-staging tip: $HIPIFY_SHA"
        if [[ -z "$LLVM_SHA" || ${#LLVM_SHA} -ne 40 || -z "$SPIRV_SHA" || ${#SPIRV_SHA} -ne 40 || -z "$HIPIFY_SHA" || ${#HIPIFY_SHA} -ne 40 ]]; then
          echo "::error::Failed to resolve amd-staging tips for llvm-project, SPIRV, or HIPIFY." >&2
          exit 1
        fi
        git update-index --cacheinfo 160000,"$LLVM_SHA",compiler/amd-llvm
        git update-index --cacheinfo 160000,"$SPIRV_SHA",compiler/spirv-llvm-translator
        git update-index --cacheinfo 160000,"$HIPIFY_SHA",compiler/hipify
        git commit -m "Point compiler submodules at amd-staging tip for nightly"
        git submodule update --init --depth 1 --jobs 4 \
          compiler/amd-llvm \
          compiler/spirv-llvm-translator \
          compiler/hipify
        git submodule status \
          compiler/amd-llvm \
          compiler/spirv-llvm-translator \
          compiler/hipify

    - name: Enable LLVM assertions for Wavetransform
      if: github.event_name == 'workflow_dispatch' && steps.check_parameterised_trigger.outputs.parameterised_trigger == 'true'
      shell: bash
      run: |
        if [[ -z "${LLVM_ROCm_PR_URL:-}" ]]; then
          echo "No LLVM_ROCm_PR_URL; leaving LLVM assertions off."
          exit 0
        fi
        pr_num="$(echo "${LLVM_ROCm_PR_URL:-}" | grep -o '/pull/[0-9]*' | tr -dc '0-9')"
        pr_json="$(curl -fsS "https://api.github.com/repos/ROCm/llvm-project/pulls/${pr_num}")"

        title="$(echo "$pr_json" | grep -o '"title": *"[^"]*"' | head -1)"
        base="$(echo "$pr_json" | grep -o '"ref": *"[^"]*"' | tail -1)"
        echo "PR #${pr_num}: ${title} ${base}"

        # Ignore case and separators: wave-transform == wave_transform.
        if echo "${title} ${base}" | tr -d ' _-' | grep -qi wavetransform; then
          cat > BRANCH_CONFIG.json <<'EOF'
        {
          "flags": {
            "LLVM_ENABLE_ASSERTIONS": "ON"
          }
        }
        EOF
          echo "LLVM_ASSERTIONS=1" >> "$GITHUB_ENV"
          echo "Wave-transform PR: building with LLVM assertions."
        fi

