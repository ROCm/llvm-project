name: Comgr CI Patches
description: >
  Compiler-CI includes amd-comgr patches. Appends COMGR_ENABLE_TRANSPILER=ON
  to compiler/pre_hook_amd-comgr.cmake so the option is set in Comgr's
  configure.

inputs:
  stage_name:
    description: "Stage name (e.g. compiler-runtime, math-libs)."
    required: true

runs:
  using: composite
  steps:
    - name: Enable Comgr transpiler in Compiler CI
      if: ${{ inputs.stage_name == 'compiler-runtime' }}
      shell: bash
      run: |
        # Set the option in Comgr's configure, not the superproject cache.
        # This is an llvm-project CI override of TheRock's default.
        test -f compiler/pre_hook_amd-comgr.cmake
        cat >> compiler/pre_hook_amd-comgr.cmake <<'EOF'

        set(COMGR_ENABLE_TRANSPILER ON CACHE BOOL "Enable transpiler in Compiler CI" FORCE)
        EOF
        echo "Comgr transpiler enabled for the compiler-runtime stage."

