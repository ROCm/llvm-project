name: LLVM toolchain Lit
description: >
  Runs check-llvm/clang/flang/mlir/lld
  when stage is compiler-runtime.

inputs:
  stage_name:
    description: "Job stage name; tests run only when this is compiler-runtime."
    required: true
  build_dir:
    description: "Top-level build directory (same as BUILD_DIR in the job)."
    required: false
    default: "build"

runs:
  using: composite
  steps:
    - name: LLVM Lit Tests
      shell: bash
      if: ${{ inputs.stage_name == 'compiler-runtime' }}
      run: |
        ninja -C "${{ inputs.build_dir }}/compiler/amd-llvm/build" check-llvm

    - name: Clang Lit Tests
      shell: bash
      if: ${{ inputs.stage_name == 'compiler-runtime' }}
      run: |
        ninja -C "${{ inputs.build_dir }}/compiler/amd-llvm/build" check-clang

    - name: Flang Lit Tests
      shell: bash
      if: ${{ inputs.stage_name == 'compiler-runtime' }}
      run: |
        ninja -C "${{ inputs.build_dir }}/compiler/amd-llvm/build" check-flang

    - name: MLIR Lit Tests
      shell: bash
      if: ${{ inputs.stage_name == 'compiler-runtime' }}
      run: |
        ninja -C "${{ inputs.build_dir }}/compiler/amd-llvm/build" check-mlir

    - name: LLD Lit Tests
      shell: bash
      if: ${{ inputs.stage_name == 'compiler-runtime' }}
      run: |
        # If assertion in on skip mlir-pdll-lsp server test
        if grep -qs '^LLVM_ENABLE_ASSERTIONS:BOOL=ON$' \
            "${{ inputs.build_dir }}/compiler/amd-llvm/build/CMakeCache.txt" \
            && [[ "$RUNNER_OS" != "Windows" ]]; then
          echo "Skipping mlir-pdll-lsp-server tests (assertions + libLLVM.so hash seed mismatch)"
          export LIT_FILTER_OUT='mlir-pdll-lsp-server/'
        fi        
        ninja -C "${{ inputs.build_dir }}/compiler/amd-llvm/build" check-lld

