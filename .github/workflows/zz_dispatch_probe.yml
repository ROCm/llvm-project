name: Dispatch Probe

# Can a push-triggered job dispatch a workflow that is NOT on the default
# branch, using GITHUB_TOKEN with actions: write? Two unknowns at once:
# whether the token is allowed to create the event, and whether GitHub will
# resolve a workflow it cannot see on the default branch.

on:
  push:
    branches:
      - cursor/push-inputs-probe-b7d6
    paths:
      - ".github/workflows/zz_dispatch_probe.yml"

permissions:
  contents: read
  actions: write

jobs:
  try_dispatch:
    name: Try to dispatch a non-default-branch workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the inputs probe by file name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "--- by file name ---"
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/zz_push_inputs_probe.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}" \
            -f 'inputs[sample_string]=dispatched-by-github-token' \
            2>&1 | tail -5
          echo "rc_by_name=$?"

      - name: Dispatch the cherry-pick workflow, dry run only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "--- cherry_pick_testing.yml, dry_run so it costs nothing ---"
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/419188209/dispatches" \
            -f ref="${GITHUB_REF_NAME}" \
            -f 'inputs[LLVM_BRANCH]=amd/dev/mliyakat/triage_WW45_pytorch1' \
            -f 'inputs[THEROCK_REF]=amd-compiler-2026-10-29-COT' \
            -f 'inputs[dry_run]=true' \
            2>&1 | tail -5
          echo "rc_cherry=$?"
