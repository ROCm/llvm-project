name: Setup (Multi-Arch Perf gfx90a)

on:
  workflow_call:
    outputs:
      enable_build_jobs:
        value: ${{ jobs.setup.outputs.enable_build_jobs }}
      linux_build_config:
        value: ${{ jobs.setup.outputs.linux_build_config }}
      rocm_package_version:
        value: ${{ jobs.setup.outputs.rocm_package_version }}
      release_type:
        value: ${{ jobs.setup.outputs.release_type }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      enable_build_jobs: "true"
      linux_build_config: ${{ steps.config.outputs.linux_build_config }}
      rocm_package_version: ${{ steps.version.outputs.rocm_package_version }}
      release_type: ""
    steps:
      - name: Checkout TheRock for version helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ROCm/TheRock
          ref: compiler/amd-staging
          fetch-depth: 2

      - name: Compute package version
        id: version
        run: |
          python ./build_tools/compute_rocm_package_version.py --release-type=nightly

      - name: Emit gfx90a perf build config
        id: config
        run: |
          python3 <<'PY'
          import json, os
          cfg = {
              "per_family_info": [{
                  "amdgpu_family": "gfx90a",
                  "amdgpu_targets": "gfx90a",
                  "test-runs-on": "",
                  "sanity_check_only_for_family": True,
              }],
              "dist_amdgpu_families": "gfx90a",
              "artifact_group": "multi-arch-perf-gfx90a",
              "build_variant_label": "perf",
              "build_variant_suffix": "perf",
              "build_variant_cmake_preset": "",
              "expect_failure": False,
              "build_pytorch": False,
              "prebuilt_stages": "",
              "baseline_run_id": "",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("linux_build_config=" + json.dumps(cfg) + "\n")
          PY
