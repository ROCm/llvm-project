name: Validate and promote TheRock main tip

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      therock_main_sha:
        description: "Optional full TheRock SHA. Empty uses origin/main."
        type: string
        default: ""
      force:
        description: "Revalidate a SHA that is already promoted."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rockci-validate-therock-tip
  cancel-in-progress: false

env:
  BASELINE_BRANCH: ${{ github.ref_name }}  
  BASELINE_FILE: .github/rockci-sha/therock-ci-main-ref
  GPU_TARGET: gfx90a

jobs:
  resolve:
    name: Resolve TheRock candidate
    if: github.repository == 'ROCm/llvm-project'
    runs-on: ubuntu-24.04
    outputs:
      validate: ${{ steps.plan.outputs.validate }}
      sha: ${{ steps.plan.outputs.sha }}
      baseline_before: ${{ steps.plan.outputs.baseline_before }}
    steps:
      - name: Checkout baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.BASELINE_BRANCH }}

      - name: Resolve candidate and compare with baseline
        id: plan
        shell: bash
        env:
          OVERRIDE_SHA: ${{ inputs.therock_main_sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [[ -n "$OVERRIDE_SHA" ]]; then
            SHA="${OVERRIDE_SHA,,}"
          else
            SHA="$(git ls-remote https://github.com/ROCm/TheRock.git refs/heads/main | awk '{print $1}')"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::TheRock candidate must be a full 40-character SHA, got '${SHA}'."
            exit 1
          fi

          BASELINE=""
          if [[ -f "$BASELINE_FILE" ]]; then
            BASELINE="$(tr -d '[:space:]' < "$BASELINE_FILE")"
          fi

          if [[ ! "$BASELINE" =~ ^[0-9a-f]{40}$ ]]; then
            BASELINE=""
          fi

          VALIDATE=true
          if [[ "$SHA" == "$BASELINE" && "$FORCE" != "true" ]]; then
            VALIDATE=false
            echo "TheRock ${SHA} is already promoted."
          fi

          {
            echo "validate=${VALIDATE}"
            echo "sha=${SHA}"
            echo "baseline_before=${BASELINE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### TheRock baseline gate"
            echo "- Candidate: \`${SHA}\`"
            echo "- Current baseline: \`${BASELINE:-<uninitialized>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rockci_sha_check:
    name: Full Linux and Windows Multi-Arch CI
    needs: resolve
    if: needs.resolve.outputs.validate == 'true'
    uses: ./.github/workflows/multiarch-parameterised-sha-rockci-amd-staging.yml
    with:
      therock_ref: ${{ needs.resolve.outputs.sha }}
      LLVM_ROCm_PR_URL: ${{ vars.LLVM_ROCM_PR_URL || '' }}        
      linux_amdgpu_families: gfx94x,gfx110x,gfx90a
      windows_amdgpu_families: gfx1151
      build_pytorch: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  jenkins:
    name: Validate artifacts on Jenkins
    needs: [resolve, rockci_sha_check]
    if: needs.resolve.outputs.validate == 'true' && needs.rockci_sha_check.result == 'success'
    runs-on:
      group: compiler-generic-runners
    timeout-minutes: 360
    outputs:
      build_url: ${{ steps.jenkins.outputs.build_url }}
      result: ${{ steps.jenkins.outputs.result }}
    steps:
      - name: Checkout Jenkins action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.BASELINE_BRANCH }}

      - name: Run rock-artifacts-tester
        id: jenkins
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/jenkins-rock-artifacts-tester@amd/dev/kirthana14m/rocksha-check-automation
        with:
          jenkins_host: ${{ secrets.ROCM_JENKINS_HOST }}
          jenkins_user: ${{ secrets.ROCM_JENKINS_USER }}
          jenkins_token: ${{ secrets.ROCM_JENKINS_CI_TOKEN }}
          artifacts_run_id: ${{ github.run_id }}
          gpu_target: ${{ env.GPU_TARGET }}
          timeout_minutes: "3600"
  promote:
    name: Commit promoted SHA
    needs: [resolve, rockci_sha_check, jenkins]
    if: >-
      needs.resolve.outputs.validate == 'true' &&
      needs.rockci_sha_check.result == 'success' &&
      needs.jenkins.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App token
        id: rocm-cciapp
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ROCM_CCIAPP_APP_ID }}
          private-key: ${{ secrets.ROCM_CCIAPP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: llvm-project
          permission-contents: write
      
      - name: Checkout baseline branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.BASELINE_BRANCH }}
          token: ${{ steps.rocm-cciapp.outputs.token }}

      - name: Commit the validated SHA
        shell: bash
        env:
          THEROCK_SHA: ${{ needs.resolve.outputs.sha }}
          BASELINE_BEFORE: ${{ needs.resolve.outputs.baseline_before }}
        run: |
          set -euo pipefail
          git pull --ff-only origin "$BASELINE_BRANCH"

          CURRENT=""
          if [[ -f "$BASELINE_FILE" ]]; then
            CURRENT="$(tr -d '[:space:]' < "$BASELINE_FILE")"
          fi

          if [[ ! "$CURRENT" =~ ^[0-9a-f]{40}$ ]]; then
            CURRENT=""
          fi
          if [[ "$CURRENT" != "$BASELINE_BEFORE" ]]; then
            echo "::error::Baseline changed during validation (${BASELINE_BEFORE:-<none>} -> ${CURRENT:-<none>}); refusing to overwrite it."
            exit 1
          fi

          mkdir -p "$(dirname "$BASELINE_FILE")"          
          printf '%s\n' "$THEROCK_SHA" > "$BASELINE_FILE"
          git add "$BASELINE_FILE"
          if git diff --cached --quiet; then
            echo "Baseline already contains ${THEROCK_SHA}."
            exit 0
          fi

          git config --global user.email "z1-cciauto@amd.com"
          git config --global user.name "Z1 cciauto"          
          git commit -m "compiler-ci: promote TheRock ${THEROCK_SHA}"
          git push origin "HEAD:${BASELINE_BRANCH}"

  notify:
    name: Notify Teams
    needs: [resolve, rockci_sha_check, jenkins, promote]
    if: always() && github.repository == 'ROCm/llvm-project'
    runs-on: ubuntu-24.04
    steps:
      - name: Post gate result
        continue-on-error: true
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.ROCM_SHA_NOTIFIER }}
          VALIDATE: ${{ needs.resolve.outputs.validate }}
          THEROCK_SHA: ${{ needs.resolve.outputs.sha }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          ROCKCI_RESULT: ${{ needs.rockci_sha_check.result }}
          JENKINS_RESULT: ${{ needs.jenkins.result }}
          JENKINS_URL: ${{ needs.jenkins.outputs.build_url }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${TEAMS_WEBHOOK_URL:-}" ]]; then
            echo "Teams webhook is not configured; skipping notification."
            exit 0
          fi

          if [[ "$PROMOTE_RESULT" == "success" ]]; then
            STATUS="promoted"
          elif [[ "$VALIDATE" == "false" && "$RESOLVE_RESULT" == "success" ]]; then
            STATUS="already promoted"
          elif [[ "$RESOLVE_RESULT" == "failure" || "$ROCKCI_RESULT" == "failure" || "$JENKINS_RESULT" == "failure" || "$PROMOTE_RESULT" == "failure" ]]; then
            STATUS="failed"
          else
            STATUS="incomplete"
          fi
          export STATUS

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          facts = [
              {"title": "Status", "value": os.environ["STATUS"]},
              {"title": "TheRock SHA", "value": os.environ.get("THEROCK_SHA") or "n/a"},
              {"title": "Multi-Arch CI", "value": os.environ["ROCKCI_RESULT"]},
              {"title": "Jenkins", "value": os.environ["JENKINS_RESULT"]},
              {"title": "Promotion", "value": os.environ["PROMOTE_RESULT"]},
          ]
          links = f"[GitHub Actions run]({os.environ['RUN_URL']})"
          if os.environ.get("JENKINS_URL"):
              links += f" · [Jenkins build]({os.environ['JENKINS_URL']})"
          payload = {
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.5",
                      "body": [
                          {"type": "TextBlock", "text": "TheRock baseline gate", "weight": "Bolder", "size": "Large"},
                          {"type": "FactSet", "facts": facts},
                          {"type": "TextBlock", "text": links, "wrap": True},
                      ],
                  },
              }],
          }
          request = urllib.request.Request(
              os.environ["TEAMS_WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              print(f"Teams webhook HTTP {response.status}")
          PY
