# Cherry-pick Testing
#
# Qualifies a single cherry-pick against a release candidate.
#
# The developer picks their patch onto the exact llvm commit the candidate
# already pins, pushes the result as a branch to ROCm/llvm-project, then
# dispatches this workflow with that branch plus the candidate's TheRock branch.
# Every other component stays where the candidate pinned it, so a pass or a
# fail is attributable to the patch alone.
#
# Multi Arch Parameterised CI amd-staging cannot serve this case: it resolves
# changes through refs/pull/<n>/head and so needs an open PR, which a
# cherry-pick branch does not have and often never will.
#
# The job graph calls the build, test and packaging workflows directly rather
# than going through multi_arch_ci_linux.yml, following compiler_bump.yml in
# TheRock. That workflow aggregates a dozen jobs into one result and gates most
# of them on `!failure()`, which is true when *any* earlier job in the run
# failed, so a package install test could skip the tarballs and the wheels.
# Here every consumer of the build names the build explicitly, and a failure
# stays local to the job that produced it.

name: Cherry-pick Testing

on:
  workflow_dispatch:
    inputs:
      LLVM_BRANCH:
        description: "ROCm/llvm-project branch holding the cherry-pick, e.g. users/estewart/revert-wave-llvm-cache-cp-10-14-26."
        required: true
        type: string
      THEROCK_REF:
        description: "TheRock branch supplying every other component pin, e.g. amd-compiler-2026-10-8-COT-2."
        required: true
        type: string
      retain_compiler_submodules:
        description: "Keep hipify and spirv-llvm-translator exactly as THEROCK_REF pinned them, instead of floating them to amd-staging tips."
        type: boolean
        default: true
      # Platforms. "none" skips the platform entirely.
      linux_amdgpu_families:
        description: 'Comma-separated list of Linux GPU families. "all" = all, "none" = skip platform.'
        type: string
        default: "gfx950"
      windows_amdgpu_families:
        description: 'Comma-separated list of Windows GPU families. "all" = all, "none" = skip platform.'
        type: string
        default: "none"
      # Scope.
      dry_run:
        description: "Validate the cherry-pick base and resolve the build configuration, then stop without building."
        type: boolean
        default: false
      # Wheels.
      build_pytorch:
        description: "Build PyTorch wheels."
        type: boolean
        default: false
      build_jax:
        description: "Build JAX wheels."
        type: boolean
        default: false
      python_version:
        description: >-
          Python versions for wheel builds, comma-separated. Empty means 3.12
          for PyTorch wheels and the full matrix for ROCm Python packages.
        type: string
        default: ""
      # Packaging.
      build_native_packages:
        description: "Build deb and rpm packages. The install tests that consume them are not part of this workflow."
        type: boolean
        default: true
      # Tests.
      run_tests:
        description: "Run tests after the build. Uncheck for a build-only run; artifacts are still produced."
        type: boolean
        default: true
      test_type:
        description: >-
          Component test depth. "quick" runs a 15 component smoke set; the
          other three schedule the same 51 components and differ only in
          which test cases run inside each one.
        type: choice
        options:
          - quick
          - standard
          - comprehensive
          - full
        default: quick
      linux_test_labels:
        description: "Comma-separated test options. Use test:* to filter tests (e.g. test:rocprim). Use test_filter:* to set test type (e.g. test_filter:quick)."
        type: string
        default: ""
      windows_test_labels:
        description: "Comma-separated test options. Use test:* to filter tests (e.g. test:rocprim). Use test_filter:* to set test type (e.g. test_filter:quick)."
        type: string
        default: ""
      run_performance_tests:
        description: "Run performance tests after the build, on the qa-forge perf machines. Results are informational and do not gate the run."
        type: boolean
        default: false
      performance_target_server:
        description: "Override the perf machine. Empty picks the machine mapped to the family being built."
        type: string
        default: ""
      performance_tar_name:
        description: "Override the tarball installed on the perf machine. Empty names the one this run published, pinning the build under test."
        type: string
        default: ""
      performance_rocm_version:
        description: "ROCm version to install, as X.Y.Z, e.g. 7.11.0. Empty derives it from this run's package version."
        type: string
        default: ""
      performance_execution_label:
        description: "Execution label the install and the measurements are recorded under."
        type: string
        default: "stg-compiler-full"
      performance_install_method:
        description: "How ROCm is laid down on the perf machine."
        type: string
        default: "therock_tarball_multiarch_alldevice"
      performance_suites:
        description: "Comma-separated performance suite ids to run."
        type: string
        default: "hip-hipperf,rocmlibs-rocrand-perf,rocmlibs-rocfft-perf,rocmlibs-rccl-perf"
      performance_install_wait_minutes:
        description: "How long to wait for the install before giving up. Expiry fails the run, because measuring an unknown stack is worse than not measuring."
        type: number
        default: 120
      performance_wait_minutes:
        description: "How long to wait for the measurement before giving up. Expiry is not a failure; the measurement keeps running and its URL is reported."
        type: number
        default: 300
      qa_forge_repo:
        description: "Repository holding the install and performance workflows."
        type: string
        default: "AMD-ROCm-Internal/qa-forge"
      qa_forge_ref:
        description: "Branch of qa_forge_repo supplying the install and performance workflows."
        type: string
        default: "main"
      changed_projects:
        description: "Comma-separated list of changed projects to filter tests (empty = run all tests)."
        type: string
        default: ""
      # Reuse artifacts from an earlier run instead of rebuilding.
      prebuilt_stages:
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead."
        type: string
        default: ""
      baseline_run_id:
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set."
        type: string
        default: ""

permissions:
  contents: read

run-name: >-
  CP ${{ inputs.LLVM_BRANCH }} on ${{ inputs.THEROCK_REF }}
  | Linux: ${{ inputs.linux_amdgpu_families }}
  | Windows: ${{ inputs.windows_amdgpu_families }}
  | ${{ inputs.dry_run && 'Dry run' || !inputs.run_tests && 'Build only' || format('Tests: {0}', inputs.test_type) }}

concurrency:
  # Keyed on the branch under test rather than the dispatching ref, so
  # qualifying several cherry-picks at once does not cancel them all. A repeat
  # dispatch of the same branch still supersedes the run in flight.
  group: ${{ github.workflow }}-${{ inputs.LLVM_BRANCH || github.run_id }}
  cancel-in-progress: true

jobs:
  # A cherry-pick result only means something as a delta against a baseline QA
  # has already tested. If the branch is not a descendant of the llvm commit
  # THEROCK_REF pins, the build carries changes beyond the patch and neither a
  # pass nor a fail is attributable, so this gate is unconditionally blocking.
  validate_cp_base:
    name: Validate cherry-pick base
    runs-on: ubuntu-24.04
    outputs:
      llvm_sha: ${{ steps.compare.outputs.llvm_sha }}
    steps:
      - name: Compare branch against the llvm commit TheRock pins
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_BRANCH: ${{ inputs.LLVM_BRANCH }}
          THEROCK_REF: ${{ inputs.THEROCK_REF }}
        run: |
          set -euo pipefail

          LLVM_SHA=$(git ls-remote --exit-code --heads \
            https://github.com/ROCm/llvm-project.git \
            "refs/heads/${LLVM_BRANCH}" | cut -f1) || {
            echo "::error::Branch '${LLVM_BRANCH}' not found on ROCm/llvm-project."
            exit 1
          }
          echo "Cherry-pick commit: ${LLVM_SHA}"
          echo "llvm_sha=${LLVM_SHA}" >> "$GITHUB_OUTPUT"

          ENTRY=$(gh api "repos/ROCm/TheRock/contents/compiler/amd-llvm?ref=${THEROCK_REF}")
          BASE_SHA=$(jq -r '.sha' <<<"${ENTRY}")

          COMPARE=$(gh api "repos/ROCm/llvm-project/compare/${BASE_SHA}...${LLVM_SHA}?per_page=1")
          STATUS=$(jq -r '.status' <<<"${COMPARE}")
          AHEAD=$(jq -r '.ahead_by' <<<"${COMPARE}")
          BEHIND=$(jq -r '.behind_by' <<<"${COMPARE}")

          {
            echo "## Cherry-pick under test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| llvm-project branch | \`${LLVM_BRANCH}\` |"
            echo "| llvm-project commit | \`${LLVM_SHA:0:12}\` |"
            echo "| TheRock base branch | \`${THEROCK_REF}\` |"
            echo "| Base llvm commit | \`${BASE_SHA:0:12}\` |"
            echo "| Comparison | ${STATUS} |"
            echo "| Commits on top of base | ${AHEAD} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${STATUS}" != "ahead" ]]; then
            echo "::error::'${LLVM_BRANCH}' is '${STATUS}' relative to the llvm commit ${THEROCK_REF} pins (${BEHIND} missing, ${AHEAD} extra). Rebase onto ${BASE_SHA}."
            exit 1
          fi

          # "ahead" on its own is a weak check: a branch thousands of commits
          # ahead is a different lineage, not a cherry-pick, and any failure it
          # produces cannot be attributed to the commits under test. Warn
          # rather than fail, because batches are legitimately larger than one.
          readonly MAX_EXPECTED_COMMITS=25
          if (( AHEAD > MAX_EXPECTED_COMMITS )); then
            echo "::warning::'${LLVM_BRANCH}' is ${AHEAD} commits ahead of the llvm commit ${THEROCK_REF} pins, well over the ${MAX_EXPECTED_COMMITS} a cherry-pick would add. Results will not isolate your change; rebase onto ${BASE_SHA} to qualify the cherry-pick on its own."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> ${AHEAD} commits on top of the pinned base, so this run exercises more than the cherry-pick." >> "$GITHUB_STEP_SUMMARY"
          fi

  # rock-ci-deps/submodule-pr-update runs inside the build workflows, where
  # these inputs are out of scope, so it reads them from an artifact instead.
  cp_params:
    name: Publish cherry-pick parameters
    runs-on: ubuntu-24.04
    steps:
      - name: Store cherry-pick parameters into file
        env:
          LLVM_BRANCH: ${{ inputs.LLVM_BRANCH }}
          RETAIN_COMPILER_SUBMODULES: ${{ inputs.retain_compiler_submodules }}
        run: |
          # The PR URL keys stay present but empty. The action sources this file
          # and echoes each one, and a cherry-pick has no PR to point at.
          cat > "${{ github.run_id }}_PR_params.env" <<EOF
          LLVM_PR_URL=
          LLVM_ROCm_PR_URL=
          SPIRV_PR_URL=
          HIPIFY_PR_URL=
          LLVM_BRANCH=${LLVM_BRANCH}
          RETAIN_COMPILER_SUBMODULES=${RETAIN_COMPILER_SUBMODULES}
          EOF

      - name: Upload cherry-pick parameters
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multiple-pr-build-params
          path: ${{ github.run_id }}_PR_params.env

  # Runs even for a dry run, so that resolving the configuration and the
  # package version is itself a cheap preflight.
  setup:
    needs: validate_cp_base
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      honor_requested_families: true
      version_git_sha: ${{ needs.validate_cp_base.outputs.llvm_sha }}
      build_variant: "release"
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families }}
      linux_test_labels: ${{ inputs.linux_test_labels }}
      windows_test_labels: ${{ inputs.windows_test_labels }}
      prebuilt_stages: ${{ inputs.prebuilt_stages }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
      build_pytorch: ${{ inputs.build_pytorch }}
      build_jax: ${{ inputs.build_jax }}
      python_version: ${{ inputs.python_version }}
      repository: "ROCm/TheRock"
      ref: ${{ inputs.THEROCK_REF }}

  # ==========================================================================
  # Linux
  # ==========================================================================
  copy_prebuilt_stages_linux:
    name: Copy Prebuilt Stages (Linux)
    needs: setup
    if: >-
      ${{
        !inputs.dry_run &&
        inputs.linux_amdgpu_families != '' &&
        inputs.linux_amdgpu_families != 'none' &&
        needs.setup.outputs.linux_build_config != '' &&
        fromJSON(needs.setup.outputs.linux_build_config).prebuilt_stages != '' &&
        fromJSON(needs.setup.outputs.linux_build_config).baseline_run_id != ''
      }}
    runs-on: aws-linux-scale-rocm-large
    permissions:
      contents: read
      id-token: write
    # Run in container to access AWS credentials mounted from the host runner.
    container:
      image: python:3.12-slim
      options: -v /runner/config:/home/awsconfig/
    env:
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
    steps:
      - name: Checking out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.ref }}

      - name: Install artifact manager dependencies
        run: pip install boto3

      - name: Configure AWS credentials for artifact uploads
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ci

      - name: Copy prebuilt stage artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ci
        run: |
          python build_tools/artifact_manager.py copy \
            --source-run-id=${{ fromJSON(needs.setup.outputs.linux_build_config).baseline_run_id }} \
            --stage="${{ fromJSON(needs.setup.outputs.linux_build_config).prebuilt_stages }}" \
            --amdgpu-families="${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}" \
            --expand-family-to-targets

  build_linux:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs:
      - setup
      - cp_params
      - copy_prebuilt_stages_linux
    # The platform guard reads the inputs rather than the resolved config,
    # because setup_multi_arch always emits a config for both platforms and so
    # cannot express "this platform was not requested". compiler_bump.yml gates
    # its own per-platform setup jobs the same way.
    if: >-
      ${{
        !cancelled() && !inputs.dry_run &&
        needs.setup.result == 'success' &&
        needs.cp_params.result == 'success' &&
        needs.copy_prebuilt_stages_linux.result != 'failure' &&
        inputs.linux_amdgpu_families != '' &&
        inputs.linux_amdgpu_families != 'none' &&
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_build_portable_linux.yml
    with:
      matrix_per_family_json: ${{ toJSON(fromJSON(needs.setup.outputs.linux_build_config).per_family_info) }}
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      artifact_group: ${{ fromJSON(needs.setup.outputs.linux_build_config).artifact_group }}
      build_variant_label: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_variant_label }}
      build_variant_cmake_preset: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_variant_cmake_preset }}
      build_variant_suffix: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_variant_suffix }}
      prebuilt_stages: ${{ fromJSON(needs.setup.outputs.linux_build_config).prebuilt_stages }}
      build_runs_on: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_runs_on }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      # test_type picks the configure branch as well as the test depth: any
      # value but "full" disables MIOpen, composable_kernel, hipDNN, hipTensor
      # and hipBLASLt-provider, and PyTorch cannot configure without MIOpen.
      # The test jobs still get the requested depth, so asking for wheels
      # widens the build without also widening the test run.
      test_type: ${{ inputs.build_pytorch && 'full' || inputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  validate_linux_artifacts:
    name: Validate Linux Artifact Structure
    needs: [setup, build_linux]
    if: ${{ !cancelled() && needs.build_linux.result == 'success' }}
    uses: ./.github/workflows/test_artifacts_structure.yml
    with:
      amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      platform: linux
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}

  test_linux:
    name: Test Linux ${{ matrix.family_info.amdgpu_family }}
    needs: [setup, build_linux]
    if: >-
      ${{
        !cancelled() && inputs.run_tests &&
        needs.build_linux.result == 'success'
      }}
    strategy:
      fail-fast: false
      matrix:
        family_info: ${{ fromJSON(needs.setup.outputs.linux_build_config).per_family_info }}
    uses: ./.github/workflows/test_artifacts.yml
    with:
      artifact_group: ${{ fromJSON(needs.setup.outputs.linux_build_config).artifact_group }}
      amdgpu_families: ${{ matrix.family_info.amdgpu_family }}
      amdgpu_targets: ${{ matrix.family_info.amdgpu_targets }}
      test_runs_on: ${{ matrix.family_info.test-runs-on }}
      test_type: ${{ inputs.test_type }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      sanity_check_only_for_family: ${{ matrix.family_info.sanity_check_only_for_family }}
      changed_projects: ${{ inputs.changed_projects }}
      build_variant: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_variant_label }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}

  build_linux_tarballs:
    name: Build Linux Tarballs
    needs: [setup, build_linux]
    if: ${{ !cancelled() && needs.build_linux.result == 'success' }}
    uses: ./.github/workflows/multi_arch_build_tarballs.yml
    with:
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      platform: linux
      package_version: ${{ needs.setup.outputs.rocm_package_version }}
      # A measurement installs from the dev channel, and only what was
      # uploaded as a dev build can be published onto it. Everything else
      # keeps going to the CI bucket exactly as before, so an ordinary
      # cherry-pick is untouched by any of this.
      release_type: ${{ inputs.run_performance_tests && 'dev' || 'ci' }}
      # The perf suites run the test binaries, which live in the -tests-
      # sibling rather than the base tarball. Building it costs a second pass
      # over the artifacts, so it is asked for only when it will be used.
      include_test_tarballs: ${{ inputs.run_performance_tests }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  build_linux_python_packages:
    name: Build Linux Python Packages
    needs: [setup, build_linux]
    if: ${{ !cancelled() && needs.build_linux.result == 'success' }}
    uses: ./.github/workflows/build_portable_linux_python_packages.yml
    with:
      artifact_group: ${{ fromJSON(needs.setup.outputs.linux_build_config).artifact_group }}
      amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      linux_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).linux_amdgpu_families }}
      windows_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).windows_amdgpu_families }}
      multiarch_index: true
      package_version: ${{ needs.setup.outputs.rocm_package_version }}
      # Publication is not tarballs-only: publish_rocm_to_release_buckets.py
      # raises when it finds no python packages beside them, so these have to
      # reach the same bucket the tarballs do.
      release_type: ${{ inputs.run_performance_tests && 'dev' || '' }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  build_linux_deb_packages:
    name: Build Linux DEB Packages
    needs: [setup, build_linux]
    if: >-
      ${{
        !cancelled() && inputs.build_native_packages &&
        needs.build_linux.result == 'success'
      }}
    uses: ./.github/workflows/multi_arch_build_native_linux_packages.yml
    with:
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      rocm_version: ${{ needs.setup.outputs.rocm_deb_package_version || needs.setup.outputs.rocm_package_version }}
      native_package_type: deb
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  build_linux_rpm_packages:
    name: Build Linux RPM Packages
    needs: [setup, build_linux]
    if: >-
      ${{
        !cancelled() && inputs.build_native_packages &&
        needs.build_linux.result == 'success'
      }}
    uses: ./.github/workflows/multi_arch_build_native_linux_packages.yml
    with:
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      rocm_version: ${{ needs.setup.outputs.rocm_rpm_package_version || needs.setup.outputs.rocm_package_version }}
      native_package_type: rpm
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  # TheRock derives the wheel matrix from the release type, and ci pins that to
  # release/2.13 alone. Its generator accepts explicit refs but
  # configure_multi_arch_ci.py never forwards them, so cross the requested refs
  # with the requested Python versions here instead.
  pytorch_matrix:
    name: Resolve PyTorch matrix
    needs: setup
    if: >-
      ${{
        !cancelled() && !inputs.dry_run && inputs.build_pytorch &&
        needs.setup.result == 'success' &&
        needs.setup.outputs.linux_build_config != ''
      }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Cross Python versions with PyTorch refs
        id: resolve
        env:
          REQUESTED_PYTHON: ${{ inputs.python_version }}
          FAMILIES: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
        run: |
          python3 - <<'RESOLVE'
          import json
          import os

          # Qualifying a cherry-pick means covering every supported release
          # line, so the refs are fixed rather than an input. Keep this in step
          # with RELEASE_STABLE_PYTORCH_REFS in TheRock's
          # build_tools/github_actions/configure_pytorch_release_matrix.py,
          # whose table trails the branches that actually exist upstream.
          PYTORCH_REFS = [
              "release/2.13",
              "release/2.14",
              "release/2.15",
              "nightly",
          ]

          python_versions = [
              v.strip()
              for v in os.environ["REQUESTED_PYTHON"].replace(";", ",").split(",")
              if v.strip()
          ] or ["3.12"]

          matrix = [
              {
                  "python_version": python_version,
                  "pytorch_git_ref": pytorch_git_ref,
                  "amdgpu_families": os.environ["FAMILIES"],
              }
              for python_version in python_versions
              for pytorch_git_ref in PYTORCH_REFS
          ]

          print(f"{len(matrix)} wheel build(s):")
          for row in matrix:
              print(f"  py{row['python_version']} {row['pytorch_git_ref']}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          RESOLVE

  build_linux_pytorch_wheels:
    name: Build PyTorch | py${{ matrix.python_version }} ${{ matrix.pytorch_git_ref }}
    needs: [setup, pytorch_matrix, build_linux_python_packages]
    if: >-
      ${{
        !cancelled() && inputs.build_pytorch &&
        needs.build_linux_python_packages.result == 'success' &&
        needs.pytorch_matrix.result == 'success' &&
        needs.pytorch_matrix.outputs.matrix != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pytorch_matrix.outputs.matrix) }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_pytorch_wheels_ci.yml
    with:
      artifact_group: ${{ fromJSON(needs.setup.outputs.linux_build_config).artifact_group }}
      python_version: ${{ matrix.python_version }}
      pytorch_git_ref: ${{ matrix.pytorch_git_ref }}
      amdgpu_families: ${{ matrix.amdgpu_families }}
      kpack_split: ${{ needs.build_linux_python_packages.outputs.kpack_split }}
      rocm_package_find_links_url: ${{ needs.build_linux_python_packages.outputs.package_find_links_url }}
      rocm_version: ${{ needs.setup.outputs.rocm_package_version }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  # A measurement installs by name from the dev channel, and nothing reaches
  # that channel on its own. The build uploads to the dev artifacts bucket;
  # this job is what copies it onto the channel the install reads. It sits
  # between the two for that reason — skip it and the install has nothing to
  # resolve.
  #
  # Its own job, not a step in the perf jobs, because publication needs
  # `id-token: write` to assume a role that can write a shared channel, and
  # that is not a permission to leave sitting on the job that dispatches into
  # another repository. The perf jobs stay on `contents: read`.
  #
  # Gated on the performance toggle, so an ordinary cherry-pick publishes
  # nothing. The dev channel is consumed by other teams; writing to it is a
  # deliberate act, not a side effect of running CI.
  publish_linux_artifacts:
    name: Publish Linux Artifacts
    needs: [setup, build_linux_tarballs, build_linux_python_packages]
    if: >-
      ${{
        !cancelled() && inputs.run_performance_tests && !inputs.dry_run &&
        needs.build_linux_tarballs.result == 'success' &&
        needs.build_linux_python_packages.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Assume the repo.amd.com publication role.
    steps:
      # The publication script and its credentials action live in TheRock, not
      # here, which is also how the tarball job reaches its tools.
      - name: Checkout TheRock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.ref }}

      - name: Setting up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure_aws_product_publication_credentials
        with:
          release_type: dev
          product: core

      - name: Publish to the dev channel
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          # Native packages are skipped: this run does not build deb and rpm
          # into the dev bucket, and a measurement installs from the tarball.
          # Python packages have no such switch, which is why the job above
          # has to put them where this can find them.
          python build_tools/github_actions/publish_rocm_to_release_buckets.py \
            --run-id="${RUN_ID}" \
            --platform=linux \
            --release-type=dev \
            --structured \
            --build-variant=release \
            --skip-native-packages

      - name: Record what was published
        env:
          PACKAGE_VERSION: ${{ needs.setup.outputs.rocm_package_version }}
        run: |
          {
            echo "### Published to the dev channel"
            echo
            echo "\`therock-dist-linux-multiarch-tests-${PACKAGE_VERSION}.tar.gz\`"
            echo
            echo "at https://dev.repo.amd.com/rocm/core/tarball/"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Performance qualification lives in qa-forge: the suites are ROCmTest suites,
  # the machines are its baremetal perf servers, and the result store is its
  # own. Nothing here reimplements any of that. These two jobs drive qa-forge's
  # two existing workflows in order — install the ROCm under test on the perf
  # machine, then measure it — because the ordering is the one part neither
  # workflow owns.
  #
  # Split in two so each wait gets its own six-hour job budget. Both halves
  # queue for a machine held exclusively, so one job waiting on install time
  # plus perf time plus two queues is the shape most likely to hit the cap.
  #
  # Finding the dispatched run is not a search. The dispatch API is called with
  # return_run_details, so the created run's id comes back from the call that
  # created it. Two cherry-picks dispatching at the same moment each get their
  # own id from their own call and cannot be confused; they contend for the
  # machine, not for the identity of their run.
  performance_install:
    name: Performance Install
    needs: [setup, build_linux, publish_linux_artifacts]
    # Naming this run's own tarball requires that it was built and published.
    # Naming someone else's, already on the channel, is the one way to run
    # without either in front — which is also how the trigger is exercised
    # while publication is still being wired up.
    if: >-
      ${{
        !cancelled() && inputs.run_performance_tests &&
        (
          inputs.performance_tar_name != '' ||
          (
            needs.build_linux.result == 'success' &&
            needs.publish_linux_artifacts.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-24.04
    # The hard ceiling. The wait itself is bounded below this by
    # performance_install_wait_minutes, so the action reports a timeout and the
    # check step runs, rather than the job being killed mid-wait.
    timeout-minutes: 360
    # No actions: write. The dispatch crosses into another repository on a
    # separate token, so GITHUB_TOKEN needs nothing beyond the default read.
    permissions:
      contents: read
    env:
      # The secrets context is not available in a step `if:`, and the token
      # itself must never be compared in one. Mirror only whether it is set.
      PERF_TOKEN_PRESENT: ${{ secrets.QA_FORGE_PERF_DISPATCH_TOKEN != '' && 'true' || 'false' }}
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      server: ${{ steps.plan.outputs.server }}
      rocm_version: ${{ steps.plan.outputs.rocm_version }}
      perf_dispatch_inputs: ${{ steps.plan.outputs.perf_dispatch_inputs }}
      install_run_url: ${{ steps.dispatch.outputs.runUrlHtml }}
    steps:
      - name: Plan the performance run
        id: plan
        env:
          BUILD_CONFIG: ${{ needs.setup.outputs.linux_build_config }}
          PACKAGE_VERSION: ${{ needs.setup.outputs.rocm_package_version }}
          SERVER_OVERRIDE: ${{ inputs.performance_target_server }}
          TAR_NAME_OVERRIDE: ${{ inputs.performance_tar_name }}
          ROCM_VERSION_OVERRIDE: ${{ inputs.performance_rocm_version }}
          EXECUTION_LABEL: ${{ inputs.performance_execution_label }}
          INSTALL_METHOD: ${{ inputs.performance_install_method }}
          SUITES: ${{ inputs.performance_suites }}
          INSTALL_WAIT_MINUTES: ${{ inputs.performance_install_wait_minutes }}
          TRIGGERED_BY: ${{ github.triggering_actor }} (CP ${{ inputs.LLVM_BRANCH }})
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Perf machines are qa-forge's, not TheRock's, so they are absent
          # from runner-config-v2.json and the family's `benchmark-runs-on`
          # does not point at them. The mapping has to live somewhere, and a
          # table here is more legible than another workflow input.
          #
          # Only families with a perf machine appear. A build for any other
          # family skips the perf run with a warning rather than failing it:
          # most families legitimately have no perf hardware behind them.
          declare -A PERF_SERVERS=(
            # Named rather than pooled, because it is one machine. Replace
            # with a common label once more than one sits behind the family.
            [gfx94X-dcgpu]=SMC-SC-DI13-13
            # Provisional: no machine is attached for gfx950 yet, so this name
            # is a placeholder and a run targeting it will queue indefinitely.
            [gfx950-dcgpu]=linux-gfx950-8gpu-perf-rocm
          )

          skip_with() {
            echo "::warning::$1"
            {
              echo "### Performance tests"
              echo
              echo "> [!NOTE]"
              echo "> Skipped: $1"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "${PERF_TOKEN_PRESENT}" != "true" ]]; then
            skip_with "the QA_FORGE_PERF_DISPATCH_TOKEN secret is not configured."
          fi

          if [[ -n "${BUILD_CONFIG}" ]]; then
            mapfile -t FAMILIES < <(jq -r '.per_family_info[].amdgpu_family' <<<"${BUILD_CONFIG}")
          else
            FAMILIES=()
          fi

          SERVER=""
          for candidate in "${FAMILIES[@]}"; do
            if [[ -n "${PERF_SERVERS[${candidate}]:-}" ]]; then
              SERVER="${PERF_SERVERS[${candidate}]}"
              break
            fi
          done
          [[ -z "${SERVER_OVERRIDE}" ]] || SERVER="${SERVER_OVERRIDE}"

          if [[ -z "${SERVER}" ]]; then
            skip_with "no perf machine is mapped to any of: ${FAMILIES[*]:-none}. Pass performance_target_server to force one."
          fi

          # The tarball is named after the build's own full version string,
          # commit sha and all, so naming it identifies exactly one build and
          # nobody has to type it. The override points a run at some other
          # already-built tarball instead.
          #
          # The name is the one TheRock's build_tarballs.py writes:
          #   therock-dist-{platform}-{family|multiarch}[-tests]-{version}.tar.gz
          # Perf takes the multiarch tests variant, because the suites need the
          # test binaries that the plain tarball leaves out.
          TAR_NAME="${TAR_NAME_OVERRIDE}"
          if [[ -z "${TAR_NAME}" ]]; then
            if [[ -z "${PACKAGE_VERSION}" ]]; then
              echo "::error::No build ran in front of this job, so there is no version to name a tarball from. Pass performance_tar_name to point at an already-published build."
              exit 1
            fi
            TAR_NAME="therock-dist-linux-multiarch-tests-${PACKAGE_VERSION}.tar.gz"
          fi

          # The build already publishes here, under this run's own id, with
          # the credentials it already has and public read. That makes it the
          # place to look: no channel to publish to first, and the prefix is
          # derived rather than configured, so it cannot drift from the run it
          # describes.
          #
          # The '+' in the version must be sent as %2B. A literal '+' is a 404
          # on this bucket and on the ROCm channels alike, so the encoding is
          # a property of the name rather than of the host.
          TARBALL_INDEX="https://therock-ci-artifacts-external.s3.amazonaws.com/${GITHUB_REPOSITORY//\//-}/${GITHUB_RUN_ID}-linux/tarballs"
          TARBALL_URL="${TARBALL_INDEX}/${TAR_NAME//+/%2B}"

          # Checked before dispatching rather than after. The install takes a
          # perf machine exclusively and holds it for as long as the install
          # runs, so letting it start on a tarball that demonstrably is not
          # there spends the scarce thing in this pipeline to reach a 404.
          # Unreachable is not the same as absent: this host may be closed to
          # some runners, so only a definitive answer is treated as one.
          TARBALL_CODE="$(curl -sI -o /dev/null -w '%{http_code}' --max-time 30 "${TARBALL_URL}" || echo "000")"
          case "${TARBALL_CODE}" in
            200)
              echo "Found ${TAR_NAME}."
              ;;
            000)
              echo "::warning::Could not reach ${TARBALL_INDEX} to check that ${TAR_NAME} is present. Continuing without the check."
              ;;
            404)
              echo "::error::${TAR_NAME} is not at ${TARBALL_INDEX}. A -tests- tarball is only built when the performance toggle is on, so a run that built without it will not have one. Pass performance_tar_name to name a tarball that does exist."
              exit 1
              ;;
            *)
              echo "::warning::${TARBALL_INDEX} answered ${TARBALL_CODE} for ${TAR_NAME}, which is neither a hit nor a clear miss. Continuing."
              ;;
          esac

          # qa-forge installs by ROCm version, which it expects as X.Y.Z, so
          # trim the commit suffix off the version carried in the tarball name.
          ROCM_VERSION="${ROCM_VERSION_OVERRIDE}"
          if [[ -z "${ROCM_VERSION}" ]]; then
            ROCM_VERSION="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<<"${TAR_NAME}" | head -1 || true)"
          fi
          if [[ -z "${ROCM_VERSION}" ]]; then
            echo "::error::Could not read a ROCm version out of the tarball name '${TAR_NAME}'. Pass performance_rocm_version as X.Y.Z."
            exit 1
          fi

          if ! [[ "${INSTALL_WAIT_MINUTES}" =~ ^[0-9]+$ ]] || (( INSTALL_WAIT_MINUTES < 1 )); then
            echo "::error::performance_install_wait_minutes must be a positive whole number of minutes, got '${INSTALL_WAIT_MINUTES}'."
            exit 1
          fi
          # Stay under the job's own ceiling so the wait ends inside the job and
          # the outcome is reported, instead of the job being killed mid-wait.
          WAIT_MINUTES="${INSTALL_WAIT_MINUTES}"
          if (( WAIT_MINUTES > 345 )); then
            echo "::warning::performance_install_wait_minutes of ${WAIT_MINUTES} exceeds the job ceiling; clamping to 345."
            WAIT_MINUTES=345
          fi

          # ════════════════════════════════════════════════════════════════
          # DISPATCH KEYS — the only place either payload is built.
          #
          # The key names come from the two target workflows as they stand in
          # the public mirror of qa-forge, which is archived and so may trail
          # the internal repository these are dispatched to. Both payloads are
          # built here and handed to the dispatch steps whole, so correcting a
          # name is one edit in this block and nothing else in the file moves.
          #
          #   rocm-func-core-therock-install-dev.yml
          #     target_type      'servers' to address a machine by name
          #     target_server    the perf machine
          #     install_method   how ROCm is laid down
          #     execution_label  what the install is recorded under
          #     package_name     the tarball naming this exact build
          #     rocm_version     X.Y.Z
          #     build_type       'dev', selecting the dev channel the
          #                      cherry-pick published to
          #     triggered_by     attribution, optional
          #
          #   performance-test-run.yml
          #     workflow_id      comma-separated suite ids
          #     target_server    the same machine
          #     execution_label  the same label
          #     triggered_by     attribution, optional
          # ════════════════════════════════════════════════════════════════
          export SERVER ROCM_VERSION TAR_NAME
          python3 - <<'PAYLOADS' >> "$GITHUB_OUTPUT"
          import json
          import os

          def line(key, payload):
              return f"{key}={json.dumps(payload, separators=(',', ':'))}"

          install = {
              "target_type": "servers",
              "target_server": os.environ["SERVER"],
              "install_method": os.environ["INSTALL_METHOD"],
              "execution_label": os.environ["EXECUTION_LABEL"],
              "package_name": os.environ["TAR_NAME"],
              "rocm_version": os.environ["ROCM_VERSION"],
              "build_type": "dev",
              "triggered_by": os.environ["TRIGGERED_BY"],
          }
          perf = {
              "workflow_id": os.environ["SUITES"],
              "target_server": os.environ["SERVER"],
              "execution_label": os.environ["EXECUTION_LABEL"],
              "triggered_by": os.environ["TRIGGERED_BY"],
          }
          print(line("install_dispatch_inputs", install))
          print(line("perf_dispatch_inputs", perf))
          PAYLOADS

          echo "Installing ROCm ${ROCM_VERSION} on ${SERVER} from ${TAR_NAME}"
          {
            echo "skip=false"
            echo "server=${SERVER}"
            echo "rocm_version=${ROCM_VERSION}"
            echo "tar_name=${TAR_NAME}"
            echo "packages_url=${TARBALL_INDEX}/"
            echo "wait_seconds=$(( WAIT_MINUTES * 60 ))"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch the ROCm install onto the perf machine
        id: dispatch
        if: ${{ steps.plan.outputs.skip == 'false' }}
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          repo: ${{ inputs.qa_forge_repo }}
          ref: ${{ inputs.qa_forge_ref }}
          workflow: rocm-func-core-therock-install-dev.yml
          token: ${{ secrets.QA_FORGE_PERF_DISPATCH_TOKEN }}
          wait-for-completion: true
          wait-timeout-seconds: ${{ steps.plan.outputs.wait_seconds }}
          wait-interval-seconds: 30
          # sync-status is deliberately off. It would fail this step on a failed
          # install, before the link step below has put the run URL in the
          # summary. The check step at the end of the job fails the job instead,
          # and covers the timeout case that sync-status misses.
          sync-status: false
          inputs: ${{ steps.plan.outputs.install_dispatch_inputs }}

      - name: Link the install run
        if: ${{ always() && steps.dispatch.outputs.runUrlHtml != '' }}
        env:
          INSTALL_RUN_URL: ${{ steps.dispatch.outputs.runUrlHtml }}
          PERF_SERVER: ${{ steps.plan.outputs.server }}
          ROCM_VERSION: ${{ steps.plan.outputs.rocm_version }}
          TAR_NAME: ${{ steps.plan.outputs.tar_name }}
        run: |
          {
            echo "### Performance install"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Run | ${INSTALL_RUN_URL} |"
            echo "| Machine | \`${PERF_SERVER}\` |"
            echo "| ROCm version | \`${ROCM_VERSION}\` |"
            echo "| Tarball | \`${TAR_NAME}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check the install succeeded
        if: ${{ always() && steps.dispatch.outputs.runId != '' }}
        env:
          GH_TOKEN: ${{ secrets.QA_FORGE_PERF_DISPATCH_TOKEN }}
          QA_FORGE_REPO: ${{ inputs.qa_forge_repo }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
          INSTALL_RUN_URL: ${{ steps.dispatch.outputs.runUrlHtml }}
        run: |
          set -euo pipefail

          # The dispatch action only warns when its wait expires, and its
          # status sync reads a conclusion that is still null at that point, so
          # a timeout would otherwise pass silently. Read the run directly.
          read -r STATUS CONCLUSION < <(
            gh api "repos/${QA_FORGE_REPO}/actions/runs/${RUN_ID}" \
              --jq '[.status, (.conclusion // "none")] | @tsv'
          )
          echo "Install run ${RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"

          if [[ "${STATUS}" != "completed" ]]; then
            echo "::error::The install run is still ${STATUS} after the wait expired. Measuring now would measure an unknown stack, so no performance run is dispatched. Raise performance_install_wait_minutes or check ${INSTALL_RUN_URL}."
            {
              echo "> [!CAUTION]"
              echo "> The install did not finish within the wait. No measurement was taken."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "::error::The install run concluded '${CONCLUSION}'. No performance run is dispatched, because the stack on the machine is not the one under test. See ${INSTALL_RUN_URL}."
            {
              echo "> [!CAUTION]"
              echo "> The install ${CONCLUSION}. No measurement was taken."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

  performance_tests:
    name: Performance Tests
    needs: [performance_install]
    # A skipped or failed install takes this with it: GitHub skips a job whose
    # dependency did not succeed, and the explicit result check says so out
    # loud. Measuring a stack that did not install is worse than not measuring.
    if: >-
      ${{
        needs.performance_install.result == 'success' &&
        needs.performance_install.outputs.skip == 'false'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Bound the wait
        id: budget
        env:
          WAIT_MINUTES: ${{ inputs.performance_wait_minutes }}
        run: |
          set -euo pipefail
          if ! [[ "${WAIT_MINUTES}" =~ ^[0-9]+$ ]] || (( WAIT_MINUTES < 1 )); then
            echo "::error::performance_wait_minutes must be a positive whole number of minutes, got '${WAIT_MINUTES}'."
            exit 1
          fi
          MINUTES="${WAIT_MINUTES}"
          if (( MINUTES > 345 )); then
            echo "::warning::performance_wait_minutes of ${MINUTES} exceeds the job ceiling; clamping to 345."
            MINUTES=345
          fi
          echo "wait_seconds=$(( MINUTES * 60 ))" >> "$GITHUB_OUTPUT"
          echo "wait_minutes=${MINUTES}" >> "$GITHUB_OUTPUT"

      # The payload comes from the single assumed-keys block in the install
      # job, so there is nothing to correct here.
      - name: Dispatch the performance run
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          repo: ${{ inputs.qa_forge_repo }}
          ref: ${{ inputs.qa_forge_ref }}
          workflow: performance-test-run.yml
          token: ${{ secrets.QA_FORGE_PERF_DISPATCH_TOKEN }}
          wait-for-completion: true
          wait-timeout-seconds: ${{ steps.budget.outputs.wait_seconds }}
          wait-interval-seconds: 60
          sync-status: false
          inputs: ${{ needs.performance_install.outputs.perf_dispatch_inputs }}

      - name: Link the performance run
        if: ${{ always() && steps.dispatch.outputs.runUrlHtml != '' }}
        env:
          PERF_RUN_URL: ${{ steps.dispatch.outputs.runUrlHtml }}
          PERF_SERVER: ${{ needs.performance_install.outputs.server }}
          INSTALL_RUN_URL: ${{ needs.performance_install.outputs.install_run_url }}
          ROCM_VERSION: ${{ needs.performance_install.outputs.rocm_version }}
          SUITES: ${{ inputs.performance_suites }}
        run: |
          {
            echo "### Performance tests"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Measurement run | ${PERF_RUN_URL} |"
            echo "| Install run | ${INSTALL_RUN_URL} |"
            echo "| Machine | \`${PERF_SERVER}\` |"
            echo "| ROCm version | \`${ROCM_VERSION}\` |"
            echo "| Suites | \`${SUITES}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ──────────────────────────────────────────────────────────────────
      # STUB. Results are published as logs to Artifactory, and the path
      # that identifies one measurement is not yet known; it will be read
      # off a trial run. Until then this reports where the results are
      # rather than fetching them, so the trigger can be exercised without
      # waiting on the layout.
      #
      # Filling it in means fetching from that path, attaching the logs to
      # this run with actions/upload-artifact, and lifting only the
      # headline pass/fail counts into the step summary.
      # ──────────────────────────────────────────────────────────────────
      - name: Collect the results
        if: ${{ always() && steps.dispatch.outputs.runId != '' }}
        env:
          GH_TOKEN: ${{ secrets.QA_FORGE_PERF_DISPATCH_TOKEN }}
          QA_FORGE_REPO: ${{ inputs.qa_forge_repo }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
          PERF_RUN_URL: ${{ steps.dispatch.outputs.runUrlHtml }}
          WAIT_MINUTES: ${{ steps.budget.outputs.wait_minutes }}
        run: |
          set -euo pipefail
          STATUS=$(gh api "repos/${QA_FORGE_REPO}/actions/runs/${RUN_ID}" --jq '.status')
          {
            echo
            if [[ "${STATUS}" != "completed" ]]; then
              echo "> [!NOTE]"
              echo "> Still ${STATUS} after waiting ${WAIT_MINUTES} minutes. The measurement"
              echo "> continues on the machine; this run stopped waiting for it."
              echo "> Results will be at ${PERF_RUN_URL} when it finishes."
            else
              echo "> [!NOTE]"
              echo "> Measured values are published as logs to Artifactory by the"
              echo "> measurement run. Collecting them into this run is not wired up"
              echo "> yet, so read them from ${PERF_RUN_URL} for now."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Conclude
        if: ${{ always() && steps.dispatch.outputs.runId != '' }}
        env:
          GH_TOKEN: ${{ secrets.QA_FORGE_PERF_DISPATCH_TOKEN }}
          QA_FORGE_REPO: ${{ inputs.qa_forge_repo }}
          RUN_ID: ${{ steps.dispatch.outputs.runId }}
          PERF_RUN_URL: ${{ steps.dispatch.outputs.runUrlHtml }}
        run: |
          set -euo pipefail
          read -r STATUS CONCLUSION < <(
            gh api "repos/${QA_FORGE_REPO}/actions/runs/${RUN_ID}" \
              --jq '[.status, (.conclusion // "none")] | @tsv'
          )
          echo "Measurement run ${RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"

          # A wait that expires is not a verdict. The measurement is still
          # running and has said nothing about the patch, so failing here would
          # report a regression that was never observed. Neutral, with the run
          # URL already in the summary.
          if [[ "${STATUS}" != "completed" ]]; then
            echo "::warning::The measurement run is still ${STATUS}; this job stopped waiting. Follow ${PERF_RUN_URL} for the result."
            exit 0
          fi

          # Nothing here compares against a baseline, so the measurement cannot
          # fail for being slow. It can only fail for not having run, which is a
          # broken run and worth a red mark.
          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "::error::The measurement run concluded '${CONCLUSION}'. See ${PERF_RUN_URL}."
            exit 1
          fi

  # ==========================================================================
  # Windows
  # ==========================================================================
  copy_prebuilt_stages_windows:
    name: Copy Prebuilt Stages (Windows)
    needs: setup
    if: >-
      ${{
        !inputs.dry_run &&
        inputs.windows_amdgpu_families != '' &&
        inputs.windows_amdgpu_families != 'none' &&
        needs.setup.outputs.windows_build_config != '' &&
        fromJSON(needs.setup.outputs.windows_build_config).prebuilt_stages != '' &&
        fromJSON(needs.setup.outputs.windows_build_config).baseline_run_id != ''
      }}
    runs-on: ${{ fromJSON(needs.setup.outputs.windows_build_config).build_runs_on || 'azure-windows-scale-rocm' }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checking out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install artifact manager dependencies
        run: pip install boto3

      - name: Configure AWS credentials for artifact uploads
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ci

      - name: Copy prebuilt stage artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ci
        run: |
          python build_tools/artifact_manager.py copy \
            --source-run-id=${{ fromJSON(needs.setup.outputs.windows_build_config).baseline_run_id }} \
            --stage="${{ fromJSON(needs.setup.outputs.windows_build_config).prebuilt_stages }}" \
            --amdgpu-families="${{ fromJSON(needs.setup.outputs.windows_build_config).dist_amdgpu_families }}" \
            --expand-family-to-targets

  build_windows:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs:
      - setup
      - cp_params
      - copy_prebuilt_stages_windows
    if: >-
      ${{
        !cancelled() && !inputs.dry_run &&
        needs.setup.result == 'success' &&
        needs.cp_params.result == 'success' &&
        needs.copy_prebuilt_stages_windows.result != 'failure' &&
        inputs.windows_amdgpu_families != '' &&
        inputs.windows_amdgpu_families != 'none' &&
        needs.setup.outputs.windows_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_build_windows.yml
    with:
      matrix_per_family_json: ${{ toJSON(fromJSON(needs.setup.outputs.windows_build_config).per_family_info) }}
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.windows_build_config).dist_amdgpu_families }}
      artifact_group: ${{ fromJSON(needs.setup.outputs.windows_build_config).artifact_group }}
      build_variant_label: ${{ fromJSON(needs.setup.outputs.windows_build_config).build_variant_label }}
      build_variant_cmake_preset: ${{ fromJSON(needs.setup.outputs.windows_build_config).build_variant_cmake_preset }}
      build_variant_suffix: ${{ fromJSON(needs.setup.outputs.windows_build_config).build_variant_suffix }}
      prebuilt_stages: ${{ fromJSON(needs.setup.outputs.windows_build_config).prebuilt_stages }}
      build_runs_on: ${{ fromJSON(needs.setup.outputs.windows_build_config).build_runs_on }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ inputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  validate_windows_artifacts:
    name: Validate Windows Artifact Structure
    needs: [setup, build_windows]
    if: ${{ !cancelled() && needs.build_windows.result == 'success' }}
    uses: ./.github/workflows/test_artifacts_structure.yml
    with:
      amdgpu_families: ${{ fromJSON(needs.setup.outputs.windows_build_config).dist_amdgpu_families }}
      platform: windows
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}

  test_windows:
    name: Test Windows ${{ matrix.family_info.amdgpu_family }}
    needs: [setup, build_windows]
    if: >-
      ${{
        !cancelled() && inputs.run_tests &&
        needs.build_windows.result == 'success'
      }}
    strategy:
      fail-fast: false
      matrix:
        family_info: ${{ fromJSON(needs.setup.outputs.windows_build_config).per_family_info }}
    uses: ./.github/workflows/test_artifacts.yml
    with:
      # Windows publishes per-architecture artifacts, so the fetch has to name
      # the family rather than the shared group.
      artifact_group: ${{ matrix.family_info.amdgpu_family }}
      amdgpu_families: ${{ matrix.family_info.amdgpu_family }}
      amdgpu_targets: ${{ matrix.family_info.amdgpu_targets }}
      test_runs_on: ${{ matrix.family_info.test-runs-on }}
      test_type: ${{ inputs.test_type }}
      test_labels: ${{ needs.setup.outputs.windows_test_labels }}
      sanity_check_only_for_family: ${{ matrix.family_info.sanity_check_only_for_family }}
      changed_projects: ${{ inputs.changed_projects }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}

  build_windows_tarballs:
    name: Build Windows Tarballs
    needs: [setup, build_windows]
    if: ${{ !cancelled() && needs.build_windows.result == 'success' }}
    uses: ./.github/workflows/multi_arch_build_tarballs.yml
    with:
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.windows_build_config).dist_amdgpu_families }}
      platform: windows
      package_version: ${{ needs.setup.outputs.rocm_package_version }}
      release_type: ci
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  build_windows_python_packages:
    name: Build Windows Python Packages
    needs: [setup, build_windows]
    if: ${{ !cancelled() && needs.build_windows.result == 'success' }}
    uses: ./.github/workflows/build_windows_python_packages.yml
    with:
      artifact_group: ${{ fromJSON(needs.setup.outputs.windows_build_config).artifact_group }}
      amdgpu_families: ${{ fromJSON(needs.setup.outputs.windows_build_config).dist_amdgpu_families }}
      linux_amdgpu_families: ${{ fromJSON(needs.setup.outputs.windows_build_config).linux_amdgpu_families }}
      windows_amdgpu_families: ${{ fromJSON(needs.setup.outputs.windows_build_config).windows_amdgpu_families }}
      multiarch_index: true
      package_version: ${{ needs.setup.outputs.rocm_package_version }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  ci_summary:
    name: CI Summary
    if: always()
    needs:
      - validate_cp_base
      - setup
      - build_linux
      - validate_linux_artifacts
      - test_linux
      - build_linux_tarballs
      - build_linux_python_packages
      - pytorch_matrix
      - build_linux_deb_packages
      - build_linux_rpm_packages
      - build_linux_pytorch_wheels
      - publish_linux_artifacts
      - performance_install
      - performance_tests
      - build_windows
      - validate_windows_artifacts
      - test_windows
      - build_windows_tarballs
      - build_windows_python_packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.ref }}
      # Ahead of the evaluation step, which exits non-zero when anything
      # failed and would otherwise take the links down with it.
      - name: Link the tarballs
        env:
          LINUX_TARBALL_URLS: ${{ needs.build_linux_tarballs.outputs.tarball_urls }}
          WINDOWS_TARBALL_URLS: ${{ needs.build_windows_tarballs.outputs.tarball_urls }}
        run: |
          python3 - <<'LINKS'
          import json
          import os

          rows = []
          for platform in ("linux", "windows"):
              raw = os.environ[f"{platform.upper()}_TARBALL_URLS"]
              # Skipped jobs hand back an empty string rather than "{}".
              for family, url in (json.loads(raw) if raw else {}).items():
                  rows.append((platform, family, url))

          if not rows:
              print("No tarballs were published.")
              raise SystemExit(0)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n## Tarballs\n\n")
              summary.write("| Platform | Family | Download |\n|---|---|---|\n")
              for platform, family, url in rows:
                  name = url.rsplit("/", 1)[-1]
                  summary.write(f"| {platform} | `{family}` | [{name}]({url}) |\n")
                  print(f"{platform} {family}: {url}")
          LINKS

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
