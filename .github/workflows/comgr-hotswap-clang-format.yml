name: "Check hotswap code formatting"

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'amd/comgr/src/hotswap/**'
  push:
    branches:
      - hotswap
    paths:
      - 'amd/comgr/src/hotswap/**'

jobs:
  hotswap-clang-format:
    if: github.repository != 'llvm/llvm-project'
    runs-on: ubuntu-latest
    container:
      image: 'ghcr.io/llvm/ci-ubuntu-24.04-format'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Fetch sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          set-safe-directory: true

      - name: Check formatting of changed hotswap files
        run: |
          git-clang-format HEAD~1 -- amd/comgr/src/hotswap
          if ! git diff --quiet; then
            echo "::group::clang-format diff"
            git --no-pager diff
            echo "::endgroup::"
            echo "::error::clang-format found formatting issues in amd/comgr/src/hotswap. Apply the diff above (or run clang-format on your changed files)."
            exit 1
          fi

      - name: Check formatting of all hotswap files
        if: github.event_name == 'push'
        run: |
          find amd/comgr/src/hotswap \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i
