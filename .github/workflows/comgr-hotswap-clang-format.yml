name: "Check hotswap code formatting"

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'amd/comgr/src/hotswap/**'
  push:
    branches:
      - hotswap
    paths:
      - 'amd/comgr/src/hotswap/**'

jobs:
  hotswap-clang-format:
    # Only run on forks; the wider LLVM tree is not clang-format clean.
    if: github.repository != 'llvm/llvm-project'
    runs-on: ubuntu-latest
    container:
      image: 'ghcr.io/llvm/ci-ubuntu-24.04-format'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Fetch sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch the merge commit and its parents so the PR base commit is
          # available for git-clang-format.
          fetch-depth: 2
          set-safe-directory: true

      - name: Check formatting of changed hotswap files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git-clang-format "$BASE_SHA" -- amd/comgr/src/hotswap
          if ! git diff --quiet; then
            echo "::group::clang-format diff"
            git --no-pager diff
            echo "::endgroup::"
            echo "::error::clang-format found formatting issues in amd/comgr/src/hotswap. Apply the diff above (or run clang-format on your changed files)."
            exit 1
          fi
