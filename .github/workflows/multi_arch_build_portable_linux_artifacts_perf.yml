#
# Perf variant of multi_arch_build_portable_linux_artifacts.yml:
# - Optionally installs perf_launcher and wraps compiles for HCTS generation (math-libs)
# - Collects .hcts files into build/logs/hcts-{stage}-{family}.tar.gz when enabled

name: Build Stage Artifacts (Perf / HCTS)

on:
  workflow_call:
    inputs:
      stage_name:
        type: string
        required: true
      stage_display_name:
        type: string
        required: true
      timeout_minutes:
        type: number
        required: true
      amdgpu_family:
        type: string
        required: false
        default: ""
      dist_amdgpu_families:
        type: string
        required: true
      rocm_package_version:
        type: string
        required: true
      build_variant_cmake_preset:
        type: string
        required: false
        default: ""
      release_type:
        type: string
        default: ""
      test_type:
        type: string
        default: full
      enable_perf_launcher:
        type: boolean
        default: true
      collect_hcts:
        type: boolean
        default: true
      artifact_run_id:
        type: string
        required: false
        default: ""
      math_libs_subset:
        type: string
        required: false
        default: full
        description: >-
          math-libs scope: "full" (default) or "rocprim" (rocPRIM + deps only, for HCTS smoke tests).

jobs:
  build_stage:
    name: ${{ inputs.stage_display_name }}
    runs-on: azure-linux-scale-rocm
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
      # perf_launcher needs perf_event access (Jenkins perf pods use --privileged).
      options: -v /runner/config:/home/awsconfig/ --privileged
    env:
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
      STAGE_NAME: ${{ inputs.stage_name }}
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_family }}
      BUILD_DIR: build
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      TEATIME_FORCE_INTERACTIVE: 0
      RELEASE_TYPE: ${{ inputs.release_type }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: "ROCm/TheRock"
          ref: compiler/amd-staging

      - name: Checkout perf launcher scripts
        if: ${{ inputs.enable_perf_launcher }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/perf
          sparse-checkout-cone-mode: true
          path: ci-perf-launcher

      - name: Install python deps
        run: |
          pip install -r requirements.txt
          pip install --upgrade \
              "boto3>=1.42.79,<1.42.85" \
              "botocore>=1.42.79,<1.42.85" \
              "aiobotocore>=3.4.0"

      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./build_tools/health_status.py

      - name: Remove ununsed existing patchces
        run: |
          rm -fv patches/amd-mainline/llvm-project/0001-Ensure-to-use-libamdhip64-with-major-version.patch

      - name: Fetch inbound artifacts
        if: ${{ inputs.stage_name != 'compiler-runtime' }}
        run: |
          set -euxo pipefail
          RUN_ID="${{ inputs.artifact_run_id }}"
          if [[ -z "${RUN_ID}" ]]; then
            RUN_ID="${{ github.run_id }}"
          fi
          echo "Fetching inbound artifacts for stage=${STAGE_NAME} from run_id=${RUN_ID}"
          python build_tools/artifact_manager.py fetch \
            --run-id="${RUN_ID}" \
            --stage="${STAGE_NAME}" \
            --amdgpu-families="${{ inputs.amdgpu_family }}" \
            --output-dir="${BUILD_DIR}" \
            --bootstrap
          echo "Bootstrap markers after fetch:"
          find "${BUILD_DIR}" -name '*.prebuilt' 2>/dev/null | head -20 || true

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          commit_log=$(./build_tools/fetch_sources.py --stage "${STAGE_NAME}" --jobs 12 --depth 1)
          echo "$commit_log" | awk -F"'" '/Submodule path/ {
            n = split($2, a, "/")
            print a[n], $4
          }' > submodule-commit-${STAGE_NAME}.txt

      - name: Upload submodule commit file
        uses: actions/upload-artifact@v4
        with:
          name: submodule-commit-${{ inputs.stage_name }}
          path: submodule-commit-${{ inputs.stage_name }}.txt
          overwrite: true
          retention-days: 1

      - name: Get stage configuration
        id: stage_config
        run: |
          python build_tools/configure_stage.py \
            --stage="${STAGE_NAME}" \
            --amdgpu-families="${{ inputs.amdgpu_family }}" \
            --dist-amdgpu-families="${{ inputs.dist_amdgpu_families }}" \
            --manylinux \
            --gha-output

      - name: Install stage python deps
        if: ${{ steps.stage_config.outputs.pip_install_cmd }}
        run: pip install ${{ steps.stage_config.outputs.pip_install_cmd }}

      - name: Use Wno-error for CK (nightly)
        if: ${{ inputs.stage_name == 'math-libs' }}
        run: |
          sed -i 's/-Werror\b/-Wno-error/g' rocm-libraries/projects/composablekernel/CMakeLists.txt

      - name: Apply compiler-runtime cmake workarounds
        if: ${{ inputs.stage_name == 'compiler-runtime' }}
        run: |
          sed -i 's/THEROCK_ENABLE_LLVM_TESTS/THEROCK_BUILD_LLVM_TESTS/g' \
            cmake/therock_subproject.cmake compiler/CMakeLists.txt || true
          sed -i 's/if(THEROCK_BUILD_COMGR_TESTS)/if(THEROCK_BUILD_COMGR_TESTS OR THEROCK_BUILD_TESTING)/' \
            compiler/pre_hook_amd-comgr.cmake || true

      - name: Install perf tools and perf launcher
        if: ${{ inputs.enable_perf_launcher }}
        run: |
          set -euo pipefail
          # therock_build_manylinux is RHEL/Alma-based (no apt-get). Jenkins uses apt on Ubuntu pods.
          install_perf_tools() {
            if command -v perf >/dev/null 2>&1; then
              echo "Using existing perf: $(command -v perf)"
              return 0
            fi
            if command -v microdnf >/dev/null 2>&1; then
              microdnf install -y perf || microdnf install -y kernel-tools || true
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y perf || dnf install -y kernel-tools || true
            elif command -v yum >/dev/null 2>&1; then
              yum install -y perf || yum install -y kernel-tools || true
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y "linux-tools-$(uname -r)" "linux-cloud-tools-$(uname -r)" \
                || apt-get install -y linux-tools-common linux-tools-generic || true
              kernel_perf_dir="/usr/lib/linux-tools/$(uname -r)"
              if [[ -d "${kernel_perf_dir}" ]]; then
                export PATH="${kernel_perf_dir}:${PATH}"
              fi
            fi
          }
          install_perf_tools
          command -v perf || { echo "ERROR: perf not found after install attempt" >&2; exit 127; }
          if ! perf stat -e cycles:u -- true >/dev/null 2>&1; then
            echo "ERROR: perf stat check failed; HCTS capture requires perf_event access" >&2
            perf stat -e cycles:u -- true 2>&1 | head -10 || true
            exit 1
          fi
          echo 1 > /proc/sys/kernel/perf_event_paranoid 2>/dev/null \
            || echo "WARNING: could not set perf_event_paranoid (non-fatal)"
          perf_dir="${GITHUB_WORKSPACE}/ci-perf-launcher/.github/perf"
          perf_launcher_bin="$(pwd)/${BUILD_DIR}/bin/perf_launcher.sh"
          test -x "${perf_dir}/setup_perf_launcher.sh"
          test -x "${perf_dir}/perf_launcher.sh"
          "${perf_dir}/setup_perf_launcher.sh" "$(pwd)/${BUILD_DIR}/bin"
          ls -la "${perf_launcher_bin}"

      - name: Configure stage
        env:
          BUILD_DIR: build
          extra_cmake_options: "-DTHEROCK_ENABLE_ALL=OFF -DTHEROCK_ENABLE_COMPOSABLE_KERNEL=OFF -DTHEROCK_ENABLE_MIOPEN=OFF -DTHEROCK_ENABLE_MIOPENPROVIDER=OFF -DTHEROCK_ENABLE_HIPDNN=OFF -DTHEROCK_ENABLE_HIPBLASLTPROVIDER=OFF -DTHEROCK_ENABLE_HIPDNN_SAMPLES=OFF -DTHEROCK_BUILD_LLVM_TESTS=OFF -DTHEROCK_BUILD_COMGR_TESTS=OFF -DTHEROCK_BUILD_TESTING=ON -DLLVM_SMREV_REPO='' -DLLVM_SMREV_REVISION=''"
          math_libs_subset_cmake_options: >-
            ${{ inputs.stage_name == 'math-libs' && inputs.math_libs_subset == 'rocprim' &&
              '-DTHEROCK_ENABLE_BLAS=OFF -DTHEROCK_ENABLE_FFT=OFF -DTHEROCK_ENABLE_FFTW3=OFF -DTHEROCK_ENABLE_SPARSE=OFF -DTHEROCK_ENABLE_SOLVER=OFF -DTHEROCK_ENABLE_ROCWMMA=OFF -DTHEROCK_ENABLE_LIBHIPCXX=OFF -DTHEROCK_ENABLE_SUPPORT=OFF -DTHEROCK_ENABLE_HOST_BLAS=OFF -DTHEROCK_ENABLE_HOST_SUITE_SPARSE=OFF -DTHEROCK_ENABLE_OPENMPI=OFF -DTHEROCK_ENABLE_HIPDNN=OFF -DTHEROCK_ENABLE_HIPDNN_INTEGRATION_TESTS=OFF -DTHEROCK_ENABLE_HIPKERNELPROVIDER=OFF -DTHEROCK_BUILD_TESTING=OFF -DTHEROCK_ENABLE_PRIM=ON -DTHEROCK_ENABLE_RAND=ON' || '' }}
        run: |
          perf_launcher_cmake_args=()
          if [[ "${{ inputs.enable_perf_launcher }}" == "true" ]]; then
            perf_launcher_bin="$(pwd)/${BUILD_DIR}/bin/perf_launcher.sh"
            test -x "${perf_launcher_bin}"
            # Match regular multi-arch CI (-DCMAKE_*_COMPILER_LAUNCHER=ccache); env-only
            # export does not reliably propagate into TheRock subproject toolchains.
            perf_launcher_cmake_args=(
              "-DCMAKE_C_COMPILER_LAUNCHER=${perf_launcher_bin}"
              "-DCMAKE_CXX_COMPILER_LAUNCHER=${perf_launcher_bin}"
              "-DCMAKE_HIP_COMPILER_LAUNCHER=${perf_launcher_bin}"
            )
          fi
          cmake -B "${BUILD_DIR}" -S . -GNinja \
            -DTHEROCK_PACKAGE_VERSION=${{ inputs.rocm_package_version }} \
            ${{ inputs.build_variant_cmake_preset && format('--preset={0}', inputs.build_variant_cmake_preset) }} \
            "${perf_launcher_cmake_args[@]}" \
            ${{ steps.stage_config.outputs.cmake_args }} \
            ${{ env.extra_cmake_options }} \
            ${{ env.math_libs_subset_cmake_options }}

      - name: Inject perf_launcher into subproject toolchains
        if: ${{ inputs.enable_perf_launcher }}
        run: |
          perf_launcher_bin="$(pwd)/${BUILD_DIR}/bin/perf_launcher.sh"
          bash "${GITHUB_WORKSPACE}/ci-perf-launcher/.github/perf/ensure_perf_launcher_toolchains.sh" \
            "${BUILD_DIR}" "${perf_launcher_bin}"

      - name: Build stage
        run: |
          build_targets=(stage-${STAGE_NAME})
          if [[ "${{ inputs.stage_name }}" != "math-libs" || "${{ inputs.math_libs_subset }}" == "full" ]]; then
            build_targets+=(therock-artifacts)
          fi
          python build_tools/memory_monitor.py --phase Build -- \
            cmake --build "${BUILD_DIR}" --target "${build_targets[@]}" -- -k 0

      - name: Collect HCTS tarballs
        if: ${{ inputs.collect_hcts }}
        run: |
          family="${AMDGPU_FAMILIES:-generic}"
          bash "${GITHUB_WORKSPACE}/ci-perf-launcher/.github/perf/collect_component_hcts.sh" \
            "${BUILD_DIR}" "${BUILD_DIR}/logs" "${family}"

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "Artifacts:"
          ls -lh "${BUILD_DIR}"/artifacts/*.tar.xz 2>/dev/null || echo "No artifacts found"
          ls -lh "${BUILD_DIR}"/logs/*_hcts.tar.gz 2>/dev/null || true

      - name: Push stage artifacts
        if: success() && (inputs.stage_name != 'math-libs' || inputs.math_libs_subset == 'full')
        run: |
          python build_tools/artifact_manager.py push --run-id ${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}"

      - name: Upload stage logs
        if: always()
        run: |
          python build_tools/github_actions/post_stage_upload.py \
            --run-id=${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}" \
            --amdgpu-family="${AMDGPU_FAMILIES}"
