name: Build Portable Linux Artifacts

on:
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
        default: gfx94X-dcgpu
      artifact_group:
        type: string
        default: gfx94X-dcgpu
      build_variant_label:
        type: string
        description: "A label for the build variant (ex: 'release', 'asan')"
        default: "release"
      build_variant_suffix:
        type: string
        description: "The build variant suffix (ex: 'asan' suffix -> 'gfx94X-dcgpu-asan')"
        default: ""
      build_variant_cmake_preset:
        type: string
        description: "The name of the cmake preset to use for this build variant, matching an entry in CMakePresets.json (ex: 'linux-release-asan')"
        default: ""
      package_version:
        type: string
        default: ADHOCBUILD
      expect_failure:
        type: boolean
        default: false
      extra_cmake_options:
        type: string
      llvm_ref:
        # Optional: branch of ROCm/llvm-project to build instead of the
        # compiler/amd-llvm pointer from TheRock. Used for memory baseline runs.
        description: "Optional ROCm/llvm-project branch to build (empty = default pointer)"
        type: string
        default: ""

  workflow_call:
    inputs:
      package_version:
        type: string
        default: ADHOCBUILD
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      build_variant_label:
        type: string
      build_variant_suffix:
        type: string
      build_variant_cmake_preset:
        type: string
      expect_failure:
        type: boolean
      extra_cmake_options:
        type: string
      test_type:
        type: string

# See the details regarding permissions from the link:
# https://github.com/aws-actions/configure-aws-credentials?tab=readme-ov-file#oidc
permissions:
  contents: read

jobs:
  build_portable_linux_artifacts:
    name: Build (xfail ${{ inputs.expect_failure }})
    # azure-linux-scale-rocm are used for regular CI builds
    # azure-linux-scale-rocm-heavy are used for CI builds that require more resources (ex: ASAN builds)
    runs-on: ${{ inputs.build_variant_label == 'asan' && 'azure-linux-u2404-hx176-cpu-rocm' || 'azure-linux-scale-rocm' }}
    continue-on-error: ${{ inputs.expect_failure }}
    timeout-minutes: 720 # 12 hour timeout
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:f1f9dd9b20404c239f01a02ffec61d6c2e80abcafe7fdac854f06169828e53ce # 2026-10-30
      options: -v /runner/config:/home/awsconfig/
    env:
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      # The ccache.conf will be written by setup_ccache.py before this gets used.
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      TEATIME_FORCE_INTERACTIVE: 0
      IS_PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
      # Build memory tracking (see the "Memory tracking" steps below).
      # Directory (relative to the workspace) collecting all memory data; it is
      # uploaded as a workflow artifact at the end of the build.
      MEM_TRACK_DIR: ${{ github.workspace }}/build-memory-tracking
      # Seconds between time-series samples (CSV).
      MEM_SAMPLE_INTERVAL_SEC: 5
      # Seconds between detailed "top memory consumers" snapshots taken while
      # the build is running (mid-build phase snapshots).
      MEM_SNAPSHOT_INTERVAL_SEC: 600
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: "ROCm/TheRock"
          ref: 'compiler/amd-staging'

      - name: Update Submodule Pointer to the PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config --global --add safe.directory $PWD
          # Fetch the latest commit SHA from the PR branch          
          PR_SHA=${{ github.event.pull_request.head.sha }}
          # Update the submodule pointer using cacheinfo
          git update-index --cacheinfo 160000,$PR_SHA,compiler/amd-llvm
          git config --global user.email "z1-cciauto@amd.com"
          git config --global user.name "Z1 cciauto"
          git commit -m "Update submodule reference for compiler/amd-llvm"
          # Verify the pointer update
          git submodule status
          git submodule

      - name: Download LLVM, SPIRV and HIPIFY PR's stored in file
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true 
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: multiple-pr-build-params
          path: .

      - name: Check for parameterised PR trigger
        id: check_parameterised_trigger
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -f "./${{ github.run_id }}_PR_params.env" ]; then
            echo "parameterised_trigger=true" >> "$GITHUB_OUTPUT"
          else
            echo "parameterised_trigger=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Source the multiple PR's of params
        if: ${{ github.event_name == 'workflow_dispatch' && steps.check_parameterised_trigger.outputs.parameterised_trigger == 'true' }}
        run: |
          set -a
          source ./${{ github.run_id }}_PR_params.env
          set +a
          echo "LLVM_PR_URL=$LLVM_PR_URL" >> "$GITHUB_ENV"
          echo "SPIRV_PR_URL=$SPIRV_PR_URL" >> "$GITHUB_ENV"
          echo "HIPIFY_PR_URL=$HIPIFY_PR_URL" >> "$GITHUB_ENV"

      - name: Update submodule pointers from provided parameter PR values
        if: ${{ github.event_name == 'workflow_dispatch' && steps.check_parameterised_trigger.outputs.parameterised_trigger == 'true' }}
        run: |
          git config --global --add safe.directory "$PWD"
          # Function to get SHA with git-ls
          get_pr_sha() {
             local pr_url="$1"
             local base_repo_url=$(echo "$pr_url" | sed 's|/pull/.*||')
             local pr_num=$(echo "$pr_url" | sed 's|.*/pull/||')
             git ls-remote "${base_repo_url}.git" "refs/pull/${pr_num}/head" | awk '{print $1}'
          }
        
          # LLVM PR
          LLVM_SHA="$(get_pr_sha "$LLVM_PR_URL")"
          echo "LLVM head SHA: $LLVM_SHA"
          git update-index --cacheinfo 160000,"$LLVM_SHA","compiler/amd-llvm"
        
          # SPIRV PR
          if [[ -n "$SPIRV_PR_URL" ]]; then
              SPIRV_SHA="$(get_pr_sha "$SPIRV_PR_URL")"
              echo "SPIRV head SHA: $SPIRV_SHA"
              git update-index --cacheinfo 160000,"$SPIRV_SHA","compiler/spirv-llvm-translator"
          else
              SPIRV_SHA="$(git ls-remote https://github.com/ROCm/SPIRV-LLVM-Translator.git refs/heads/amd-staging | awk '{print $1}')"
              echo "SPIRV PR NOT Passed, defaulting to the amd-staging tip : $SPIRV_SHA"
              git update-index --cacheinfo 160000,"$SPIRV_SHA","compiler/spirv-llvm-translator"
          fi

          # HIPIFY PR
          if [[ -n "$HIPIFY_PR_URL" ]]; then
              HIPIFY_SHA="$(get_pr_sha "$HIPIFY_PR_URL")"
              echo "HIPIFY head SHA: $HIPIFY_SHA"
              git update-index --cacheinfo 160000,"$HIPIFY_SHA","compiler/hipify"
          else
              HIPIFY_SHA="$(git ls-remote https://github.com/ROCm/HIPIFY.git refs/heads/amd-staging | awk '{print $1}')"
              echo "HIPIFY PR NOT Passed, defaulting to the amd-staging tip : $HIPIFY_SHA"
              git update-index --cacheinfo 160000,"$HIPIFY_SHA","compiler/hipify"
          fi
          git config --global user.email "z1-cciauto@amd.com"
          git config --global user.name "Z1 cciauto"
          git commit -m "Update submodule references from PR URLs"
          git submodule status
          git submodule
 
      # Optional llvm_ref input (workflow_dispatch only): pin compiler/amd-llvm to
      # the head of the given ROCm/llvm-project branch, as the PR-param step does.
      - name: Pin compiler/amd-llvm to llvm_ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.llvm_ref != '' }}
        env:
          LLVM_REF: ${{ inputs.llvm_ref }}
        run: |
          git config --global --add safe.directory "$PWD"
          LLVM_SHA="$(git ls-remote https://github.com/ROCm/llvm-project.git "refs/heads/${LLVM_REF}" | awk '{print $1}')"
          if [ -z "${LLVM_SHA}" ]; then
            echo "::error::llvm_ref '${LLVM_REF}' not found as a branch in ROCm/llvm-project"
            exit 1
          fi
          echo "Pinning compiler/amd-llvm to ${LLVM_REF} @ ${LLVM_SHA}"
          git update-index --cacheinfo 160000,"${LLVM_SHA}","compiler/amd-llvm"
          git config --global user.email "z1-cciauto@amd.com"
          git config --global user.name "Z1 cciauto"
          git commit -m "Pin compiler/amd-llvm to ${LLVM_REF} for memory baseline run"
          git submodule status

      - name: Install python deps
        run: |
          pip install -r requirements.txt

      # safe.directory must be set before Runner Health Status
      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      # TODO: We shouldn't be using a cache on actual release branches, but it
      # really helps for iteration time.
      - name: Setup ccache
        run: |
          ./build_tools/setup_ccache.py \
            --config-preset "github-oss-presubmit" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./build_tools/health_status.py

      - name: Remove ununsed existing patchces
        run: |
          rm -fv patches/amd-mainline/llvm-project/0001-Ensure-to-use-libamdhip64-with-major-version.patch

      - name: Fetch sources
        timeout-minutes: 30
        run: |
          ./build_tools/fetch_sources.py --jobs 12

      - name: TheRock and llvm SHA
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: |
             git config --global --add safe.directory $PWD
             git log --oneline -1
             ls -l compiler/amd-llvm
             cd compiler/amd-llvm/llvm  
             ls -l
             git log --oneline -3
             cd -

      - name: Configure PR Projects
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.test_type != 'full') }}
        env:
          cmake_preset: ${{ inputs.build_variant_cmake_preset }}
          amdgpu_families: ${{ inputs.amdgpu_families }}
          package_version: ${{ inputs.package_version }}
          extra_cmake_options: "-DTHEROCK_ENABLE_ALL=OFF -DTHEROCK_ENABLE_COMPILER=ON  -DTHEROCK_ENABLE_CORE_RUNTIME=ON -DTHEROCK_ENABLE_HIP_RUNTIME=ON -DTHEROCK_ENABLE_RCCL=ON -DTHEROCK_ENABLE_PRIM=ON -DTHEROCK_ENABLE_BLAS=ON -DTHEROCK_ENABLE_RAND=ON -DTHEROCK_ENABLE_SOLVER=ON -DTHEROCK_ENABLE_SPARSE=ON -DTHEROCK_ENABLE_SYSDEPS=OFF  -DTHEROCK_ENABLE_COMPOSABLE_KERNEL=OFF -DTHEROCK_ENABLE_OCL_RUNTIME=ON  -DTHEROCK_ENABLE_MATH_LIBS=ON -DLLVM_SMREV_REPO='' -DLLVM_SMREV_REVISION=''"
          BUILD_DIR: build
        run: |
          python3 build_tools/github_actions/build_configure.py --manylinux

      - name: Configure All Projects
        if: ${{ github.event_name != 'pull_request' && inputs.test_type == 'full' }}
        env:
          cmake_preset: ${{ inputs.build_variant_cmake_preset }}
          amdgpu_families: ${{ inputs.amdgpu_families }}
          package_version: ${{ inputs.package_version }}
          extra_cmake_options: ${{ inputs.extra_cmake_options }}
          BUILD_DIR: build
        run: |
          python3 build_tools/github_actions/build_configure.py --manylinux

      # Memory tracking 1/4: start background sampling and take the
      # "pre-build" snapshot. Build only; no tests are involved.
      # The helper script is written to RUNNER_TEMP (not into the repo) and is
      # used for (a) a background time-series sampler writing a CSV and
      # (b) one-shot snapshots (free, cgroup usage, top RSS processes).
      - name: Memory tracking - start sampler and pre-build snapshot
        run: |
          mkdir -p "${MEM_TRACK_DIR}"
          cat > "${RUNNER_TEMP}/mem_tracker.sh" <<'EOF'
          #!/usr/bin/env bash
          # Usage: mem_tracker.sh snapshot <label> | loop
          OUT="${MEM_TRACK_DIR}"

          # Container (cgroup) memory in bytes; v2 first, then v1. Empty if n/a.
          cgroup_bytes() {
            if [ -r /sys/fs/cgroup/memory.current ]; then
              cat /sys/fs/cgroup/memory.current
            elif [ -r /sys/fs/cgroup/memory/memory.usage_in_bytes ]; then
              cat /sys/fs/cgroup/memory/memory.usage_in_bytes
            fi
          }

          snapshot() {
            {
              echo "=== $1 @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              free -m
              echo "--- cgroup memory bytes: $(cgroup_bytes)"
              echo "--- top 15 processes by RSS (pid rss_kb elapsed command)"
              ps -eo pid,rss,etime,args --sort=-rss | head -n 16
              echo
            } >> "${OUT}/snapshots.log" 2>&1
          }

          loop() {
            local interval="${MEM_SAMPLE_INTERVAL_SEC:-5}"
            local snap_every="${MEM_SNAPSHOT_INTERVAL_SEC:-600}"
            local next_snap="${snap_every}" n=0
            echo "timestamp_utc,elapsed_s,mem_total_kb,mem_available_kb,mem_used_kb,swap_used_kb,cgroup_bytes,rss_sum_kb" > "${OUT}/memory_timeseries.csv"
            SECONDS=0
            while true; do
              # /proc/meminfo: system-wide view (mem_used = total - available).
              read -r total avail swap_total swap_free < <(awk '
                /^MemTotal:/ {t=$2} /^MemAvailable:/ {a=$2}
                /^SwapTotal:/ {st=$2} /^SwapFree:/ {sf=$2}
                END {print t, a, st, sf}' /proc/meminfo)
              # Sum of per-process RSS (shared pages are counted per process, so
              # this is an upper bound on real usage; mem_used is the accurate one).
              rss_sum=$(ps -eo rss= | awk '{s+=$1} END {print s+0}')
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),${SECONDS},${total},${avail},$((total-avail)),$((swap_total-swap_free)),$(cgroup_bytes),${rss_sum}" >> "${OUT}/memory_timeseries.csv"
              # Periodic detailed snapshot = "mid-build" phase snapshots.
              if [ "${SECONDS}" -ge "${next_snap}" ]; then
                n=$((n+1)); snapshot "mid-build-${n}"; next_snap=$((next_snap+snap_every))
              fi
              sleep "${interval}"
            done
          }

          case "$1" in
            snapshot) snapshot "${2:-unlabeled}" ;;
            loop) loop ;;
            *) echo "usage: $0 snapshot <label> | loop" >&2; exit 2 ;;
          esac
          EOF
          chmod +x "${RUNNER_TEMP}/mem_tracker.sh"
          "${RUNNER_TEMP}/mem_tracker.sh" snapshot pre-build
          # Run the sampler detached so it survives until the stop step.
          nohup "${RUNNER_TEMP}/mem_tracker.sh" loop > "${MEM_TRACK_DIR}/sampler.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mem_sampler.pid"
          echo "Memory sampler started (pid $(cat "${RUNNER_TEMP}/mem_sampler.pid"))"

      # Memory tracking 2/4: the build command itself is unchanged; it is only
      # wrapped with `/usr/bin/time -v` to record the peak RSS of the largest
      # single process (and wall time, page faults, ...) in time_v_build.txt.
      # Exit status of the build is preserved, so failures still fail the step.
      - name: Build therock-archives and therock-dist
        run: |
          if [ -x /usr/bin/time ]; then
            TIME_CMD=(/usr/bin/time -v -o "${MEM_TRACK_DIR}/time_v_build.txt")
          else
            echo "::warning::/usr/bin/time not found; peak-RSS-by-time -v is skipped (time-series sampler still active)"
            TIME_CMD=()
          fi
          "${TIME_CMD[@]}" cmake --build build --target therock-archives therock-dist -- -j32

      # Memory tracking 3/4: runs on success, failure and cancellation. Stops
      # the sampler, takes the end-of-build (or failure) snapshot, and builds
      # a summary (peak/min values from the CSV + time -v data) and an
      # optional plot (best-effort; skipped if matplotlib is unavailable).
      - name: Memory tracking - stop sampler, final snapshot and summary
        if: always()
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
        run: |
          [ -d "${MEM_TRACK_DIR}" ] || { echo "No memory tracking data; skipping."; exit 0; }
          if [ -f "${RUNNER_TEMP}/mem_sampler.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/mem_sampler.pid")" 2>/dev/null || true
          fi
          # job.status is "success" or "failure" (build outcome so far).
          "${RUNNER_TEMP}/mem_tracker.sh" snapshot "post-build-${BUILD_JOB_STATUS}" || true

          CSV="${MEM_TRACK_DIR}/memory_timeseries.csv"
          SUMMARY="${MEM_TRACK_DIR}/summary.md"
          {
            echo "### Build memory summary (job status: ${BUILD_JOB_STATUS})"
            echo
            if [ -s "${CSV}" ]; then
              awk -F, 'NR>1 {
                used=$5; avail=$4; rss=$8; cg=$7
                if (used>pu) {pu=used; tu=$1}
                if (min=="" || avail<min) {min=avail; ta=$1}
                if (rss>pr) {pr=rss; tr=$1}
                if (cg!="" && cg>pc) {pc=cg; tc=$1}
                n++
              } END {
                printf "- Samples: %d\n", n
                printf "- Peak system memory used: %.1f GiB at %s\n", pu/1048576, tu
                printf "- Min MemAvailable: %.1f GiB at %s\n", min/1048576, ta
                printf "- Peak sum of process RSS: %.1f GiB at %s\n", pr/1048576, tr
                if (pc>0) printf "- Peak cgroup memory: %.1f GiB at %s\n", pc/1073741824, tc
              }' "${CSV}"
            else
              echo "- No time-series samples were collected."
            fi
            if [ -f "${MEM_TRACK_DIR}/time_v_build.txt" ]; then
              echo "- \`time -v\` (largest single process / wall time):"
              grep -E 'Maximum resident set size|Elapsed \(wall clock\)|Exit status' "${MEM_TRACK_DIR}/time_v_build.txt" | sed 's/^\s*/  - /'
            fi
          } > "${SUMMARY}"
          cat "${SUMMARY}"
          cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"

          # Optional plot; never fails the job.
          python3 - <<'PY' || echo "Plot skipped."
          import csv, os
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          d = os.environ["MEM_TRACK_DIR"]
          rows = list(csv.DictReader(open(os.path.join(d, "memory_timeseries.csv"))))
          t = [int(r["elapsed_s"]) / 60 for r in rows]
          gib = lambda k: [int(r[k]) / 1048576 for r in rows]
          plt.figure(figsize=(10, 4))
          plt.plot(t, gib("mem_used_kb"), label="system used")
          plt.plot(t, gib("rss_sum_kb"), label="sum of process RSS")
          plt.plot(t, gib("mem_available_kb"), label="MemAvailable")
          plt.xlabel("minutes since sampler start"); plt.ylabel("GiB")
          plt.legend(); plt.grid(True); plt.tight_layout()
          plt.savefig(os.path.join(d, "memory_timeseries.png"), dpi=100)
          PY

      # Memory tracking 4/4: upload the CSV, snapshots, time -v output,
      # summary (and plot if produced) as a workflow artifact.
      - name: Memory tracking - upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-memory-tracking-${{ inputs.artifact_group }}
          path: build-memory-tracking/
          if-no-files-found: ignore
          retention-days: 30

      - name: Test Packaging
        if: ${{ github.event.repository.name == 'TheRock' }}
        run: |
          ctest --test-dir build --output-on-failure

      - name: Report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -d "./build" ]; then
            echo "Full SDK du:"
            echo "------------"
            du -h -d 1 build/dist/rocm
            echo "Artifact Archives:"
            echo "------------------"
            ls -lh build/artifacts/*.tar.xz
            echo "Artifacts:"
            echo "----------"
            du -h -d 1 build/artifacts
            echo "CCache Stats:"
            echo "-------------"
            ccache -s -v
            tail -v -n +1 .ccache/compiler_check_cache/* > build/logs/ccache_compiler_check_cache.log
          else
            echo "[ERROR] Build directory ./build does not exist. Skipping report!"
            echo "        This should only happen if the CI is cancelled before the build step."
            exit 1
          fi

      # Analyze ninja build log to generate per-component timing report
      - name: Analyze Build Times
        if: ${{ !cancelled() }}
        run: |
          python3 build_tools/analyze_build_times.py --build-dir build

      - name: Configure AWS Credentials for non-forked repos
        if: ${{ github.repository == 'ROCm/TheRock' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

      - name: Post Build Upload
        if: always()
        env:
          ARTIFACT_GROUP: ${{ inputs.artifact_group }}
        run: |
          python3 build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group "${ARTIFACT_GROUP}" \
            --build-dir build \
            --upload
