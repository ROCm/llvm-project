name: Trigger amd-debug Buildbot Build
on:
  workflow_dispatch:
  pull_request:
    branches: [amd-debug]
    types: [opened, reopened, synchronize, ready_for_review]


jobs:  
  trigger-build:
    if: github.event.pull_request.draft == false
    runs-on: 
      group: compiler-generic-runners
    env:  
      PR_SHA: ${{ github.event.pull_request.head.sha != '' && github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number != '' && github.event.pull_request.number || 0 }}
      PR_URL: ${{ github.event.pull_request.html_url != '' && github.event.pull_request.html_url || '' }}
      PR_TITLE: ${{ github.event.pull_request.title != '' && github.event.pull_request.title || '' }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref != '' && github.event.pull_request.base.ref || '' }}
      GITHUB_TOKEN: ${{secrets.CI_GITHUB_TOKEN}}
      
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Set environment variable for container image
        run: |
         echo "CONTAINER_IMAGE=${{ secrets.BUILDBOT_DOCKER_IMAGE }}" >> $GITHUB_ENV
         echo "CONTAINER_NAME=my_container_${{ github.run_id }}" >> $GITHUB_ENV
        
      - name: Pull container image
        run: docker pull "${{env.CONTAINER_IMAGE}}"      

      - name: Run container
        run: |
          docker run -d --name "${{env.CONTAINER_NAME}}" $CONTAINER_IMAGE sleep infinity
          docker exec "${{env.CONTAINER_NAME}}" /bin/bash -c "echo 'Running commands inside the container'"

      - name: Escape pull request title
        run: |
          import json
          import os
          import shlex
          with open('${{ github.event_path }}') as fh:
              event = json.load(fh)         
          escaped = event['pull_request']['title']
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              print(f'PR_TITLE={escaped}', file=fh)
        shell: python3 {0}          
        
      - name: Trigger Buildbot Build
        env:
          BUILDBOT_USER: ${{ secrets.BUILDBOT_USER }}
          BUILDBOT_PWD: ${{ secrets.BUILDBOT_PWD }}
          BUILDBOT_HOST: ${{ secrets.BUILDBOT_HOST }}
          BUILDBOT_WORKER_PORT: ${{ secrets.BUILDBOT_WORKER_PORT }}
        run: |
          docker exec \
            -e BUILDBOT_USER \
            -e BUILDBOT_PWD \
            -e BUILDBOT_HOST \
            -e BUILDBOT_WORKER_PORT \
            -e BASE_BRANCH="${{ env.BASE_BRANCH }}" \
            -e PR_SHA="${{ env.PR_SHA }}" \
            -e PR_NUMBER="${{ env.PR_NUMBER }}" \
            -e PR_TITLE="$PR_TITLE" \
            -e PR_URL="${{ env.PR_URL }}" \
            "${{env.CONTAINER_NAME}}" \
            /bin/bash -c '
              buildbot sendchange \
                -W "$BUILDBOT_USER" \
                -a "$BUILDBOT_USER:$BUILDBOT_PWD" \
                --master="$BUILDBOT_HOST:$BUILDBOT_WORKER_PORT" \
                --branch="$BASE_BRANCH" \
                --revision="$PR_SHA" \
                -p PR_NUMBER:"$PR_NUMBER" \
                -p PR_TITLE:"$PR_TITLE" \
                -p PR_URL:"$PR_URL" \
                -p SHA:"$PR_SHA"
            '
          
      - name: Set Initial Status to Pending
        run: |
          docker exec -e PR_SHA -e GITHUB_TOKEN "${{env.CONTAINER_NAME}}" /bin/bash -c "python3 -c \"
          import os
          import requests
          GITHUB_TOKEN = os.getenv('GITHUB_TOKEN')
          TARGET_SHA = os.getenv('PR_SHA')
          api_url = f'https://api.github.com/repos/AMD-Lightning-Internal/llvm-project/statuses/{TARGET_SHA}'
          headers = {
          'Authorization': f'token {GITHUB_TOKEN}',
          'Content-Type': 'application/json'
          }
          payload = {
          'state': 'pending',
          'context': 'buildbot',
          'description': 'Build is in queue'
          }
          response = requests.post(api_url, json=payload, headers=headers)
          if response.status_code == 201:
            print('Status set to pending successfully.')
          else:
            print(f'Failed to set status: {response.status_code} {response.text}')
            \""

      - name: Poll Buildbot build status
        env:
          BUILDBOT_HOST: ${{ secrets.BUILDBOT_HOST }}
          BUILDBOT_MASTER_PORT: ${{ secrets.BUILDBOT_MASTER_PORT }}
        run: |
          python3 -c "
          import os
          import sys
          import time
          import requests

          host = os.environ['BUILDBOT_HOST']
          port = os.environ['BUILDBOT_MASTER_PORT']
          build_url = f'https://{host}:{port}/api/v2/builds'
          target_sha = os.getenv('PR_SHA')
          max_retries = 10
          retry_interval = 30

          def get_build_properties(build_id):
              properties_url = f'https://{host}:{port}/api/v2/builds/{build_id}/properties'
              response = requests.get(
                  properties_url,
                  headers={'Accept': 'application/json'},
                  timeout=30,
              )
              response.raise_for_status()
              return response.json()

          for attempt in range(1, max_retries + 1):
              response = requests.get(
                  build_url,
                  headers={'Accept': 'application/json'},
                  timeout=30,
              )
              response.raise_for_status()
              builds = response.json().get('builds', [])
              build_with_sha = None

              for build in builds:
                  build_id = build['buildid']
                  properties = get_build_properties(build_id)
                  props = properties.get('properties')
                  if not props:
                      continue
                  revision = props[0].get('revision')
                  if revision and len(revision) > 0 and revision[0] == target_sha:
                      build_with_sha = build
                      break

              if build_with_sha:
                  print(f'Build started successfully for SHA: {target_sha}')
                  break

              print(f'Build for SHA not started yet (attempt {attempt}/{max_retries}); retrying in {retry_interval}s')
              time.sleep(retry_interval)
          else:
              print(f'Build did not start for SHA: {target_sha} after maximum retries')
              sys.exit(1)
          "

      - name: Stop and remove container
        if: always()
        run: |
          docker stop "${{env.CONTAINER_NAME}}"
          docker rm "${{env.CONTAINER_NAME}}"			
