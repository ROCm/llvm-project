name: Push Inputs Probe

on:
  workflow_dispatch:
    inputs:
      sample_string:
        description: "Does a string default survive a push event?"
        type: string
        default: "default-string-value"
      sample_bool:
        description: "Does a boolean default survive a push event?"
        type: boolean
        default: true
      sample_choice:
        description: "Does a choice default survive a push event?"
        type: choice
        options:
          - quick
          - full
        default: quick
  push:
    branches:
      - cursor/push-inputs-probe-b7d6

permissions:
  contents: read

jobs:
  report:
    name: Report the inputs context
    runs-on: ubuntu-24.04
    steps:
      - name: Dump what a push event sees
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          EVENT_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          SAMPLE_STRING: ${{ inputs.sample_string }}
          SAMPLE_CHOICE: ${{ inputs.sample_choice }}
        run: |
          echo "event_name: ${GITHUB_EVENT_NAME}"
          echo "toJSON(inputs): ${INPUTS_JSON}"
          echo "toJSON(github.event.inputs): ${EVENT_INPUTS_JSON}"
          echo "inputs.sample_string: '${SAMPLE_STRING}'"
          echo "inputs.sample_choice: '${SAMPLE_CHOICE}'"

      - name: Report how a boolean default behaves in a condition
        if: ${{ inputs.sample_bool }}
        run: echo "inputs.sample_bool was truthy"

      - name: Report the other way
        if: ${{ !inputs.sample_bool }}
        run: echo "inputs.sample_bool was falsy"
