# Test Branch CI for amd-compiler-vkallesh-test branch
#
# CRITICAL: This file has a unique path (test_branch_ci_vkallesh.yml) to ensure
# GitHub assigns a new workflow_id, avoiding cached metadata from the old file.
#
# DEMONSTRATION WORKFLOW: Simplified to show merge policy
# Only 2 mandatory tests required: setup + compiler-runtime build
# All other tests are optional and can fail without blocking merge
# Merge criteria: 2 mandatory tests pass + 1 approval = auto-merge

name: Test Branch CI (vkallesh)

on:
  push:
    branches:
      - main
      - multi_arch/**
      - release/therock-*
  workflow_dispatch:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X"
        default: ""
      linux_test_labels:
        type: string
        description: "If enabled, reduce test set on Linux to the list of labels prefixed with 'test:'. ex: test:rocprim, test:hipcub"
        default: ""
      windows_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Windows GPU families to build and test. ex: gfx94X, gfx120X"
        default: ""
      windows_test_labels:
        type: string
        description: "If enabled, reduce test set on Windows to the list of labels prefixed with 'test:' ex: test:rocprim, test:hipcub"
        default: ""
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"
  pull_request:
    branches: [amd-compiler-vkallesh-test]
    types:
      - labeled
      - opened
      - synchronize
      - reopened
permissions:
  contents: read

concurrency:
  # TEST BRANCH DEMONSTRATION WORKFLOW
  # This is a simplified CI workflow for amd-compiler-vkallesh-test branch
  # to demonstrate selective gating checks for auto-merge behavior.
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: test-branch-vkallesh-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  WORKFLOW_TYPE: "test-branch-demonstration"
  BRANCH_NAME: "amd-compiler-vkallesh-test"

jobs:
  setup:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request &&
       !(
         contains(github.event.pull_request.labels.*.name, 'ci:skip') &&
         (
           contains(github.event.pull_request.title, 'Update LLVM_MAIN_REVISION') ||
           (
             contains(github.event.pull_request.body, 'Automated update of') &&
             contains(github.event.pull_request.body, 'LLVM_MAIN_REVISION')
           )
         )
       ))
    uses: ./.github/workflows/setup_multi_arch_test.yml
    with:
      build_variant: "release"

  # MANDATORY TEST 2: Compiler Runtime Build
  # This is one of the 2 required tests for auto-merge
  compiler_runtime_build:
    name: Linux::release / Build Multi-Arch Stages / compiler-runtime / Stage - Compiler Runtime
    runs-on: ubuntu-24.04
    needs: setup
    if: needs.setup.outputs.enable_build_jobs == 'true'
    steps:
      - name: Simulate compiler-runtime build
        run: |
          echo "============================================================"
          echo "MANDATORY TEST 2: Compiler Runtime Build"
          echo "============================================================"
          echo "This is a mandatory test for auto-merge"
          echo "Simulating compiler-runtime build stage..."
          sleep 5
          echo "Build completed successfully!"
          echo "============================================================"

  # NON-MANDATORY TEST: gfx90a Test (intentionally fails)
  # This job demonstrates that non-mandatory tests can fail without blocking merge
  gfx90a_test:
    name: gfx90a Test
    runs-on: ubuntu-24.04
    needs: setup
    if: needs.setup.outputs.enable_build_jobs == 'true'
    steps:
      - name: Fail gfx90a Test to demonstrate non-blocking behavior
        run: |
          echo "============================================================"
          echo "NON-MANDATORY TEST: gfx90a Test"
          echo "============================================================"
          echo "This test intentionally fails to demonstrate that"
          echo "non-mandatory tests do not block merge when:"
          echo "  - 2 mandatory tests pass"
          echo "  - PR has 1 approval"
          echo "============================================================"
          exit 1

  # NON-MANDATORY TEST: Optional extra build (can fail)
  optional_extra_build:
    name: Optional Extra Build Test
    runs-on: ubuntu-24.04
    needs: setup
    if: needs.setup.outputs.enable_build_jobs == 'true'
    steps:
      - name: Optional test that can fail
        run: |
          echo "============================================================"
          echo "NON-MANDATORY TEST: Optional Extra Build"
          echo "============================================================"
          echo "This is an optional test that may fail without blocking merge"
          echo "Current time: $(date)"
          echo "Simulating an optional build step..."
          # Randomly succeed or fail to show both scenarios work
          if [ $((RANDOM % 2)) -eq 0 ]; then
            echo "This run: SUCCESS (but could fail without blocking merge)"
            exit 0
          else
            echo "This run: FAILED (demonstrating non-blocking behavior)"
            exit 1
          fi

  # CI Summary always runs to report results
  ci_summary:
    name: CI Summary
    if: always()
    needs:
      - setup
      - compiler_runtime_build
      - gfx90a_test
      - optional_extra_build
    runs-on: ubuntu-24.04
    steps:
      - name: Report workflow results
        run: |
          echo "============================================================"
          echo "CI SUMMARY FOR amd-compiler-vkallesh-test"
          echo "============================================================"
          echo ""
          echo "Mandatory Tests (required for merge):"
          echo "  1. setup / setup: ${{ needs.setup.result }}"
          echo "  2. compiler-runtime build: ${{ needs.compiler_runtime_build.result }}"
          echo ""
          echo "Non-Mandatory Tests (informational only):"
          echo "  - gfx90a Test: ${{ needs.gfx90a_test.result }}"
          echo "  - Optional Extra Build: ${{ needs.optional_extra_build.result }}"
          echo ""
          echo "Merge Policy:"
          echo "  If mandatory tests PASS + 1 approval → Auto-merge"
          echo "  Non-mandatory tests can fail without blocking"
          echo "============================================================"
