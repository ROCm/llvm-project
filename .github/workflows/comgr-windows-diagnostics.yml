name: Comgr Windows diagnostics

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      translator_ref:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    name: Trial ${{ matrix.trial }} / ${{ matrix.arm }}
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Randomized within ten A/B/C blocks, fixed before dispatch.
        include:
          - {trial: 1, arm: B}
          - {trial: 1, arm: A}
          - {trial: 1, arm: C}
          - {trial: 2, arm: C}
          - {trial: 2, arm: B}
          - {trial: 2, arm: A}
          - {trial: 3, arm: C}
          - {trial: 3, arm: A}
          - {trial: 3, arm: B}
          - {trial: 4, arm: A}
          - {trial: 4, arm: C}
          - {trial: 4, arm: B}
          - {trial: 5, arm: A}
          - {trial: 5, arm: C}
          - {trial: 5, arm: B}
          - {trial: 6, arm: C}
          - {trial: 6, arm: A}
          - {trial: 6, arm: B}
          - {trial: 7, arm: A}
          - {trial: 7, arm: B}
          - {trial: 7, arm: C}
          - {trial: 8, arm: A}
          - {trial: 8, arm: B}
          - {trial: 8, arm: C}
          - {trial: 9, arm: B}
          - {trial: 9, arm: A}
          - {trial: 9, arm: C}
          - {trial: 10, arm: A}
          - {trial: 10, arm: B}
          - {trial: 10, arm: C}
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C
      PYTHONIOENCODING: utf-8
      PILOT_ARTIFACT_RUN: ${{ inputs.run_id }}
      PILOT_SOURCE_REF: ${{ inputs.source_ref }}
      PILOT_TRANSLATOR_REF: ${{ inputs.translator_ref }}

    steps:
      - name: Configure git
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout pilot harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: diagnostics
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout artifact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          path: llvm-project
          persist-credentials: false

      - name: Checkout artifact translator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: ${{ inputs.translator_ref }}
          path: llvm-project/llvm/projects/SPIRV-LLVM-Translator
          persist-credentials: false

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install link dependency
        run: |
          vcpkg install zstd:x64-windows
          echo 'C:\vcpkg\installed\x64-windows\bin' >> "$GITHUB_PATH"

      - name: Install matching Ninja
        run: |
          ninja_dir="$(cygpath -u "$GITHUB_WORKSPACE")/.ninja"
          mkdir -p "$ninja_dir" && cd "$ninja_dir"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -O https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          echo "f550fec705b6d6ff58f2db3c374c2277a37691678d6aba463adcbb129108467a  ninja-win.zip" | sha256sum -c -
          "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -xf ninja-win.zip
          cygpath -w "$ninja_dir" >> "$GITHUB_PATH"

      - name: Download fixed build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-build-tree
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore untouched build trees
        run: |
          test ! -e build
          test ! -e build-comgr
          test ! -e build-device-libs
          tar -xmf windows-build-tree.tar
          python - <<'PY'
          from pathlib import Path
          for build, source in (
              ("build", "llvm-project/llvm"),
              ("build-comgr", "llvm-project/amd/comgr"),
              ("build-device-libs", "llvm-project/amd/device-libs"),
          ):
              lines = Path(build, "CMakeCache.txt").read_text().splitlines()
              cache = {
                  line.split(":", 1)[0]: line.split("=", 1)[1]
                  for line in lines
                  if not line.startswith(("#", "//")) and ":" in line and "=" in line
              }
              if cache["CMAKE_HOME_DIRECTORY"].lower() != Path(source).resolve().as_posix().lower():
                  raise ValueError(f"{build}: wrong source checkout")
              if cache["CMAKE_BUILD_TYPE"] != "Release":
                  raise ValueError(f"{build}: unexpected build type")
              if build == "build" and set(cache["LLVM_TARGETS_TO_BUILD"].split(";")) != {"AMDGPU", "X86", "SPIRV"}:
                  raise ValueError("Unexpected LLVM targets")
              if build == "build-comgr" and cache["BUILD_TESTING"] != "ON":
                  raise ValueError("Comgr testing is disabled")
              print(build, {key: value for key, value in cache.items() if key in (
                  "CMAKE_HOME_DIRECTORY", "CMAKE_BUILD_TYPE", "LLVM_TARGETS_TO_BUILD",
                  "LLVM_ENABLE_PROJECTS", "BUILD_TESTING")})
          PY
          # Match the existing production restore in every arm.
          rm build-comgr/amd_comgr.dll
          touch build/build.ninja build-comgr/build.ninja build-device-libs/build.ninja

      - name: Run one trial
        id: trial
        env:
          AMD_COMGR_REDIRECT_LOGS: stderr
          PILOT_ARM: ${{ matrix.arm }}
          PILOT_TRIAL: ${{ matrix.trial }}
        run: |
          python diagnostics/.github/scripts/comgr_windows_pilot.py \
            --arm "$PILOT_ARM" --trial "$PILOT_TRIAL" --output pilot-results

      # These probes happen only after the measured trial has failed.
      - name: Build debugger after failure
        id: debugger
        if: failure() && steps.trial.outcome == 'failure'
        shell: powershell
        run: |
          cl /nologo /W4 /O2 /MD diagnostics/.github/scripts/comgr_windows_debug.c /Fopilot-results/debug.obj /Fepilot-results/debug.exe /link dbghelp.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture post-failure probes
        if: failure() && steps.trial.outcome == 'failure' && steps.debugger.outcome == 'success'
        env:
          AMD_COMGR_REDIRECT_LOGS: stderr
          AMD_COMGR_CACHE: '0'
        run: |
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          export PATH="$workspace/build-comgr/test-lit:$workspace/build-comgr:$workspace/build/bin:$PATH"
          export LLVM_PATH="$(cygpath -m "$workspace/build")"
          for test in get-version status-string; do
            if test -f "build-comgr/test-lit/$test.exe"; then
              status=0
              ./pilot-results/debug.exe \
                "$(cygpath -m "$workspace/build-comgr/test-lit/$test.exe")" \
                "$(cygpath -m "$workspace/pilot-results/$test.dmp")" \
                > "pilot-results/$test-debug.txt" 2>&1 || status=$?
              echo "Post-failure $test debugger status: $status"
            fi
          done

      - name: Upload trial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comgr-pilot-${{ matrix.trial }}-${{ matrix.arm }}
          path: |
            pilot-results/*.json
            pilot-results/*.log
            pilot-results/*.txt
            pilot-results/*.sh
            pilot-results/*.dmp
          if-no-files-found: warn
          retention-days: 7
