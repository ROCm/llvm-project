name: Comgr Windows diagnostics

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      translator_ref:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure git
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: diagnostics
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          path: llvm-project
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: ${{ inputs.translator_ref }}
          path: llvm-project/llvm/projects/SPIRV-LLVM-Translator
          persist-credentials: false

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install link dependency
        run: |
          vcpkg install zstd:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\vcpkg\installed\x64-windows\bin' >> $env:GITHUB_PATH

      - name: Install matching Ninja
        shell: bash
        run: |
          ninja_dir="$(cygpath -u "$GITHUB_WORKSPACE")/.ninja"
          mkdir -p "$ninja_dir" && cd "$ninja_dir"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -O https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          echo "f550fec705b6d6ff58f2db3c374c2277a37691678d6aba463adcbb129108467a  ninja-win.zip" | sha256sum -c -
          "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -xf ninja-win.zip
          cygpath -w "$ninja_dir" >> "$GITHUB_PATH"

      - name: Download existing build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-build-tree
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore build and preserve original DLL
        shell: bash
        run: |
          tar -xmf windows-build-tree.tar
          touch build/build.ninja build-comgr/build.ninja build-device-libs/build.ninja
          mkdir -p comgr-diagnostics/original comgr-diagnostics/rebuilt
          cp build-comgr/amd_comgr.dll comgr-diagnostics/original/

      - name: Build native debugger and existing smoke tests
        run: |
          cl /nologo /W4 /O2 /MD diagnostics/.github/scripts/comgr_windows_debug.c `
            /Focomgr-diagnostics/debug.obj /Fecomgr-diagnostics/debug.exe `
            /link dbghelp.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('get-version', 'status-string')) {
            cl /nologo /O2 /Ob2 /MD /DNDEBUG /DWIN32 /D_WINDOWS /Ibuild-comgr/include `
              "llvm-project/amd/comgr/test-lit/comgr-sources/$test.c" `
              "/Focomgr-diagnostics/$test.obj" "/Fecomgr-diagnostics/original/$test.exe" `
              /link build-comgr/amd_comgr.lib /INCREMENTAL:NO
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "comgr-diagnostics/original/$test.exe" comgr-diagnostics/rebuilt/
          }

      - name: Probe original DLL
        continue-on-error: true
        run: |
          Get-FileHash comgr-diagnostics/original/amd_comgr.dll
          $failed = $false
          foreach ($test in @('get-version', 'status-string')) {
            & "./comgr-diagnostics/original/$test.exe"
            "Direct $test exit: $LASTEXITCODE" | Tee-Object "comgr-diagnostics/original/$test-direct.txt"
            $failed = $failed -or ($LASTEXITCODE -ne 0)
            & ./comgr-diagnostics/debug.exe "comgr-diagnostics/original/$test.exe" `
              "comgr-diagnostics/original/$test.dmp" 2>&1 | Tee-Object "comgr-diagnostics/original/$test-debug.txt"
            $failed = $failed -or ($LASTEXITCODE -ne 0)
          }
          if ($failed) { exit 1 }

      - name: Rebuild Comgr against the archived LLVM
        shell: bash
        run: |
          rm build-comgr/amd_comgr.dll
          ninja -d keeprsp -C build-comgr amd_comgr 2>&1 | tee comgr-diagnostics/rebuild.log
          cp build-comgr/amd_comgr.dll comgr-diagnostics/rebuilt/
          cp build-comgr/CMakeFiles/amd_comgr.rsp comgr-diagnostics/

      - name: Probe rebuilt DLL
        if: always()
        continue-on-error: true
        run: |
          Get-FileHash comgr-diagnostics/rebuilt/amd_comgr.dll
          $failed = $false
          foreach ($test in @('get-version', 'status-string')) {
            & "./comgr-diagnostics/rebuilt/$test.exe"
            "Direct $test exit: $LASTEXITCODE" | Tee-Object "comgr-diagnostics/rebuilt/$test-direct.txt"
            $failed = $failed -or ($LASTEXITCODE -ne 0)
            & ./comgr-diagnostics/debug.exe "comgr-diagnostics/rebuilt/$test.exe" `
              "comgr-diagnostics/rebuilt/$test.dmp" 2>&1 | Tee-Object "comgr-diagnostics/rebuilt/$test-debug.txt"
            $failed = $failed -or ($LASTEXITCODE -ne 0)
          }
          if ($failed) { exit 1 }

      - name: Upload diagnostic binaries and crash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comgr-windows-diagnostics
          path: comgr-diagnostics
          if-no-files-found: warn
