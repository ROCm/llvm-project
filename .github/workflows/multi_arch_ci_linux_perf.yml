# Perf-only Linux path: plain compiler-runtime, then perf-build math-libs/gfx90a.

name: Multi-Arch CI Perf - Linux (gfx90a)

on:
  workflow_call:
    inputs:
      build_config:
        type: string
        required: true
      rocm_package_version:
        type: string
        required: true
      release_type:
        type: string
        default: ""
      artifact_run_id:
        type: string
        required: false
        default: "27244173794"
      skip_compiler_runtime:
        type: boolean
        required: false
        default: true
      math_libs_subset:
        type: string
        required: false
        default: rocprim
        description: >-
          math-libs scope: "rocprim" (smoke test) or "full" (all math libs).

permissions:
  contents: read

jobs:
  build_compiler_runtime:
    name: Build compiler-runtime (plain)
    if: ${{ !inputs.skip_compiler_runtime }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts_perf.yml
    with:
      stage_name: compiler-runtime
      stage_display_name: "Stage - Compiler Runtime"
      timeout_minutes: 480
      dist_amdgpu_families: ${{ fromJSON(inputs.build_config).dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ fromJSON(inputs.build_config).build_variant_cmake_preset }}
      release_type: ${{ inputs.release_type }}
      test_type: full
      enable_perf_launcher: false
      collect_hcts: false
      artifact_run_id: ${{ inputs.artifact_run_id }}
    permissions:
      contents: read
      id-token: write

  build_math_libs_perf:
    name: Build math-libs (gfx90a, perf/HCTS${{ inputs.math_libs_subset == 'rocprim' && ', rocPRIM only' || '' }})
    needs: build_compiler_runtime
    if: >-
      ${{
        !cancelled() &&
        !contains(needs.*.result, 'failure') &&
        (needs.build_compiler_runtime.result == 'success' || inputs.skip_compiler_runtime)
      }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts_perf.yml
    with:
      stage_name: math-libs
      stage_display_name: >-
        Stage - Math Libs (gfx90a, perf${{ inputs.math_libs_subset == 'rocprim' && ', rocPRIM only' || '' }})
      timeout_minutes: 480
      amdgpu_family: gfx90a
      dist_amdgpu_families: gfx90a
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ fromJSON(inputs.build_config).build_variant_cmake_preset }}
      release_type: ${{ inputs.release_type }}
      test_type: full
      enable_perf_launcher: true
      collect_hcts: true
      artifact_run_id: ${{ inputs.artifact_run_id }}
      math_libs_subset: ${{ inputs.math_libs_subset }}
    permissions:
      contents: read
      id-token: write
