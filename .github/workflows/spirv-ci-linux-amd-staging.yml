# Linux variant of the SPIRV CI: builds LLVM/Clang/translator/Comgr in
# one job and runs SPIRV-relevant test suites in parallel test jobs that
# consume a GHA artifact uploaded by the build job.

name: HeCBench base comparison for PR 4772

on:
  build:
    name: Build
    outputs:
      translator_sha: ${{ steps.resolve_translator.outputs.sha }}
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 120
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    steps:
      # ---- Checkout ---------------------------------------------------------
      # llvm-project at PR head (this repo) provides LLVM/Clang/LLD + amd/
      # subprojects (device-libs, comgr). The SPIRV translator is pinned to
      # amd-staging and overlaid in-tree under llvm/projects/.
      - name: Checkout llvm-project (PR head)
        # On pull_request events: PR head from the (possibly fork) head repo.
        # On workflow_dispatch: the branch the dispatch was on.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: 3d2847b5350a1c1cd9c3ce3a320891a45de5edd1
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (amd-staging)
        # Pinned to amd-staging because llvm-project PRs don't change
        # the translator. Without an explicit repository/ref, checkout
        # defaults to the workflow's own repo (llvm-project) and clobbers
        # the translator path with llvm-project content.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: 572f793561e9174afe2718fd8adde3bd94576c33
          path: ${{ env.TRANSLATOR_SRC }}
          fetch-depth: 1
          persist-credentials: false

      # ---- Build LLVM + Clang + LLD + in-tree SPIRV translator --------------
      - name: Resolve translator SHA
        id: resolve_translator
        run: echo "sha=$(git -C llvm-project/llvm/projects/SPIRV-LLVM-Translator rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate translator test driver
        run: python llvm-project/.github/scripts/test_spirv_ci_lit.py

      - name: Configure LLVM
        run: |
          cmake -G Ninja -S llvm-project/llvm -B "$LLVM_BUILD" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AMDGPU;X86;SPIRV" \
            -DLLVM_INCLUDE_TESTS=ON \
            -DLLVM_INSTALL_GTEST=ON \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt" \
            -DCOMPILER_RT_BUILD_BUILTINS=ON \
            -DLLVM_LIT_ARGS="-sv --no-progress-bar"

      - name: Build LLVM + Clang + amd-llvm-spirv + test deps
        # *-test-depends pull in all tools needed for lit (FileCheck, not,
        # llc, llvm-*, clang, opt, etc.) and stay current with upstream.
        run: ninja -C "$LLVM_BUILD" llvm-test-depends clang-test-depends amd-llvm-spirv builtins

      # ---- Build device-libs (standalone, against built LLVM) --------------
      - name: Configure device-libs
        run: |
          cmake -G Ninja -S llvm-project/amd/device-libs -B "$DEVLIBS_BUILD" \
            -DCMAKE_PREFIX_PATH=$PWD/$LLVM_BUILD \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLLVM_DIR=$PWD/$LLVM_BUILD/lib/cmake/llvm

      - name: Build device-libs
        run: ninja -C "$DEVLIBS_BUILD"

      # ---- Build Comgr (standalone, against built LLVM + device-libs) ------
      - name: Configure Comgr
        # LLVM_EXTERNAL_SPIRV_LLVM_TRANSLATOR_SOURCE_DIR points Comgr at
        # the in-tree translator headers so COMGR_SPIRV_TRANSLATOR_AVAILABLE
        # turns ON (otherwise translator-dependent lit tests are UNSUPPORTED).
        run: |
          cmake -G Ninja -S llvm-project/amd/comgr -B "$COMGR_BUILD" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$PWD/$LLVM_BUILD;$PWD/$DEVLIBS_BUILD" \
            -DLLVM_DIR=$PWD/$LLVM_BUILD/lib/cmake/llvm \
            -DLLVM_EXTERNAL_SPIRV_LLVM_TRANSLATOR_SOURCE_DIR=$PWD/$TRANSLATOR_SRC \
            -DBUILD_TESTING=ON

      - name: Build Comgr
        run: ninja -C "$COMGR_BUILD" amd_comgr

      - name: Install build deps for runtime build
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            numactl-devel elfutils-libelf-devel libdrm-devel

      - name: Install comgr + device-libs into staging
        run: |
          cmake --install "$COMGR_BUILD" --prefix $PWD/$STAGING
          cmake --install "$DEVLIBS_BUILD" --prefix $PWD/$STAGING

      - name: Checkout rocm-systems
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocm-systems
          ref: 5ee6e88a36b4433c0fb4e4e7fe8b81ef8719e289
          path: rocm-systems
          persist-credentials: false

      - name: Checkout rocm-cmake
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocm-cmake
          ref: 6db2fa71ad54569b891f4fed9f6db4b6e9db3ac8
          path: rocm-cmake
          persist-credentials: false

      - name: Configure ROCR-Runtime
        run: |
          cmake -G Ninja -S rocm-systems/projects/rocr-runtime -B "$ROCR_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$PWD/$LLVM_BUILD/bin/clang \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DLLVM_DIR=$PWD/$LLVM_BUILD/lib/cmake/llvm \
            -DClang_DIR=$PWD/$LLVM_BUILD/lib/cmake/clang

      - name: Build ROCR-Runtime
        env:
          ROCM_PATH: ${{ github.workspace }}/${{ env.STAGING }}
        run: ninja -C "$ROCR_BUILD" install

      - name: Configure CLR (HIP runtime)
        run: |
          cmake -G Ninja -S rocm-systems/projects/clr -B "$CLR_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$PWD/$LLVM_BUILD/bin/clang \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD;$PWD/rocm-cmake/share/rocm" \
            -DHIP_PLATFORM=amd \
            -DHIP_COMMON_DIR=$PWD/rocm-systems/projects/hip \
            -DCLR_BUILD_HIP=ON \
            -DROCM_KPACK_ENABLED=OFF \
            -DHIP_ENABLE_ROCPROFILER_REGISTER=OFF

      - name: Build CLR
        run: ninja -C "$CLR_BUILD" install

      - name: Stage translator binary for runtime SPIRV JIT
        run: |
          mkdir -p "$STAGING/bin"
          cp -a "$LLVM_BUILD/bin/amd-llvm-spirv" "$STAGING/bin/"

      # test_hecbench compiles with hipcc.
      - name: Build and stage hipcc
        run: |
          cmake -G Ninja -S llvm-project/amd/hipcc -B build-hipcc \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C build-hipcc hipcc
          mkdir -p "$STAGING/bin"
          cp -a build-hipcc/hipcc "$STAGING/bin/hipcc"

      # Create hipconfig script for rocPRIM/hipCUB detection.
      - name: Create hipconfig script
        run: |
          mkdir -p "$STAGING/bin"
          cat > "$STAGING/bin/hipconfig" << 'EOF'
          #!/bin/bash
          case "$1" in
            --platform) echo "amd" ;;
            --compiler) echo "clang" ;;
            --runtime) echo "rocclr" ;;
            --hipclangpath) echo "$PWD/$LLVM_BUILD/bin" ;;
            *) echo "amd" ;;
          esac
          EOF
          chmod +x "$STAGING/bin/hipconfig"

      # Build rocPRIM.
      - name: Checkout rocPRIM
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocPRIM
          ref: fccd93600936140beaf7b80dd1a9e1e835ca87f8
          path: rocPRIM
          persist-credentials: false

      - name: Configure and install rocPRIM
        run: |
          export PATH=$PWD/$STAGING/bin:$PATH
          cmake -G Ninja -S rocPRIM -B "$ROCPRIM_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF
          ninja -C "$ROCPRIM_BUILD"
          cmake --install "$ROCPRIM_BUILD" --prefix $PWD/$STAGING

      # Build hipCUB.
      - name: Checkout hipCUB
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/hipCUB
          ref: 6bb974228781427ca64df2b1384041b4412f1e35
          path: hipCUB
          persist-credentials: false

      - name: Configure and install hipCUB
        run: |
          cmake -G Ninja -S hipCUB -B "$HIPCUB_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF
          ninja -C "$HIPCUB_BUILD"
          cmake --install "$HIPCUB_BUILD" --prefix $PWD/$STAGING

      # Build rocThrust (header-only; supplies thrust:: iterators to examples).
      - name: Checkout rocThrust
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocThrust
          ref: ed406e8fa49f57f3c60425d26e3937da9e6d67e0
          path: rocThrust
          persist-credentials: false

      - name: Configure and install rocThrust
        run: |
          cmake -G Ninja -S rocThrust -B "$ROCTHRUST_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF
          ninja -C "$ROCTHRUST_BUILD"
          cmake --install "$ROCTHRUST_BUILD" --prefix $PWD/$STAGING

      # Build rocRAND.
      - name: Checkout rocRAND
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/rocRAND
          ref: bbce2d0aef9db5fa47136003b78664477ef1ce1f
          path: rocRAND
          persist-credentials: false

      - name: Configure and build rocRAND
        env:
          ROCM_PATH: ${{ github.workspace }}/${{ env.STAGING }}
        run: |
          cmake -G Ninja -S rocRAND -B "$ROCRAND_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DAMDGPU_TARGETS="gfx942;amdgcnspirv" \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF \
            -DCMAKE_HIP_FLAGS="--rocm-path=$PWD/$STAGING"
          ninja -C "$ROCRAND_BUILD"
          cmake --install "$ROCRAND_BUILD" --prefix $PWD/$STAGING

      # Build hipRAND.
      - name: Checkout hipRAND
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/hipRAND
          ref: 64568c1d666748e761e813f60f2d6e671bb1bf59
          path: hipRAND
          persist-credentials: false

      - name: Configure and build hipRAND
        env:
          ROCM_PATH: ${{ github.workspace }}/${{ env.STAGING }}
        run: |
          cmake -G Ninja -S hipRAND -B "$HIPRAND_BUILD" \
            -DCMAKE_CXX_COMPILER=$PWD/$LLVM_BUILD/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/$STAGING;$PWD/$LLVM_BUILD" \
            -DCMAKE_INSTALL_PREFIX=$PWD/$STAGING \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF \
            -DROCRAND_PATH=$PWD/$STAGING
          ninja -C "$HIPRAND_BUILD"
          cmake --install "$HIPRAND_BUILD" --prefix $PWD/$STAGING

      # ---- Strip + upload artifact -----------------------------------------
      # Strip binaries to keep the artifact under GHA's 10GB cap and shorten
      # upload/download time. Tests don't need debug symbols. `--strip-unneeded`
      # preserves dynamic symbols needed at link/load time.
      - name: Strip binaries
        run: |
          find "$LLVM_BUILD" "$COMGR_BUILD" "$DEVLIBS_BUILD" "$ROCR_BUILD" "$CLR_BUILD" \
            "$ROCPRIM_BUILD" "$HIPCUB_BUILD" "$ROCTHRUST_BUILD" "$ROCRAND_BUILD" "$HIPRAND_BUILD" "$STAGING" \
            -type f \( -executable -o -name '*.so*' -o -name '*.a' \) \
            -exec strip --strip-unneeded {} + 2>/dev/null || true

      # Tar before upload: actions/upload-artifact@v4 strips +x bits and
      # excludes hidden files (loses FetchContent .git dirs).
      - name: Stage translator test driver
        run: cp llvm-project/.github/scripts/spirv_ci_lit.py build/spirv_ci_lit.py

      - name: Tar build trees
        run: |
          tar -cf linux-build-tree.tar \
            "$LLVM_BUILD" "$COMGR_BUILD" "$DEVLIBS_BUILD" "$ROCR_BUILD" "$CLR_BUILD" \
            "$ROCPRIM_BUILD" "$HIPCUB_BUILD" "$ROCTHRUST_BUILD" "$ROCRAND_BUILD" "$HIPRAND_BUILD" "$STAGING"

      - name: Upload build tree artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-build-tree
          path: linux-build-tree.tar
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  # =====================================================================
  # Test - SPIRV translator lit (with PR-head vs amd-staging baseline diff)
  # =====================================================================
  # Non-blocking: upstream Khronos breaks ~1 translator lit test per week
  # (spirv-val drift, LLVM IR changes vs DebugInfo tests, DCE). Their fixes
  # typically land within a day; our daily upstream-merge cron pulls them
  # in. Blocking here would gate unrelated PRs during those windows. The
  # baseline run partitions failures into new / fixed / pre-existing so
  # AMD-side regressions stay visible.
  test_hecbench:
    name: Test HeCBench
    needs: [build]
    runs-on: linux-gfx942-1gpu-ccs-csp-ossci-rocm
    timeout-minutes: 240
    # This image defaults inline `run:` steps to `sh`; force bash so the steps
    # below can use arrays, process substitution, and [[ ]].
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
      options: |
        --device=/dev/kfd --device=/dev/dri  --group-add video

    env:
      SCRIPTS: ${{ github.workspace }}/SPIRV-LLVM-Translator/.github/hecbench
      HECBENCH_LOG_DIR: ${{ github.workspace }}/SPIRV-LLVM-Translator/.github/hecbench/bench_logs_${{ github.run_id }}-${{ github.run_attempt }}_amdgcnspirv-be

    steps:
      # Translator .github only, at the Build job's SHA; subdir avoids the
      # untarred build/ + staging/.
      - name: Checkout SPIRV-LLVM-Translator .github (Build job SHA)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: ${{ needs.build.outputs.translator_sha }}
          path: SPIRV-LLVM-Translator
          sparse-checkout: .github
          fetch-depth: 1
          persist-credentials: false

      - name: Read HeCBench pin from translator
        run: |
          ref=$(grep -oP 'HECBENCH_REF:\s*\K\S+' \
            SPIRV-LLVM-Translator/.github/workflows/spirv-ci-linux.yml || true)
          # Full SHA only: immutable pin, no git option injection.
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad HECBENCH_REF: '$ref'"; exit 1; }
          echo "HECBENCH_REF=$ref" >> "$GITHUB_ENV"

      - name: Download build tree artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: linux-build-tree

      - name: Untar build trees
        run: tar -xmf linux-build-tree.tar

      - name: Install libnuma
        run: dnf install -y numactl-libs

      # Single sparse, shallow blob:none pass over the subset + precomputed deps
      # (ci_benchmarks.deps.txt from update_deps.sh): ~90 MB, not the full repo.
      - name: Checkout HeCBench (pinned, sparse subset)
        run: |
          git init -q HeCBench
          cd HeCBench
          git remote add origin https://github.com/ORNL/HeCBench.git
          git fetch -q --depth=1 --filter=blob:none origin "$HECBENCH_REF"
          git sparse-checkout init --no-cone
          mapfile -t paths < <(
            grep -hvE '^[[:space:]]*(#|$)' \
              "$SCRIPTS/ci_benchmarks.txt" "$SCRIPTS/ci_benchmarks.deps.txt" \
              | sed 's#^#/src/#; s#$#/#')
          git sparse-checkout set --no-cone "${paths[@]}"
          git checkout -q FETCH_HEAD
          echo "Checked out $(find src -maxdepth 1 -type d -name '*-hip' | wc -l) -hip dirs"

      # Rewrite Makefiles for the staged ROCm, then build+run+self-verify.
      # bench.sh always exits 0 (results land in its log dir); next step gates.
      - name: Run HeCBench subset
        env:
          ROCM_PATH: ${{ github.workspace }}/${{ env.STAGING }}
          HIP_CLANG_PATH: ${{ github.workspace }}/${{ env.LLVM_BUILD }}/bin
          HECBENCH_SRC: ${{ github.workspace }}/HeCBench/src
        run: |
          # Surface the toolchain layout: does staging provide a usable hipcc?
          echo "ROCM_PATH=$ROCM_PATH"; ls -la "$ROCM_PATH/bin" | grep -iE 'hip|clang' || true
          "$SCRIPTS/modify_makefiles.sh"
          FILTER=$(grep -vE '^[[:space:]]*(#|$)' "$SCRIPTS/ci_benchmarks.txt" | paste -sd,)
          "$SCRIPTS/bench.sh" --gpu-id 0 --timeout 300 --filter "$FILTER"

      - name: Gate on HeCBench results
        if: always()
        run: |
          if [[ ! -d "$HECBENCH_LOG_DIR" ]]; then
            echo "::error::No HeCBench log dir produced (run step failed early)."
            exit 1
          fi
          echo "Log dir: $HECBENCH_LOG_DIR"
          for cat in success suspect failed timeout skipped; do
            n=$( [[ -f "$HECBENCH_LOG_DIR/$cat.log" ]] && wc -l < "$HECBENCH_LOG_DIR/$cat.log" || echo 0 )
            echo "  $cat: $n"
          done
          rc=0
          for cat in failed timeout suspect; do
            if [[ -s "$HECBENCH_LOG_DIR/$cat.log" ]]; then
              echo "::group::$cat"; cat "$HECBENCH_LOG_DIR/$cat.log"; echo "::endgroup::"
              echo "::error::HeCBench $cat: $(wc -l < "$HECBENCH_LOG_DIR/$cat.log") benchmark(s)."
              rc=1
            fi
          done
          # bench.sh silently skips benchmarks it can't find or enter.
          notrun=$(grep -vE '^[[:space:]]*(#|$)' "$SCRIPTS/ci_benchmarks.txt" | sort -u \
            | comm -23 - <(cat "$HECBENCH_LOG_DIR"/{success,suspect,failed,timeout}.log | sort -u))
          if [[ -n "$notrun" ]]; then
            echo "::error::HeCBench not run: ${notrun//$'\n'/ }"
            rc=1
          fi
          if [[ ! -s "$HECBENCH_LOG_DIR/success.log" ]]; then
            echo "::error::No HeCBench benchmark succeeded — toolchain/setup problem."
            rc=1
          fi
          exit $rc

      - name: Upload HeCBench logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hecbench-logs
          path: ${{ env.HECBENCH_LOG_DIR }}/
          if-no-files-found: ignore
