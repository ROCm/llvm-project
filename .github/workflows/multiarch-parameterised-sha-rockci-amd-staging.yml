# Multi-Arch CI
#
# This is a staging workflow for the sharded multi-arch build pipeline.
# It mirrors ci.yml but uses multi_arch_build_portable_linux.yml instead of
# ci_linux.yml. Once validated, ci.yml will be updated to use the multi-arch
# sub-workflows directly.

name: Multi Arch Parameterised CI amd-staging

on:
  workflow_dispatch:
    inputs:
      LLVM_PR_URL:
        description: "LLVM upstream PR urls(supports multi PR separated by ,). ex: https://github.com/llvm/llvm-project/pull/1"
        required: false
        type: string
        default: ""
      LLVM_ROCm_PR_URL:
        description: "LLVM ROCm PR url. ex: https://github.com/ROCm/llvm-project/pull/1"
        required: false
        type: string
        default: ""
      SPIRV_PR_URL:
        description: "SPIRV PR url. ex: https://github.com/ROCm/SPIRV-LLVM-Translator/pull/1"
        required: false
        type: string
        default: ""
      HIPIFY_PR_URL:
        description: "HIPIFY PR url. ex: https://github.com/ROCm/HIPIFY/pull/1 "
        required: false
        type: string
        default: ""
      # Cherry-pick testing: name a branch instead of a PR.
      LLVM_BRANCH:
        description: "ROCm/llvm-project branch to test instead of a PR, e.g. users/estewart/revert-wave-llvm-cache-cp-10-14-26. Use for cherry-pick testing."
        required: false
        type: string
        default: ""
      THEROCK_REF:
        description: "TheRock branch supplying every other component pin, e.g. amd-compiler-2026-10-8-COT-2. Empty uses the RockCI-pinned commit."
        required: false
        type: string
        default: ""
      retain_compiler_submodules:
        description: "Keep hipify and spirv-llvm-translator exactly as THEROCK_REF pinned them, instead of floating them to amd-staging tips. Recommended for cherry-pick testing."
        type: boolean
        default: false
      # Platforms. "none" skips the platform entirely.
      linux_amdgpu_families:
        type: string
        description: 'Comma-separated list of Linux GPU families. "all" = all, "none" = skip platform.'
        default: "gfx950"
      windows_amdgpu_families:
        type: string
        description: 'Comma-separated list of Windows GPU families. "all" = all, "none" = skip platform.'
        default: "none"
      # Wheels.
      build_pytorch:
        description: "Build PyTorch wheels."
        type: boolean
        default: false
      build_jax:
        description: "Build JAX wheels."
        type: boolean
        default: false
      python_version:
        description: "Single Python version for wheel builds (empty for full matrix)."
        type: string
        default: ""
      # Tests.
      run_tests:
        description: "Run tests after the build. Uncheck for a build-only run."
        type: boolean
        default: true
      test_type:
        description: "Component test depth (quick/standard/comprehensive/full)."
        type: choice
        options:
          - quick
          - standard
          - comprehensive
          - full
        default: quick
      linux_test_labels:
        type: string
        description: "Comma-separated test options. Use test:* to filter tests (e.g. test:rocprim). Use test_filter:* to set test type (e.g. test_filter:quick)."
        default: ""
      windows_test_labels:
        type: string
        description: "Comma-separated test options. Use test:* to filter tests (e.g. test:rocprim). Use test_filter:* to set test type (e.g. test_filter:quick)."
        default: ""
      changed_projects:
        type: string
        default: ""
        description: "Comma-separated list of changed projects to filter tests (empty = run all tests)"
      # Reuse artifacts from an earlier run instead of rebuilding.
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"

permissions:
  contents: read

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit). The workflow name is prepended to avoid conflicts between
  # different workflows.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  multiple_pr_sha_params:
    runs-on: ubuntu-24.04
    steps:
      - name: Store LLVM, HIPIFY and SPIRV PR URLs into file
        run: |
          cat > ${{ github.run_id }}_PR_params.env <<'EOF'
          LLVM_PR_URL=${{ github.event.inputs.LLVM_PR_URL }}
          LLVM_ROCm_PR_URL=${{ github.event.inputs.LLVM_ROCm_PR_URL }}
          SPIRV_PR_URL=${{ github.event.inputs.SPIRV_PR_URL }}
          HIPIFY_PR_URL=${{ github.event.inputs.HIPIFY_PR_URL }}
          LLVM_BRANCH=${{ github.event.inputs.LLVM_BRANCH }}
          RETAIN_COMPILER_SUBMODULES=${{ github.event.inputs.retain_compiler_submodules }}
          EOF

      - name: Upload stored file of PR URls
        uses: actions/upload-artifact@v4
        with:
          name: multiple-pr-build-params
          path: ${{ github.run_id }}_PR_params.env
  setup:
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "release"
      linux_amdgpu_families: ${{ github.event.inputs.linux_amdgpu_families }}
      windows_amdgpu_families: ${{ github.event.inputs.windows_amdgpu_families }}              
      linux_test_labels: ${{ inputs.linux_test_labels || '' }}
      windows_test_labels: ${{ inputs.windows_test_labels || '' }}
      prebuilt_stages: ${{ inputs.prebuilt_stages || '' }}
      baseline_run_id: ${{ inputs.baseline_run_id || '' }}
      build_pytorch: ${{ github.event_name != 'workflow_dispatch' || inputs.build_pytorch }}
      build_jax: ${{ inputs.build_jax }}
      python_version: ${{ inputs.python_version || '' }}
      repository: "ROCm/TheRock"
      ref: ${{ inputs.THEROCK_REF }}

  # A CP result is only meaningful as a delta against a baseline QA already
  # tested. If the branch is not built on the llvm commit THEROCK_REF pins, the
  # build contains changes beyond the patch and neither a pass nor a fail says
  # anything useful, so this gate is deliberately blocking.
  validate_cp_base:
    name: Validate cherry-pick base
    if: ${{ inputs.LLVM_BRANCH != '' && inputs.THEROCK_REF != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Compare branch against the llvm commit TheRock pins
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_BRANCH: ${{ inputs.LLVM_BRANCH }}
          THEROCK_REF: ${{ inputs.THEROCK_REF }}
        run: |
          set -euo pipefail

          LLVM_SHA=$(git ls-remote --exit-code --heads \
            https://github.com/ROCm/llvm-project.git \
            "refs/heads/${LLVM_BRANCH}" | cut -f1) || {
            echo "::error::Branch '${LLVM_BRANCH}' not found on ROCm/llvm-project."
            exit 1
          }

          ENTRY=$(gh api "repos/ROCm/TheRock/contents/compiler/amd-llvm?ref=${THEROCK_REF}")
          BASE_SHA=$(jq -r '.sha' <<<"${ENTRY}")

          COMPARE=$(gh api "repos/ROCm/llvm-project/compare/${BASE_SHA}...${LLVM_SHA}?per_page=1")
          STATUS=$(jq -r '.status' <<<"${COMPARE}")
          AHEAD=$(jq -r '.ahead_by' <<<"${COMPARE}")
          BEHIND=$(jq -r '.behind_by' <<<"${COMPARE}")

          {
            echo "## Cherry-pick under test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| llvm-project branch | \`${LLVM_BRANCH}\` |"
            echo "| llvm-project commit | \`${LLVM_SHA:0:12}\` |"
            echo "| TheRock base branch | \`${THEROCK_REF}\` |"
            echo "| Base llvm commit | \`${BASE_SHA:0:12}\` |"
            echo "| Commits on top of base | ${AHEAD} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${STATUS}" != "ahead" ]]; then
            echo "::error::'${LLVM_BRANCH}' is '${STATUS}' relative to the llvm commit ${THEROCK_REF} pins (${BEHIND} missing, ${AHEAD} extra). Rebase onto ${BASE_SHA}."
            exit 1
          fi

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs:
      - setup
      - multiple_pr_sha_params
      - validate_cp_base
    if: >-
      ${{
        !cancelled() &&
        (needs.validate_cp_base.result == 'success' ||
         needs.validate_cp_base.result == 'skipped') &&
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_ci_linux.yml
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ inputs.test_type }}
      run_tests: ${{ inputs.run_tests }}
      changed_projects: ${{ inputs.changed_projects || '' }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}      
    permissions:
      contents: read
      id-token: write

  windows_build_and_test:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs:
      - setup
      - multiple_pr_sha_params
      - validate_cp_base
    if: >-
      ${{
        !cancelled() &&
        (needs.validate_cp_base.result == 'success' ||
         needs.validate_cp_base.result == 'skipped') &&
        needs.setup.outputs.windows_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_ci_windows.yml
    with:
      build_config: ${{ needs.setup.outputs.windows_build_config }}
      test_labels: ${{ needs.setup.outputs.windows_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ inputs.test_type }}
      run_tests: ${{ inputs.run_tests }}
      changed_projects: ${{ inputs.changed_projects || '' }}
      repository: "ROCm/TheRock"
      ref: ${{ needs.setup.outputs.ref }}        
    permissions:
      contents: read
      id-token: write

  ci_summary:
    name: CI Summary
    if: always()
    needs:
      - setup
      - linux_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.ref }}
      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
