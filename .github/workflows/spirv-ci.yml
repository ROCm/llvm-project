name: Diagnose Windows Comgr

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test_comgr:
    name: Test Comgr
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Configure git (long paths, LF line endings)
        # longpaths: llvm-project tree exceeds Windows' 260-char path limit.
        # autocrlf=false/eol=lf: avoid CRLF checkout, which breaks clang's
        # check_format_depend_* targets (clang-format emits LF).
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Install ninja
        run: |
          ninja_dir="$(cygpath -u "$GITHUB_WORKSPACE")/.ninja"
          mkdir -p "$ninja_dir" && cd "$ninja_dir"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -O https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          echo "f550fec705b6d6ff58f2db3c374c2277a37691678d6aba463adcbb129108467a  ninja-win.zip" | sha256sum -c -
          "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -xf ninja-win.zip && rm ninja-win.zip
          cygpath -w "$ninja_dir" >> "$GITHUB_PATH"
          ./ninja --version

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # zstd must be present at the same C:\vcpkg path the build job used,
      # because build.ninja embeds C:/vcpkg/installed/.../zstd.lib as a
      # build-edge input that ninja validates at planning time.
      - name: Install zstd via vcpkg
        run: vcpkg install zstd:x64-windows

      - name: Add vcpkg bin to PATH (zstd.dll runtime lookup)
        run: echo 'C:\vcpkg\installed\x64-windows\bin' >> "$GITHUB_PATH"

      - name: Checkout llvm-project (PR head)
        # On pull_request events: PR head from the (possibly fork) head repo.
        # On workflow_dispatch: the branch the dispatch was on.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (amd-staging)
        # Pinned to amd-staging because llvm-project PRs don't change
        # the translator. Without an explicit repository/ref, checkout
        # defaults to the workflow's own repo (llvm-project) and clobbers
        # the translator path with llvm-project content.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/SPIRV-LLVM-Translator
          ref: be61f04f66935a13c10b0ed75fd9c77a734d86df
          path: llvm-project/llvm/projects/SPIRV-LLVM-Translator
          fetch-depth: 1
          persist-credentials: false

      - name: Download build tree artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-tree
          run-id: 36943979656
          github-token: ${{ github.token }}

      # touch build.ninja so it's newer than CMakeCache.txt — without it
      # tar -m's per-file mtimes can trigger a cmake regen + cascade rebuild.
      - name: Untar build trees
        run: |
          tar -xmf windows-build-tree.tar
          touch build/build.ninja build-comgr/build.ninja build-device-libs/build.ninja

      - name: Probe artifact DLL
        run: python llvm-project/.github/scripts/diagnose_windows_comgr.py artifact

      - name: Build Comgr test dependencies
        run: ninja -C build-comgr all

      - name: Probe rebuilt DLL and test launchers
        run: python llvm-project/.github/scripts/diagnose_windows_comgr.py rebuilt

      - name: Run Comgr suites
        env:
          AMD_COMGR_REDIRECT_LOGS: stderr
        run: ninja -C build-comgr check-comgr

      - name: Upload diagnostic binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-comgr-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: error
