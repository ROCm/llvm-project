name: Diagnose Windows Comgr
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: llvm-project
          sparse-checkout: |
            .github/scripts
            llvm/utils/lit
          persist-credentials: false
      - name: Install zstd
        run: vcpkg install zstd:x64-windows
      - name: Add zstd to PATH
        run: echo 'C:\vcpkg\installed\x64-windows\bin' >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: windows-comgr-diagnostics
          run-id: 36968910616
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Compare simultaneous cold DLL loads
        run: python llvm-project/.github/scripts/diagnose_windows_comgr.py
