# Reusable Workflow: Build Stage Artifacts
#
# This workflow builds TheRock stage artifacts for all stages.
# Handles both generic stages (compiler-runtime, profiler-apps, etc.) and
# per-arch stages (math-libs, comm-libs) using conditional logic.
#
# Artifacts flow between stages via S3 using the artifact_manager.py tool.
#
# TODO: When kpack splitting is permanently enabled, change fetch commands to use
# --generic-only instead of --amdgpu-families for efficiency. Subsequent build
# stages only need generic (host) artifacts; device-specific kpacks are not
# needed until final packaging.

name: Build Stage Artifacts

on:
  workflow_call:
    inputs:
      stage_name:
        type: string
        required: true
        description: "Stage name (e.g., compiler-runtime, math-libs)"
      stage_display_name:
        type: string
        required: true
        description: "Human-readable display name for the job"
      timeout_minutes:
        type: number
        required: true
        description: "Job timeout in minutes"
      amdgpu_family:
        type: string
        required: false
        default: ""
        description: "GPU family for per-arch stages (empty for generic stages)"
      dist_amdgpu_families:
        type: string
        required: true
        description: "Semicolon-separated list of all GPU families for dist targets"
      rocm_package_version:
        type: string
        required: true
        description: "ROCm package version string"
      build_variant_cmake_preset:
        type: string
        required: false
        default: ""
        description: "CMake preset name for this build variant (optional)"
      release_type:
        description: 'Release type; controls artifact bucket and IAM role'
        type: string
        default: ci
      test_type:
        type: string        
      build_runs_on:
        description: "Build runner label (selected by configure script with weighted distribution)"
        type: string
        default: "aws-linux-scale-rocm-large"
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      external_repo_config:
        description: "JSON config for external repo checkout (generated by detect_external_repo_config.py)"
        type: string
        default: ""

jobs:
  build_stage:
    name: ${{ inputs.stage_display_name }}
    runs-on: ${{ inputs.build_runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:f1f9dd9b20404c239f01a02ffec61d6c2e80abcafe7fdac854f06169828e53ce # 2026-10-30
      options: -v /runner/config:/home/awsconfig/
    env:
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
      STAGE_NAME: ${{ inputs.stage_name }}
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_family }}
      BUILD_DIR: build
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      TEATIME_FORCE_INTERACTIVE: 0
      RELEASE_TYPE: ${{ inputs.release_type }}
      EXTERNAL_FETCH_SOURCES_ARGS: ${{ inputs.external_repo_config != '' && fromJSON(inputs.external_repo_config).fetch_sources_args || '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref || github.ref}}

      - name: Checkout external repository
        if: ${{ inputs.external_repo_config != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ fromJSON(inputs.external_repo_config).repository }}
          ref: ${{ fromJSON(inputs.external_repo_config).ref }}
          path: ${{ fromJSON(inputs.external_repo_config).checkout_path }}

      - name: Submodule PR update (covers parameterised and PR creation)
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/submodule-pr-update@amd-staging # zizmor: ignore[unpinned-uses] amd-staging is the reviewed moving ref; a commit pin would need an update on every change
 
      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./build_tools/setup_ccache.py \
            --release-type "${{ inputs.release_type }}" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./build_tools/health_status.py

      # Note: no AWS credentials should be needed here since our CI buckets
      # all currently have public read access.
      - name: Fetch inbound artifacts
        run: |
          python build_tools/artifact_manager.py fetch \
            --run-id=${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --amdgpu-families="${{ inputs.amdgpu_family }}" \
            --output-dir="${BUILD_DIR}" \
            --bootstrap

      - name: Carry temporary assertion patches for nightly
        if: ${{ env.LLVM_ASSERTIONS == '1' }}
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/nightly-assert-fix@amd-staging # zizmor: ignore[unpinned-uses] amd-staging is the reviewed moving ref; a commit pin would need an update on every change

      - name: Fetch sources
        timeout-minutes: 30
        run: |
             commit_log=$(./build_tools/fetch_sources.py --stage "${STAGE_NAME}" --jobs 12 --depth 1)
             echo "$commit_log" | awk -F"'" '/Submodule path/ {
               n = split($2, a, "/")
               print a[n], $4
             }' > submodule-commit-${STAGE_NAME}.txt          

      - name: build prep (patches & hotfixes for CK, tests)
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/linux-patches@amd-staging # zizmor: ignore[unpinned-uses] amd-staging is the reviewed moving ref; a commit pin would need an update on every change
        with:
          test_type: ${{ inputs.test_type }}
          stage_name: ${{ inputs.stage_name }}

      - name: Get stage configuration
        id: stage_config
        run: |
          python build_tools/configure_stage.py \
            --stage="${STAGE_NAME}" \
            --amdgpu-families="${{ inputs.amdgpu_family }}" \
            --dist-amdgpu-families="${{ inputs.dist_amdgpu_families }}" \
            --manylinux \
            --gha-output

      - name: Install stage python deps
        if: ${{ steps.stage_config.outputs.pip_install_cmd }}
        run: pip install ${{ steps.stage_config.outputs.pip_install_cmd }}

      - name: Configure PR Projects
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.test_type != 'full') }}
        env:
          cmake_preset: ${{ inputs.build_variant_cmake_preset }}
          amdgpu_families: ${{ inputs.amdgpu_families }}
          package_version: ${{ inputs.package_version }}
          extra_cmake_options: "-DTHEROCK_ENABLE_ALL=OFF -DTHEROCK_ENABLE_HIPTENSOR=OFF -DTHEROCK_ENABLE_COMPOSABLE_KERNEL=OFF -DTHEROCK_ENABLE_MIOPEN=OFF -DTHEROCK_ENABLE_MIOPENPROVIDER=OFF -DTHEROCK_ENABLE_HIPDNN=OFF -DTHEROCK_ENABLE_HIPBLASLTPROVIDER=OFF -DTHEROCK_ENABLE_HIPDNN_SAMPLES=OFF -DTHEROCK_BUILD_LLVM_TESTS=ON -DTHEROCK_BUILD_COMGR_TESTS=ON -DTHEROCK_BUILD_TESTING=ON -DLLVM_SMREV_REPO='' -DLLVM_SMREV_REVISION=''"
          BUILD_DIR: build           
        run: |
         cmake -B "${BUILD_DIR}" -S . -GNinja \
           -DTHEROCK_PACKAGE_VERSION=${{ inputs.rocm_package_version }} \
           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
           ${{ inputs.build_variant_cmake_preset && format('--preset={0}', inputs.build_variant_cmake_preset) }} \
           ${{ inputs.external_repo_config != '' && format('-DTHEROCK_{0}_SOURCE_DIR={1}', fromJSON(inputs.external_repo_config).source_package, fromJSON(inputs.external_repo_config).checkout_path) || '' }} \
           ${{ steps.stage_config.outputs.cmake_args }} \
           ${{ env.extra_cmake_options }}

      - name: Configure All Projects
        if: ${{ github.event_name != 'pull_request' && inputs.test_type == 'full' }}
        env:
          cmake_preset: ${{ inputs.build_variant_cmake_preset }}
          amdgpu_families: ${{ inputs.amdgpu_families }}
          package_version: ${{ inputs.package_version }}
          extra_cmake_options: "${{ inputs.extra_cmake_options }} -DTHEROCK_BUILD_LLVM_TESTS=ON -DTHEROCK_BUILD_COMGR_TESTS=ON -DTHEROCK_BUILD_TESTING=ON"
          BUILD_DIR: build
        run: |
         cmake -B "${BUILD_DIR}" -S . -GNinja \
           -DTHEROCK_PACKAGE_VERSION=${{ inputs.rocm_package_version }} \
           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
           ${{ inputs.build_variant_cmake_preset && format('--preset={0}', inputs.build_variant_cmake_preset) }} \
           ${{ inputs.external_repo_config != '' && format('-DTHEROCK_{0}_SOURCE_DIR={1}', fromJSON(inputs.external_repo_config).source_package, fromJSON(inputs.external_repo_config).checkout_path) || '' }} \
           ${{ steps.stage_config.outputs.cmake_args }} \
           ${{ env.extra_cmake_options }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::317668459450:role/therock-aig-sharks-compiler-ci-s3-oidc
          role-duration-seconds: 3600

      - name: Unarch ccache
        env:
          S3_BUCKET: ${{ vars.THEROCK_AIG_SHARKS_S3_BUCKET }}
          ARCHIVE_NAME: ccache_llvm_project_latest.tar
        run: |
          LOCAL_CACHE="$(ccache --get-config cache_dir)"
          
          echo "CP arch from S3"
          time aws s3 cp s3://${S3_BUCKET}/amd-staging/ccache/${ARCHIVE_NAME} /tmp/ccache.tar \
            --quiet

          echo "Extracting cache..."
          time tar -xf /tmp/ccache.tar \
            -C "$(dirname $LOCAL_CACHE)"
          
          echo "$(du -sh ${LOCAL_CACHE})"
          # Cleanup
          rm -f /tmp/ccache.tar.gz

          # FORCE disable remote storage
          ccache --set-config remote_storage=""
          ccache --set-config file_clone=true
          echo "CCACHE_REMOTE_STORAGE=" >> $GITHUB_ENV
          
      - name: Build stage
        run: |
          ccache --zero-stats
          cmake --build "${BUILD_DIR}" --target stage-${STAGE_NAME} therock-artifacts -- -k 0

      - name: Show ccache stats for build
        run: |
          echo "========================================="
          echo "ccache Stats (Build Step Only)"
          echo "========================================="
          ccache --show-stats

      - name: Create ccache archive and push to S3
        env:
          S3_BUCKET: ${{ vars.THEROCK_AIG_SHARKS_S3_BUCKET }}
        run: |
          LOCAL_CACHE="$(ccache --get-config cache_dir)"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ARCHIVE_NAME="ccache_llvm_project_latest.tar"
          
          echo "Using gz compression"
          time tar -cf "/tmp/${ARCHIVE_NAME}" \
            --exclude='*.tmp' \
            --exclude='*.lock' \
            -C "$(dirname $LOCAL_CACHE)" \
            "$(basename $LOCAL_CACHE)"
          
          echo "upload to s3"
          time aws s3 cp /tmp/${ARCHIVE_NAME} s3://${S3_BUCKET}/amd-staging/ccache/${ARCHIVE_NAME} \
              --quiet
          
      
      - name: restore cred
        if: always()
        run: |
          # Restore the runner's default credentials
          if [ "$DEFAULT_AWS_ACCESS_KEY_ID" != "EMPTY" ]; then
            echo "AWS_ACCESS_KEY_ID=$DEFAULT_AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=$DEFAULT_AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
            echo "AWS_SESSION_TOKEN=$DEFAULT_AWS_SESSION_TOKEN" >> $GITHUB_ENV
            echo "AWS_REGION=$DEFAULT_AWS_REGION" >> $GITHUB_ENV
            echo "✅ Restored default AWS credentials"
          else
            echo "⚠️  No default credentials to restore"
          fi
                  
      - name: Generate failed log summaries
        if: ${{ !cancelled() }}
        run: |
          python3 build_tools/github_actions/detect_failed_logs.py

      - name: LIT (llvm, clang, flang, mlir, lld)
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/lit-comgr-tests@amd-staging # zizmor: ignore[unpinned-uses] amd-staging is the reviewed moving ref; a commit pin would need an update on every change
        continue-on-error: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:non-blocking-compiler-tests') }}
        env:
          BUILD_DIR: ${{ env.BUILD_DIR }}
        with:
          stage_name: ${{ inputs.stage_name }}

      - name: Run build tests (Comgr, blocking)
        if: ${{ !cancelled() && inputs.stage_name == 'compiler-runtime' }}
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'ci:non-blocking-compiler-tests') }}
        env:
          TEATIME_FORCE_INTERACTIVE: 1
        run: |
          cmake --build "${BUILD_DIR}" --target build-test-amd-comgr -- -k 0

      # Remaining build tests (e.g. rocjitsu, mirage) still run and report, but
      # are not yet gating. Comgr is split out above so its failures block CI.
      # TODO(#6112): rocjitsu tests are being moved out; drop this step once done.
      - name: Run build tests (other, non-blocking)
        if: ${{ !cancelled() && inputs.stage_name == 'compiler-runtime' }}
        continue-on-error: true
        env:
          TEATIME_FORCE_INTERACTIVE: 1
        run: |
          cmake --build "${BUILD_DIR}" --target therock-build-tests -- -k 0

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "CCache Stats:"
          ccache -s -v
          echo "Artifacts:"
          ls -lh "${BUILD_DIR}"/artifacts/*.tar.xz 2>/dev/null || echo "No artifacts found"

      - name: Test Packaging
        run: |
          ctest --test-dir ${BUILD_DIR} --output-on-failure

      - name: Configure AWS credentials for artifact uploads
        if: ${{ github.repository == 'ROCm/TheRock' }}
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ${{ inputs.release_type }}

      # TODO(#3336): Attempt upload `always()`?
      #   * If some part of the build failed, partial artifacts may be useful for debugging.
      #   * This script fails if `build_dir / "artifacts"` does not exist. That's useful
      #     if the build succeeded but did not produce artifacts. That's _not_ useful
      #     if the workflow failed or was cancelled before the build even started though.
      - name: Push stage artifacts
        run: |
          python build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}"

      - name: Upload stage logs
        if: ${{ always() }}
        run: |
          python build_tools/github_actions/post_stage_upload.py \
            --run-id=${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}" \
            --amdgpu-family="${AMDGPU_FAMILIES}"
