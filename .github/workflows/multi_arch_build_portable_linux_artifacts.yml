# Reusable Workflow: Build Stage Artifacts
#
# This workflow builds TheRock stage artifacts for all stages.
# Handles both generic stages (compiler-runtime, profiler-apps, etc.) and
# per-arch stages (math-libs, comm-libs) using conditional logic.
#
# Artifacts flow between stages via S3 using the artifact_manager.py tool.
#
# TODO: When kpack splitting is permanently enabled, change fetch commands to use
# --generic-only instead of --amdgpu-families for efficiency. Subsequent build
# stages only need generic (host) artifacts; device-specific kpacks are not
# needed until final packaging.

name: Build Stage Artifacts

on:
  workflow_call:
    inputs:
      stage_name:
        type: string
        required: true
        description: "Stage name (e.g., compiler-runtime, math-libs)"
      stage_display_name:
        type: string
        required: true
        description: "Human-readable display name for the job"
      timeout_minutes:
        type: number
        required: true
        description: "Job timeout in minutes"
      amdgpu_family:
        type: string
        required: false
        default: ""
        description: "GPU family for per-arch stages (empty for generic stages)"
      dist_amdgpu_families:
        type: string
        required: true
        description: "Semicolon-separated list of all GPU families for dist targets"
      rocm_package_version:
        type: string
        required: true
        description: "ROCm package version string"
      build_variant_cmake_preset:
        type: string
        required: false
        default: ""
        description: "CMake preset name for this build variant (optional)"
      release_type:
        description: 'Release type; controls artifact bucket and IAM role'
        type: string
        default: ci
      test_type:
        type: string        
      build_runs_on:
        description: "Build runner label (selected by configure script with weighted distribution)"
        type: string
        default: "az-linux-scale-rocm-asan-prod-2"
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      external_repo_config:
        description: "JSON config for external repo checkout (generated by detect_external_repo_config.py)"
        type: string
        default: ""

jobs:
  build_stage:
    name: ${{ inputs.stage_display_name }}
    runs-on: ${{ inputs.build_runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:f1f9dd9b20404c239f01a02ffec61d6c2e80abcafe7fdac854f06169828e53ce # 2026-10-30
      options: -v /runner/config:/home/awsconfig/
    env:
      AWS_SHARED_CREDENTIALS_FILE: /home/awsconfig/credentials.ini
      STAGE_NAME: ${{ inputs.stage_name }}
      # Inputs are env vars so ${{ }} is not expanded into run scripts.
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_family }}
      DIST_AMDGPU_FAMILIES: ${{ inputs.dist_amdgpu_families }}
      ROCM_PACKAGE_VERSION: ${{ inputs.rocm_package_version }}
      BUILD_DIR: build
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      TEATIME_FORCE_INTERACTIVE: 0
      RELEASE_TYPE: ${{ inputs.release_type }}
      EXTERNAL_FETCH_SOURCES_ARGS: ${{ inputs.external_repo_config != '' && fromJSON(inputs.external_repo_config).fetch_sources_args || '' }}
      # Build memory tracking (see the "Memory tracking" steps below).
      # Directory (relative to the workspace) collecting all memory data; it is
      # uploaded as a workflow artifact at the end of the build.
      MEM_TRACK_DIR: ${{ github.workspace }}/build-memory-tracking
      # Seconds between time-series samples (CSV).
      MEM_SAMPLE_INTERVAL_SEC: 5
      # Seconds between detailed "top memory consumers" snapshots taken while
      # the build is running (mid-build phase snapshots).
      MEM_SNAPSHOT_INTERVAL_SEC: 600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # zizmor: ignore[artipacked] fetch_sources and submodule updates need the token
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout external repository
        if: ${{ inputs.external_repo_config != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          repository: ${{ fromJSON(inputs.external_repo_config).repository }}
          ref: ${{ fromJSON(inputs.external_repo_config).ref }}
          path: ${{ fromJSON(inputs.external_repo_config).checkout_path }}

      - name: Submodule PR update (covers parameterised and PR creation)
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/submodule-pr-update@amd-staging # zizmor: ignore[unpinned-uses] amd-staging is the reviewed moving ref; a commit pin would need an update on every change
 
      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./build_tools/setup_ccache.py \
            --release-type "${RELEASE_TYPE}" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./build_tools/health_status.py

      # Note: no AWS credentials should be needed here since our CI buckets
      # all currently have public read access.
      - name: Fetch inbound artifacts
        run: |
          python build_tools/artifact_manager.py fetch \
            --run-id=${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --amdgpu-families="${AMDGPU_FAMILIES}" \
            --output-dir="${BUILD_DIR}" \
            --bootstrap

      - name: Carry temporary assertion patches for nightly
        if: ${{ env.LLVM_ASSERTIONS == '1' }}
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/nightly-assert-fix@amd-staging # zizmor: ignore[unpinned-uses] amd-staging is the reviewed moving ref; a commit pin would need an update on every change

      - name: Fetch sources
        timeout-minutes: 30
        run: |
             commit_log=$(./build_tools/fetch_sources.py --stage "${STAGE_NAME}" --jobs 12 --depth 1)
             echo "$commit_log" | awk -F"'" '/Submodule path/ {
               n = split($2, a, "/")
               print a[n], $4
             }' > submodule-commit-${STAGE_NAME}.txt          

      - name: build prep (patches & hotfixes for CK, tests)
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/linux-patches@amd-staging # zizmor: ignore[unpinned-uses] amd-staging is the reviewed moving ref; a commit pin would need an update on every change
        with:
          test_type: ${{ inputs.test_type }}
          stage_name: ${{ inputs.stage_name }}

      - name: Get stage configuration
        id: stage_config
        run: |
          python build_tools/configure_stage.py \
            --stage="${STAGE_NAME}" \
            --amdgpu-families="${AMDGPU_FAMILIES}" \
            --dist-amdgpu-families="${DIST_AMDGPU_FAMILIES}" \
            --manylinux \
            --gha-output

      - name: Install stage python deps
        if: ${{ steps.stage_config.outputs.pip_install_cmd }}
        # configure_stage.py pip args stay expanded; multiple arguments are intentional.
        run: | # zizmor: ignore[template-injection]
          pip install ${{ steps.stage_config.outputs.pip_install_cmd }}

      - name: Configure PR Projects
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.test_type != 'full') }}
        env:
          cmake_preset: ${{ inputs.build_variant_cmake_preset }}
          amdgpu_families: ${{ inputs.amdgpu_families }}
          package_version: ${{ inputs.package_version }}
          extra_cmake_options: "-DTHEROCK_ENABLE_ALL=OFF -DTHEROCK_ENABLE_HIPTENSOR=OFF -DTHEROCK_ENABLE_COMPOSABLE_KERNEL=OFF -DTHEROCK_ENABLE_MIOPEN=OFF -DTHEROCK_ENABLE_MIOPENPROVIDER=OFF -DTHEROCK_ENABLE_HIPDNN=OFF -DTHEROCK_ENABLE_HIPBLASLTPROVIDER=OFF -DTHEROCK_ENABLE_HIPDNN_SAMPLES=OFF -DTHEROCK_BUILD_LLVM_TESTS=ON -DTHEROCK_BUILD_COMGR_TESTS=ON -DTHEROCK_BUILD_TESTING=ON -DLLVM_SMREV_REPO='' -DLLVM_SMREV_REVISION=''"
          BUILD_DIR: build           
        # Preset, external-repo flags, cmake_args, and extra options stay expanded so quoting is unchanged.
        run: | # zizmor: ignore[template-injection]
         cmake -B "${BUILD_DIR}" -S . -GNinja \
           -DTHEROCK_PACKAGE_VERSION="${ROCM_PACKAGE_VERSION}" \
           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
           ${{ inputs.build_variant_cmake_preset && format('--preset={0}', inputs.build_variant_cmake_preset) }} \
           ${{ inputs.external_repo_config != '' && format('-DTHEROCK_{0}_SOURCE_DIR={1}', fromJSON(inputs.external_repo_config).source_package, fromJSON(inputs.external_repo_config).checkout_path) || '' }} \
           ${{ steps.stage_config.outputs.cmake_args }} \
           ${{ env.extra_cmake_options }}

      - name: Configure All Projects
        if: ${{ github.event_name != 'pull_request' && inputs.test_type == 'full' }}
        env:
          cmake_preset: ${{ inputs.build_variant_cmake_preset }}
          amdgpu_families: ${{ inputs.amdgpu_families }}
          package_version: ${{ inputs.package_version }}
          extra_cmake_options: "${{ inputs.extra_cmake_options }} -DTHEROCK_BUILD_LLVM_TESTS=ON -DTHEROCK_BUILD_COMGR_TESTS=ON -DTHEROCK_BUILD_TESTING=ON"
          BUILD_DIR: build
        # Same fragments as Configure PR Projects.
        run: | # zizmor: ignore[template-injection]
         cmake -B "${BUILD_DIR}" -S . -GNinja \
           -DTHEROCK_PACKAGE_VERSION="${ROCM_PACKAGE_VERSION}" \
           -DCMAKE_C_COMPILER_LAUNCHER=ccache \
           -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
           ${{ inputs.build_variant_cmake_preset && format('--preset={0}', inputs.build_variant_cmake_preset) }} \
           ${{ inputs.external_repo_config != '' && format('-DTHEROCK_{0}_SOURCE_DIR={1}', fromJSON(inputs.external_repo_config).source_package, fromJSON(inputs.external_repo_config).checkout_path) || '' }} \
           ${{ steps.stage_config.outputs.cmake_args }} \
           ${{ env.extra_cmake_options }}

      - name: Reset ccache stats for clean measurement
        run: |
          ccache --zero-stats
          echo "ccache remote_only: $(ccache --get-config remote_only)"

      # Memory tracking 1/4: start background sampling and take the
      # "pre-build" snapshot. Build only; no tests are involved.
      # The helper script is written to RUNNER_TEMP (not into the repo) and is
      # used for (a) a background time-series sampler writing a CSV and
      # (b) one-shot snapshots (free, cgroup usage, top RSS processes).
      - name: Memory tracking - start sampler and pre-build snapshot
        run: |
          mkdir -p "${MEM_TRACK_DIR}"
          cat > "${RUNNER_TEMP}/mem_tracker.sh" <<'EOF'
          #!/usr/bin/env bash
          # Usage: mem_tracker.sh snapshot <label> | loop
          OUT="${MEM_TRACK_DIR}"

          # Container (cgroup) memory in bytes; v2 first, then v1. Empty if n/a.
          cgroup_bytes() {
            if [ -r /sys/fs/cgroup/memory.current ]; then
              cat /sys/fs/cgroup/memory.current
            elif [ -r /sys/fs/cgroup/memory/memory.usage_in_bytes ]; then
              cat /sys/fs/cgroup/memory/memory.usage_in_bytes
            fi
          }

          snapshot() {
            {
              echo "=== $1 @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              free -m
              echo "--- cgroup memory bytes: $(cgroup_bytes)"
              echo "--- top 15 processes by RSS (pid rss_kb elapsed command)"
              ps -eo pid,rss,etime,args --sort=-rss | head -n 16
              echo
            } >> "${OUT}/snapshots.log" 2>&1
          }

          loop() {
            local interval="${MEM_SAMPLE_INTERVAL_SEC:-5}"
            local snap_every="${MEM_SNAPSHOT_INTERVAL_SEC:-600}"
            local next_snap="${snap_every}" n=0
            echo "timestamp_utc,elapsed_s,mem_total_kb,mem_available_kb,mem_used_kb,swap_used_kb,cgroup_bytes,rss_sum_kb" > "${OUT}/memory_timeseries.csv"
            SECONDS=0
            while true; do
              # /proc/meminfo: system-wide view (mem_used = total - available).
              read -r total avail swap_total swap_free < <(awk '
                /^MemTotal:/ {t=$2} /^MemAvailable:/ {a=$2}
                /^SwapTotal:/ {st=$2} /^SwapFree:/ {sf=$2}
                END {print t, a, st, sf}' /proc/meminfo)
              # Sum of per-process RSS (shared pages are counted per process, so
              # this is an upper bound on real usage; mem_used is the accurate one).
              rss_sum=$(ps -eo rss= | awk '{s+=$1} END {print s+0}')
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),${SECONDS},${total},${avail},$((total-avail)),$((swap_total-swap_free)),$(cgroup_bytes),${rss_sum}" >> "${OUT}/memory_timeseries.csv"
              # Periodic detailed snapshot = "mid-build" phase snapshots.
              if [ "${SECONDS}" -ge "${next_snap}" ]; then
                n=$((n+1)); snapshot "mid-build-${n}"; next_snap=$((next_snap+snap_every))
              fi
              sleep "${interval}"
            done
          }

          case "$1" in
            snapshot) snapshot "${2:-unlabeled}" ;;
            loop) loop ;;
            *) echo "usage: $0 snapshot <label> | loop" >&2; exit 2 ;;
          esac
          EOF
          chmod +x "${RUNNER_TEMP}/mem_tracker.sh"
          "${RUNNER_TEMP}/mem_tracker.sh" snapshot pre-build
          # Run the sampler detached so it survives until the stop step.
          nohup "${RUNNER_TEMP}/mem_tracker.sh" loop > "${MEM_TRACK_DIR}/sampler.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mem_sampler.pid"
          echo "Memory sampler started (pid $(cat "${RUNNER_TEMP}/mem_sampler.pid"))"

      # Memory tracking 2/4: the build command itself is unchanged; it is only
      # wrapped with `/usr/bin/time -v` to record the peak RSS of the largest
      # single process (and wall time, page faults, ...) in time_v_build.txt.
      # Exit status of the build is preserved, so failures still fail the step.
      - name: Build stage
        run: |
          if [ -x /usr/bin/time ]; then
            TIME_CMD=(/usr/bin/time -v -o "${MEM_TRACK_DIR}/time_v_build.txt")
          else
            echo "::warning::/usr/bin/time not found; peak-RSS-by-time -v is skipped (time-series sampler still active)"
            TIME_CMD=()
          fi
          "${TIME_CMD[@]}" cmake --build "${BUILD_DIR}" --target stage-${STAGE_NAME} therock-artifacts -- -k 0

      # Memory tracking 3/4: runs on success, failure and cancellation. Stops
      # the sampler, takes the end-of-build (or failure) snapshot, and builds
      # a summary (peak/min values from the CSV + time -v data) and an
      # optional plot (best-effort; skipped if matplotlib is unavailable).
      - name: Memory tracking - stop sampler, final snapshot and summary
        if: always()
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
        run: |
          [ -d "${MEM_TRACK_DIR}" ] || { echo "No memory tracking data; skipping."; exit 0; }
          if [ -f "${RUNNER_TEMP}/mem_sampler.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/mem_sampler.pid")" 2>/dev/null || true
          fi
          # job.status is "success" or "failure" (build outcome so far).
          "${RUNNER_TEMP}/mem_tracker.sh" snapshot "post-build-${BUILD_JOB_STATUS}" || true

          CSV="${MEM_TRACK_DIR}/memory_timeseries.csv"
          SUMMARY="${MEM_TRACK_DIR}/summary.md"
          {
            echo "### Build memory summary (job status: ${BUILD_JOB_STATUS})"
            echo
            if [ -s "${CSV}" ]; then
              awk -F, 'NR>1 {
                used=$5; avail=$4; rss=$8; cg=$7
                if (used>pu) {pu=used; tu=$1}
                if (min=="" || avail<min) {min=avail; ta=$1}
                if (rss>pr) {pr=rss; tr=$1}
                if (cg!="" && cg>pc) {pc=cg; tc=$1}
                n++
              } END {
                printf "- Samples: %d\n", n
                printf "- Peak system memory used: %.1f GiB at %s\n", pu/1048576, tu
                printf "- Min MemAvailable: %.1f GiB at %s\n", min/1048576, ta
                printf "- Peak sum of process RSS: %.1f GiB at %s\n", pr/1048576, tr
                if (pc>0) printf "- Peak cgroup memory: %.1f GiB at %s\n", pc/1073741824, tc
              }' "${CSV}"
            else
              echo "- No time-series samples were collected."
            fi
            if [ -f "${MEM_TRACK_DIR}/time_v_build.txt" ]; then
              echo "- \`time -v\` (largest single process / wall time):"
              grep -E 'Maximum resident set size|Elapsed \(wall clock\)|Exit status' "${MEM_TRACK_DIR}/time_v_build.txt" | sed 's/^\s*/  - /'
            fi
          } > "${SUMMARY}"
          cat "${SUMMARY}"
          cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"

          # Optional plot; never fails the job.
          python3 - <<'PY' || echo "Plot skipped."
          import csv, os
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          d = os.environ["MEM_TRACK_DIR"]
          rows = list(csv.DictReader(open(os.path.join(d, "memory_timeseries.csv"))))
          t = [int(r["elapsed_s"]) / 60 for r in rows]
          gib = lambda k: [int(r[k]) / 1048576 for r in rows]
          plt.figure(figsize=(10, 4))
          plt.plot(t, gib("mem_used_kb"), label="system used")
          plt.plot(t, gib("rss_sum_kb"), label="sum of process RSS")
          plt.plot(t, gib("mem_available_kb"), label="MemAvailable")
          plt.xlabel("minutes since sampler start"); plt.ylabel("GiB")
          plt.legend(); plt.grid(True); plt.tight_layout()
          plt.savefig(os.path.join(d, "memory_timeseries.png"), dpi=100)
          PY

      # Memory tracking 4/4: upload the CSV, snapshots, time -v output,
      # summary (and plot if produced) as a workflow artifact.
      - name: Memory tracking - upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-memory-tracking-${{ inputs.stage_name }}
          path: build-memory-tracking/
          if-no-files-found: ignore
          retention-days: 30

      - name: Show ccache stats for build
        if: always()
        run: |
          echo "========================================="
          echo "CCache Stats (Build Step Only)"
          echo "========================================="
          ccache --show-stats
          
          echo ""
          echo "Key metrics:"
          ccache --show-stats | grep -E "Cacheable calls|cache hits|Cache misses|hit rate"

      - name: Generate failed log summaries
        if: ${{ !cancelled() }}
        run: |
          python3 build_tools/github_actions/detect_failed_logs.py

      - name: LIT (llvm, clang, flang, mlir, lld)
        uses: ROCm/llvm-project/.github/actions/rock-ci-deps/lit-comgr-tests@amd-staging # zizmor: ignore[unpinned-uses] amd-staging is the reviewed moving ref; a commit pin would need an update on every change
        continue-on-error: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:non-blocking-compiler-tests') }}
        env:
          BUILD_DIR: ${{ env.BUILD_DIR }}
        with:
          stage_name: ${{ inputs.stage_name }}

      - name: Run build tests (Comgr, blocking)
        if: ${{ !cancelled() && inputs.stage_name == 'compiler-runtime' }}
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'ci:non-blocking-compiler-tests') }}
        env:
          TEATIME_FORCE_INTERACTIVE: 1
        run: |
          cmake --build "${BUILD_DIR}" --target build-test-amd-comgr -- -k 0

      # Remaining build tests (e.g. rocjitsu, mirage) still run and report, but
      # are not yet gating. Comgr is split out above so its failures block CI.
      # TODO(#6112): rocjitsu tests are being moved out; drop this step once done.
      - name: Run build tests (other, non-blocking)
        if: ${{ !cancelled() && inputs.stage_name == 'compiler-runtime' }}
        continue-on-error: true
        env:
          TEATIME_FORCE_INTERACTIVE: 1
        run: |
          cmake --build "${BUILD_DIR}" --target therock-build-tests -- -k 0

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "CCache Stats:"
          ccache -s -v
          echo "Artifacts:"
          ls -lh "${BUILD_DIR}"/artifacts/*.tar.xz 2>/dev/null || echo "No artifacts found"

      - name: Test Packaging
        run: |
          ctest --test-dir ${BUILD_DIR} --output-on-failure

      - name: Configure AWS credentials for artifact uploads
        if: ${{ github.repository == 'ROCm/TheRock' }}
        uses: ./.github/actions/configure_aws_artifacts_credentials # zizmor: ignore[self-repository] action lives in TheRock, not this repo
        with:
          release_type: ${{ inputs.release_type }}

      # TODO(#3336): Attempt upload `always()`?
      #   * If some part of the build failed, partial artifacts may be useful for debugging.
      #   * This script fails if `build_dir / "artifacts"` does not exist. That's useful
      #     if the build succeeded but did not produce artifacts. That's _not_ useful
      #     if the workflow failed or was cancelled before the build even started though.
      - name: Push stage artifacts
        run: |
          python build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}"

      - name: Upload stage logs
        if: ${{ always() }}
        run: |
          python build_tools/github_actions/post_stage_upload.py \
            --run-id=${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}" \
            --amdgpu-family="${AMDGPU_FAMILIES}"
