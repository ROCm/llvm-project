#
# zizmor configuration
# Reference: https://docs.zizmor.sh/configuration/
# Local scan: zizmor --config .github/scan_tools_configs/zizmor.yml .
#
# Zizmor configuration for this repository's security scans.
#
# This file defines the complete scanner policy;
# Keep repository-specific suppressions and tuning here.
#
# Zizmor has no ignore file. Suppress a finding with:
#
#   1. An inline comment naming the rule:
#          run: | # zizmor: ignore[template-injection] input is validated
#
#   2. `rules.<rule-id>.ignore` with `<file>[:<line>[:<col>]]`:
#          rules:
#            template-injection:
#              ignore:
#                - safe.yml
#
#   3. `rules.<rule-id>.disable: true` to disable a rule repository-wide.
#
# Add rule-specific settings and suppressions under `rules:`.

rules:
  unpinned-uses:
    config:
      policies:
        # Security owns this workflow and moves the v1 tag.
        ROCm/rocm-security-gh/.github/workflows/security-baseline.yml: ref-pin
  dangerous-triggers:
    ignore:
      # Upstream LLVM release-backport workflow. issue_comment is the
      # /cherry-pick command channel. Jobs run only when github.repository
      # is llvm/llvm-project, so they do not run in this fork.
      - issue-release-workflow.yml
      # Posts CI results on LLVM pull requests. The job runs only when
      # github.repository is llvm/llvm-project.
      - issue-write.yml
      # Comments with buildbot information after an LLVM merge. The job
      # runs only when github.repository is llvm/llvm-project.
      - merged-prs.yml
      # Notifies LLVM issue subscribers. The job runs only when
      # github.repository is llvm/llvm-project.
      - subscriber.yml
  unpinned-images:
    ignore:
      # Upstream MLIR SPIR-V CI. The job runs only when
      # github.repository_owner == 'llvm', so it does not run in this fork.
      - mlir-spirv-tests.yml
      # Upstream compiler-rt + LLVM-libc builtins CI. The job runs only when
      # github.repository_owner == 'llvm', so it does not run in this fork.
      - compiler-rt-libc-builtins-tests.yml
      # Upstream LLVM-libc overlay CI. Both jobs run only when
      # github.repository_owner == 'llvm', so they do not run in this fork.
      # The matrix and qemu images are digest-pinned; zizmor flags
      # `container: ${{ matrix.container || null }}` because it cannot
      # see through that expression.
      - libc-overlay-tests.yml
